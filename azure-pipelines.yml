# Azure DevOps Pipeline — Mi Propósito 2.0
#
# Pipeline incremental: detecta qué microservicios cambiaron en el push y solo
# rebuilda/redeploya esos. Si tocaron archivos compartidos (proto, pkg, deploy,
# go.work, este archivo) o si el release Helm aún no existe, hace full rebuild.
#
# Stages:
#   1. Test    → go test ./... por servicio cambiado
#   2. Images  → docker build/push de imágenes de servicios cambiados
#   3. Deploy  → helm upgrade incremental (solo cambia tags de servicios rebuilt)
#                con manual approval gate.
#
# Variables esperadas (Library / Variable Group "miproposito-cicd"):
#   - acrName              (ej: "mipropositoacr")
#   - acrLoginServer       (ej: "mipropositoacr.azurecr.io")
#   - aksResourceGroup     (ej: "rg-miproposito")
#   - aksClusterName       (ej: "aks-miproposito")
#   - keyVaultName, tenantId, secretsProviderClientId, valuesFile
#   - serviceConnectionArm (ARM service connection — ej: "azure-subscription")
#   - serviceConnectionAcr (Docker Registry connection — ej: "acr-connection")

trigger:
  branches:
    include: [ main ]
  paths:
    include:
      - users_service/**
      - exams_service/**
      - keys_service/**
      - satisfaction_service/**
      - hubspot_service/**
      - analytics_service/**
      - gateway/**
      - proto/**
      - pkg/**
      - deploy/**
      - go.work
      - azure-pipelines.yml

pr:
  branches:
    include: [ main ]

variables:
  - group: miproposito-cicd
  - name: imageTag
    value: $(Build.BuildId)
  - name: goVersion
    value: '1.24'
  # Lista canónica de microservicios. Si agregás uno nuevo, sumalo acá y al
  # mapping `SERVICES` del stage Images.
  - name: allServices
    value: 'users_service exams_service keys_service satisfaction_service hubspot_service analytics_service gateway'

pool:
  vmImage: ubuntu-latest

stages:
# =========================================================
# Stage 1 — Detect changes + Test
# =========================================================
- stage: Test
  displayName: 'Detect changes & test'
  jobs:
  - job: DetectAndTest
    displayName: 'Detect changes & go test'
    steps:
      - checkout: self
        fetchDepth: 2   # necesitamos HEAD~1 para diff. 2 es suficiente.

      - task: GoTool@0
        inputs: { version: '$(goVersion)' }

      - script: |
          set -e
          ALL_SVCS="$(allServices)"

          # Detectar archivos cambiados desde el commit anterior. Si HEAD~1 no
          # existe (primer commit / fetchDepth insuficiente) o si el cambio
          # tocó archivos COMPARTIDOS (afectan a TODOS los servicios), forzamos
          # full rebuild.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No hay commit anterior — full rebuild"
            CHANGED_SVCS="$ALL_SVCS"
          else
            CHANGED_PATHS=$(git diff --name-only HEAD~1 HEAD)
            echo "Archivos cambiados en este push:"
            echo "$CHANGED_PATHS" | sed 's/^/  - /'

            # Triggers de full rebuild: cualquier cambio en pkg/, proto/, go.work
            # o el propio pipeline implica que TODOS los servicios pueden estar afectados.
            if echo "$CHANGED_PATHS" | grep -qE "^(pkg/|proto/|go\.work|azure-pipelines\.yml)"; then
              echo ""
              echo "Cambio en archivo compartido — full rebuild"
              CHANGED_SVCS="$ALL_SVCS"
            else
              CHANGED_SVCS=""
              for svc in $ALL_SVCS; do
                if echo "$CHANGED_PATHS" | grep -q "^$svc/"; then
                  CHANGED_SVCS="$CHANGED_SVCS $svc"
                fi
              done
              CHANGED_SVCS=$(echo "$CHANGED_SVCS" | xargs)  # trim leading space
            fi
          fi

          if [ -z "$CHANGED_SVCS" ]; then
            echo ""
            echo "Ningún microservicio cambió — solo cambios en deploy/ u otros archivos no relacionados con código."
            echo "Igual ejecutamos tests para sanidad, pero el stage Images saltea sin builds."
            CHANGED_SVCS=""
          fi

          echo ""
          echo "Servicios afectados: ${CHANGED_SVCS:-(ninguno)}"

          # Exportamos la lista para que stages downstream la consuman.
          echo "##vso[task.setvariable variable=changedServices;isOutput=true]$CHANGED_SVCS"
        displayName: 'Detectar servicios cambiados'
        name: detect

      - script: |
          set -e
          CHANGED="$(detect.changedServices)"

          if [ -z "$CHANGED" ]; then
            echo "Sin servicios cambiados — saltando tests."
            exit 0
          fi

          for s in $CHANGED; do
            echo ""
            echo "=== go test $s ==="
            (cd $s && go build ./... && go vet ./... && go test -count=1 -race -cover ./...)
          done
        displayName: 'Build + vet + test (solo servicios cambiados)'

# =========================================================
# Stage 2 — Build & Push images (solo servicios cambiados)
# =========================================================
- stage: Images
  displayName: 'Docker build & push (incremental)'
  dependsOn: Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    changedServices: $[ stageDependencies.Test.DetectAndTest.outputs['detect.changedServices'] ]
  jobs:
  - job: BuildPush
    displayName: 'Build & push'
    condition: ne(variables['changedServices'], '')
    steps:
      - checkout: self

      - task: Docker@2
        displayName: 'Login ACR'
        inputs:
          command: login
          containerRegistry: $(serviceConnectionAcr)

      - script: |
          set -e
          REG="$(acrName).azurecr.io"
          TAG="$(imageTag)"
          CHANGED="$(changedServices)"

          # Mapping service → targets (debe matchear con los Dockerfiles multi-stage).
          declare -A SERVICES=(
            [users_service]="server migrate bootstrap"
            [exams_service]="server migrate"
            [keys_service]="server migrate"
            [satisfaction_service]="server migrate"
            [hubspot_service]="server worker"
            [analytics_service]="server"
            [gateway]="server"
          )

          echo "Reconstruyendo imágenes de: $CHANGED"
          echo ""

          for svc in $CHANGED; do
            base=$(echo $svc | tr _ -)   # users_service → users-service
            for target in ${SERVICES[$svc]}; do
              if [ "$target" = "server" ]; then
                tag="$REG/$base:$TAG"
              else
                tag="$REG/$base-$target:$TAG"
              fi
              echo "Building $tag (target=$target)"
              # gateway importa protos de hermanos via go.work — contexto raíz.
              if [ "$svc" = "gateway" ]; then
                docker build --target $target -t $tag -f $svc/Dockerfile .
              else
                docker build --target $target -t $tag $svc
              fi
              docker push $tag
            done
          done
        displayName: 'Build & push (incremental)'

# =========================================================
# Stage 3 — Deploy to AKS (incremental, manual approval)
# =========================================================
- stage: Deploy
  displayName: 'Helm upgrade en AKS (incremental)'
  dependsOn:
    - Test
    - Images
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    changedServices: $[ stageDependencies.Test.DetectAndTest.outputs['detect.changedServices'] ]
  jobs:
  - deployment: HelmUpgrade
    environment: miproposito-prod
    strategy:
      runOnce:
        deploy:
          steps:
            # Los deployment jobs no hacen checkout por default.
            - checkout: self

            - task: HelmInstaller@0
              inputs: { helmVersionToInstall: 'latest' }

            - task: AzureCLI@2
              displayName: 'Instalar NGINX Ingress controller (idempotente)'
              inputs:
                azureSubscription: $(serviceConnectionArm)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az aks get-credentials -g $(aksResourceGroup) -n $(aksClusterName) --overwrite-existing
                  helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx >/dev/null 2>&1 || true
                  helm repo update >/dev/null
                  helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
                    --namespace ingress-nginx --create-namespace \
                    --set controller.service.type=LoadBalancer \
                    --set controller.publishService.enabled=true \
                    --wait --timeout 5m

            - task: AzureCLI@2
              displayName: 'helm upgrade miproposito (full o incremental)'
              inputs:
                azureSubscription: $(serviceConnectionArm)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az aks get-credentials -g $(aksResourceGroup) -n $(aksClusterName) --overwrite-existing
                  cd deploy/helm/miproposito
                  helm dependency build

                  CHANGED="$(changedServices)"

                  # ¿Existe ya el release? Si no → install full. Si sí → upgrade
                  # incremental (solo cambia tags de servicios rebuilt vía --set
                  # per-chart, los demás charts mantienen sus tags actuales por
                  # --reuse-values).
                  if helm status miproposito -n miproposito >/dev/null 2>&1; then
                    RELEASE_EXISTS=true
                  else
                    RELEASE_EXISTS=false
                  fi

                  if [ "$RELEASE_EXISTS" = "false" ]; then
                    # Install full: necesitamos UN tag base que exista para TODOS
                    # los servicios + overrides per-servicio para los que cambiaron
                    # en este run. Sin esto, helm intenta usar tag $(imageTag) para
                    # services no buildeados → ImagePullBackOff.
                    LAST_ACR_TAG=$(az acr repository show-tags \
                      --name $(acrName) --repository users-service \
                      --orderby time_desc --top 1 -o tsv 2>/dev/null || echo "")
                    if [ -z "$CHANGED" ]; then
                      # Sin services cambiados: todo viene del último tag.
                      if [ -z "$LAST_ACR_TAG" ]; then
                        echo ">>> ERROR: sin servicios cambiados Y sin imágenes en ACR. Hacer un commit que toque algún _service/."
                        exit 1
                      fi
                      BASE_TAG=$LAST_ACR_TAG
                      PER_SVC_SETS=""
                      echo ">>> Install full sin cambios — todos los services usan tag $BASE_TAG"
                    elif [ -z "$LAST_ACR_TAG" ]; then
                      # Primer deploy de la historia: $(imageTag) buildeó TODOS los services.
                      BASE_TAG=$(imageTag)
                      PER_SVC_SETS=""
                      echo ">>> Install full primer deploy — todos los services con tag $BASE_TAG"
                    else
                      # Caso típico: hay imágenes previas en ACR + algunos services cambiaron
                      # en este run. Tag base = último de ACR (para no-cambiados); override
                      # per-servicio con el tag actual (para cambiados).
                      BASE_TAG=$LAST_ACR_TAG
                      PER_SVC_SETS=""
                      for svc in $CHANGED; do
                        base=$(echo $svc | tr _ -)
                        PER_SVC_SETS="$PER_SVC_SETS --set-string ${base}.image.tag=$(imageTag)"
                      done
                      echo ">>> Install full mixto — base=$BASE_TAG, services rebuilt=$(imageTag) [$CHANGED]"
                    fi

                    # --set-string fuerza tipos string. Sin esto, Helm parsea
                    # imageTag numérico (Build.BuildId=15) como int64 y rompe
                    # el printf "%s:%s" del helper de imagen → InvalidImageName.
                    helm upgrade --install miproposito . \
                      -n miproposito --create-namespace \
                      -f $(valuesFile) \
                      --set-string global.imageTag=$BASE_TAG \
                      --set-string global.imageRegistry=$(acrLoginServer) \
                      --set-string global.keyVault.name=$(keyVaultName) \
                      --set-string global.keyVault.tenantId=$(tenantId) \
                      --set-string global.keyVault.userAssignedIdentityID=$(secretsProviderClientId) \
                      $PER_SVC_SETS \
                      --timeout 10m
                  elif [ -z "$CHANGED" ]; then
                    echo ">>> Release existe pero sin servicios cambiados — nada que deployar"
                    exit 0
                  else
                    # Upgrade incremental: --reuse-values mantiene global.imageTag
                    # del release anterior, y --set-string <service>.image.tag=NEW
                    # solo afecta los charts cuyos servicios cambiaron. Kubernetes
                    # solo reinicia esos Deployments.
                    echo ">>> Upgrade incremental — solo: $CHANGED"
                    HELM_SETS=""
                    for svc in $CHANGED; do
                      base=$(echo $svc | tr _ -)
                      HELM_SETS="$HELM_SETS --set-string ${base}.image.tag=$(imageTag)"
                    done

                    helm upgrade miproposito . \
                      -n miproposito \
                      --reuse-values \
                      $HELM_SETS \
                      --timeout 10m
                  fi

            - script: |
                if [ -n "$(smokeTestUrl)" ]; then
                  bash deploy/smoke-test.sh "$(smokeTestUrl)"
                else
                  echo "smokeTestUrl no configurada — saltando smoke tests."
                fi
              displayName: 'Smoke tests'
              continueOnError: true
