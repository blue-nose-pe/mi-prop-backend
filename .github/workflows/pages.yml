# Publica deploy/api-docs/ a GitHub Pages.
#
# Cómo activarlo (una vez):
#   GitHub repo → Settings → Pages → Build and deployment → Source:
#   "GitHub Actions". Después de eso, este workflow corre solo en cada
#   push a main que toque la doc.
#
# URL del sitio: https://blue-nose-pe.github.io/mi-prop-backend/
#
# Cómo agregar dominio custom (ej. docs.miproposito.ucsp.edu.pe):
#   1. crear archivo deploy/api-docs/CNAME con el dominio
#   2. agregar registro DNS CNAME apuntando a blue-nose-pe.github.io
#   3. en Settings → Pages → Custom domain ingresar el dominio

name: Deploy API Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/api-docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:  # botón manual en la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez. Si llegan dos pushes seguidos, se cancelan
# los anteriores en cola para que el más reciente gane.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy/api-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
