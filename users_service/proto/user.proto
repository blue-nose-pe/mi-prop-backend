syntax = "proto3";

package users.v1;

option go_package = "users_service/proto/gen;userspb";

import "google/protobuf/timestamp.proto";
import "common/search.proto";

// --------- Service ---------
service UserService {
  // Single-item retrievals (not HubSpot-style; use SearchUsers for filtering).
  rpc CreateUser      (CreateUserRequest)     returns (UserResponse);
  rpc GetUser         (GetUserRequest)        returns (UserResponse);
  rpc GetUserByEmail  (GetUserByEmailRequest) returns (UserResponse);
  rpc UpdateUser      (UpdateUserRequest)     returns (UserResponse);
  rpc DeactivateUser  (DeactivateUserRequest) returns (EmptyResponse);
  rpc ReactivateUser  (ReactivateUserRequest) returns (UserResponse);

  // Sobre el caller autenticado.
  rpc Me               (EmptyRequest)        returns (MeResponse);
  rpc ChangeMyPassword (ChangeMyPasswordRequest) returns (EmptyResponse);

  // Solo superadmins.
  rpc ResetPassword    (ResetPasswordRequest)    returns (ResetPasswordResponse);

  // HubSpot-style search: filterGroups (AND within, OR across) + properties + limit.
  rpc SearchUsers (common.v1.SearchRequest) returns (common.v1.SearchResponse);

  rpc AssignPermissionGroup (AssignGroupRequest)   returns (EmptyResponse);
  rpc RevokePermissionGroup (RevokeGroupRequest)   returns (EmptyResponse);
  rpc ListUserPermissions   (ListPermsRequest)     returns (ListPermsResponse);
  rpc HasPermission         (HasPermissionRequest) returns (HasPermissionResponse);
}

// SchoolService — lecturas sobre school. No exponemos CreateSchool por
// gRPC: los colegios se crean implícitamente al promover un user a
// representante de colegio (flow administrativo aparte).
service SchoolService {
  rpc GetSchool      (GetSchoolRequest)      returns (SchoolResponse);
  rpc ListSchools    (ListSchoolsRequest)    returns (ListSchoolsResponse);
  rpc CreateSchool   (CreateSchoolRequest)   returns (SchoolResponse);
  rpc UpdateSchool   (UpdateSchoolRequest)   returns (SchoolResponse);
  // ListSchoolsByAsesor: colegios donde el asesor es el responsable vigente
  // (assignment kind=asesor_de_colegio, valid_to IS NULL).
  rpc ListSchoolsByAsesor (ListSchoolsByAsesorRequest) returns (ListSchoolsResponse);
  // AssignAsesor: crea una assignment SCD-2 nueva (kind=asesor_de_colegio)
  // y cierra la vigente anterior si existe (valid_to = NOW). Idempotente
  // si el asesor ya esta asignado.
  rpc AssignAsesor        (AssignAsesorRequest)        returns (EmptyResponse);
}

// LeadService — captacion de leads de la landing publica "Preparate"
// (simulacro masivo). CreateLead es PUBLICO (lo invoca el gateway en
// /api/public/leads sin auth): el lead es un contacto anonimo que aun no
// tiene cuenta. ListLeads alimenta la reporteria del simulacro masivo
// (permiso analytics.simulacro_masivo.read en el gateway).
service LeadService {
  rpc CreateLead (CreateLeadRequest) returns (LeadResponse);
  rpc ListLeads  (ListLeadsRequest)  returns (ListLeadsResponse);
}

// VisitaService — CRUD de visitas (presenciales o remotas) que un asesor
// hace a un colegio. Mantenido como entidad operativa del modulo P1
// reimplementada en P2.
service VisitaService {
  rpc CreateVisita (CreateVisitaRequest) returns (VisitaResponse);
  rpc UpdateVisita (UpdateVisitaRequest) returns (VisitaResponse);
  rpc GetVisita    (GetVisitaRequest)    returns (VisitaResponse);
  rpc ListVisitas  (ListVisitasRequest)  returns (ListVisitasResponse);
}

// PermissionGroupService — administración de grupos de permisos (roles).
//
// El catálogo de permisos individuales (`permission`) lo define Blue Nose
// vía migraciones SQL (cada code está atado al permission_map del código
// Go que valida cada RPC). El cliente puede LISTAR los permisos disponibles
// y combinarlos libremente en los grupos que cree.
service PermissionGroupService {
  rpc CreateGroup     (CreateGroupRequest)       returns (PermissionGroupResponse);
  rpc UpdateGroup     (UpdateGroupRequest)       returns (PermissionGroupResponse);
  rpc DeleteGroup     (DeleteGroupRequest)       returns (EmptyResponse);
  rpc GetGroup        (GetGroupRequest)          returns (PermissionGroupResponse);
  rpc ListGroups      (EmptyRequest)             returns (ListGroupsResponse);
  rpc AddPermission   (AddPermissionRequest)     returns (EmptyResponse);
  rpc RemovePermission(RemovePermissionRequest)  returns (EmptyResponse);
  rpc ListPermissions (EmptyRequest)             returns (ListPermissionsResponse);
  rpc ListGroupUsers  (ListGroupUsersRequest)    returns (ListGroupUsersResponse);
}

message PermissionGroup {
  uint32 id          = 1;
  string code        = 2;
  string name        = 3;
  string description = 4;
  bool   active      = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated Permission permissions = 8;
}

message Permission {
  uint32 id          = 1;
  string code        = 2;
  string scope       = 3;
  string name        = 4;
  string description = 5;
}

message CreateGroupRequest {
  string code        = 1; // único; ej "marketing_permissions"
  string name        = 2;
  string description = 3;
  // permission_ids opcional al momento de crear; el cliente puede
  // agregarlos después con AddPermission.
  repeated uint32 permission_ids = 4;
}

message UpdateGroupRequest {
  uint32 id          = 1;
  string name        = 2;
  string description = 3;
}

message DeleteGroupRequest { uint32 id = 1; }
message GetGroupRequest    { uint32 id = 1; }

message PermissionGroupResponse { PermissionGroup group = 1; }
message ListGroupsResponse      { repeated PermissionGroup items = 1; }
message ListPermissionsResponse { repeated Permission items = 1; }

message ListGroupUsersRequest {
  uint32 group_id    = 1;
  string search      = 2;  // matchea email, first_name, last_name o document_number
  uint32 limit       = 3;  // 0 = default 100, max 1000
  uint32 offset      = 4;
  bool   active_only = 5;
}
message ListGroupUsersResponse {
  repeated User items = 1;
  uint32 total = 2;
}

message AddPermissionRequest {
  uint32 group_id      = 1;
  uint32 permission_id = 2;
}

message RemovePermissionRequest {
  uint32 group_id      = 1;
  uint32 permission_id = 2;
}

message GetSchoolRequest { string id = 1; }
message SchoolResponse   { School school = 1; }

message ListSchoolsRequest {
  string search = 1;       // filtro por nombre (LIKE %search%), opcional
  uint32 limit  = 2;       // 0 = default 100, max 1000
  uint32 offset = 3;
  bool   active_only = 4;  // si true, solo schools activos
}
message ListSchoolsResponse {
  repeated School items = 1;
  uint32 total = 2;        // total sin paginar (para la UI de paginacion)
}

message ListSchoolsByAsesorRequest {
  string asesor_id = 1;
}

message AssignAsesorRequest {
  string school_id = 1;
  string user_id   = 2;  // user a asignar como asesor del colegio
}

message CreateSchoolRequest {
  string name              = 1;
  string user_id           = 2;  // user_id del coordinador owner (obligatorio)
  string hubspot_record_id = 3;  // opcional, "" si todavia no se sincronizo
  string city              = 4;  // opcional, ciudad/distrito del colegio
  string category          = 5;  // Segmento UCSP: A1/A2/B1/B2/C/OP/OR (o legacy A+/A/B/C/D)
  string code              = 6;  // Codigo modular MINEDU (unico cuando no vacio)
  string penetration       = 7;  // Alta/Media/Baja, opcional
  string email             = 8;  // correo de contacto del colegio, opcional al crear
  string phone             = 9;  // telefono de contacto del colegio, opcional al crear
  string ruc               = 10; // RUC del colegio, opcional al crear (se pide al editar)
  string poblacion         = 11; // poblacion estudiantil, opcional al crear (se pide al editar)
  string personal_a_cargo  = 12; // persona/contacto a cargo en el colegio, opcional
}
message UpdateSchoolRequest {
  string id                = 1;
  string name              = 2;  // "" = no tocar
  string user_id           = 3;  // "" = no tocar
  string hubspot_record_id = 4;  // "" = no tocar
  string city              = 5;  // "" = no tocar; "-" = limpiar (NULL)
  string category          = 6;  // "" = no tocar; "-" = limpiar (NULL)
  string code              = 7;  // "" = no tocar; "-" = limpiar (NULL)
  string penetration       = 8;  // "" = no tocar; "-" = limpiar (NULL)
  string email             = 9;  // "" = no tocar; "-" = limpiar (NULL)
  string phone             = 10; // "" = no tocar; "-" = limpiar (NULL)
  string ruc               = 11; // "" = no tocar; "-" = limpiar (NULL)
  string poblacion         = 12; // "" = no tocar; "-" = limpiar (NULL)
  string personal_a_cargo  = 13; // "" = no tocar; "-" = limpiar (NULL)
}

message School {
  string id                = 1;
  string user_id           = 2;
  string name              = 3;
  bool   active            = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string hubspot_record_id = 7;
  string city              = 8;
  string category          = 9;  // Segmento (A1/A2/B1/B2/C/OP/OR)
  // INT IDENTITY (migration 020). Lo usa la integracion con HubSpot
  // donde la prop custom mi_proposito___id_colegio esta tipada como
  // INTEGER (heredado de P1 que usaba MySQL autoincrement). NUNCA es PK
  // semantica — id (UUID) sigue siendo la PK.
  int32  int_id            = 10;
  string code              = 11; // Codigo modular MINEDU
  string penetration       = 12; // Alta/Media/Baja
  string email             = 13; // correo de contacto del colegio ("" si no se cargo)
  string phone             = 14; // telefono de contacto del colegio ("" si no se cargo)
  string ruc               = 15; // RUC del colegio ("" si no se cargo)
  string poblacion         = 16; // poblacion estudiantil ("" si no se cargo)
  // Solo lo llena el listado (List/ListByAsesor) via JOIN con assignment:
  // asesor vigente del colegio. "" = colegio SIN asesor asignado.
  string asesor_user_id    = 17;
  string asesor_name       = 18;
  string personal_a_cargo  = 19; // persona/contacto a cargo en el colegio ("" si no se cargo)
}

// ---------- Lead (landing publica "Preparate" / simulacro masivo) ----------

message Lead {
  string id                = 1;
  string first_name        = 2;
  string last_name         = 3;
  string dni               = 4;  // "" = no registrado
  string phone             = 5;  // "" = no registrado
  string email             = 6;
  int32  graduation_year   = 7;  // anio de egreso del colegio; 0 = sin especificar
  string school_text       = 8;  // colegio de procedencia (texto libre); "" = sin registrar
  string origen            = 9;  // en prod siempre "landing Simulacro"
  string key_code          = 10; // key masiva (LAN) de la campaña; "" = sin atar
  bool   terms_accepted    = 11; // consentimiento terminos y condiciones
  bool   data_processing   = 12; // consentimiento tratamiento de datos (Ley 29733)
  string hubspot_record_id = 13; // record_id del contacto en HubSpot; "" = sin sincronizar
  google.protobuf.Timestamp created_at = 14;
}

message CreateLeadRequest {
  string first_name      = 1;  // requerido
  string last_name       = 2;  // requerido
  string dni             = 3;  // opcional
  string phone           = 4;  // opcional
  string email           = 5;  // requerido
  int32  graduation_year = 6;  // opcional (anio de egreso)
  string school_text     = 7;  // opcional (colegio de procedencia, texto libre)
  string key_code        = 8;  // opcional (campaña / key masiva)
  bool   terms_accepted  = 9;
  bool   data_processing = 10;
  // origen: opcional; si vacio el server usa "landing Simulacro".
  string origen          = 11;
}

message LeadResponse { Lead lead = 1; }

message ListLeadsRequest {
  string search   = 1; // matchea first_name/last_name/dni/email (LIKE %search%)
  string key_code = 2; // filtro por campaña, opcional
  uint32 limit    = 3; // 0 = default 100, max 1000
  uint32 offset   = 4;
}

message ListLeadsResponse {
  repeated Lead items = 1;
  uint32 total = 2;    // total sin paginar
}

// AuthService — separado de UserService porque los endpoints de auth
// suelen tener políticas distintas (ej. SkipFunc en el interceptor JWT,
// rate-limits específicos, sin Authorization header en Login).
service AuthService {
  // Authenticate verifica credenciales sin emitir tokens. Útil para
  // integraciones internas que validan permisos sin necesidad de JWT.
  rpc Authenticate (AuthenticateRequest) returns (AuthenticateResponse);

  // Login emite un par access+refresh JWT.
  rpc Login (LoginRequest) returns (LoginResponse);

  // Refresh rota el refresh token (revoca el viejo, emite uno nuevo).
  rpc Refresh (RefreshRequest) returns (RefreshResponse);

  // Logout revoca el refresh token. El access sigue siendo válido hasta
  // su exp natural — el cliente debe descartarlo.
  rpc Logout (LogoutRequest) returns (EmptyResponse);

  // RequestStudentOTP genera un OTP de 6 dígitos y lo envía al email
  // del estudiante vía hubspot_service. Silencioso si email no existe
  // o user no es estudiante (anti enumeration). Público.
  rpc RequestStudentOTP (RequestStudentOTPRequest) returns (EmptyResponse);

  // VerifyStudentOTP valida el código y emite par access+refresh JWT.
  // Público.
  rpc VerifyStudentOTP (VerifyStudentOTPRequest) returns (LoginResponse);

  // RegisterStudentWithKey crea (o reusa) un usuario estudiante asociado
  // al colegio de una key valida y dispara el envio del OTP. Endpoint
  // publico (sin JWT): el control de acceso es la propia validez de la
  // key. El gateway ya valido el key_code antes de invocarlo y resolvio
  // el school_id correspondiente.
  //
  // Si el email ya existe como estudiante del mismo colegio, no crea
  // nada — solo reenvia OTP. Si existe pero pertenece a otro rol u otro
  // colegio, devuelve error.
  rpc RegisterStudentWithKey (RegisterStudentWithKeyRequest) returns (RegisterStudentWithKeyResponse);

  // CheckStudentEmail responde si un email existe como estudiante. Lo
  // invoca el gateway tras validar un key_code (no es expuesto crudo —
  // el front llama a /api/auth/student/lookup-by-key que primero pasa
  // por keys_service.ValidateKey). Permite que la pantalla de acceso
  // decida automaticamente entre flujo "ingresar con OTP" (existe) vs
  // "registrar con llave" (no existe), sin obligar al alumno a saber
  // cual le toca. Anti-enumeracion: solo responde si quien pregunta ya
  // posee un key_code valido.
  rpc CheckStudentEmail (CheckStudentEmailRequest) returns (CheckStudentEmailResponse);
}

// --------- Messages ---------
// IDs:
//   users.id y school.id   -> UUID (transportados como string)
//   permission y permission_group -> INT identity (uint32)
message User {
  string id              = 1;
  string email           = 2;
  string first_name      = 3;
  string last_name       = 4;
  string document_number = 5;
  string school_id       = 6;  // "" = sin colegio
  bool   active          = 7;
  google.protobuf.Timestamp last_access_at = 8;
  google.protobuf.Timestamp created_at     = 9;
  google.protobuf.Timestamp updated_at     = 10;
  bool   is_superadmin         = 11;
  bool   must_change_password  = 12;
  string phone                 = 13;  // "" si no se cargo
  // INT IDENTITY (migration 021). Equivalente v2 al ID MySQL int de v1.
  // Lo usa la integracion con HubSpot — la prop custom mi_proposito_asesor_id
  // del custom object Asesor (2-32448565) esta tipada como INTEGER y el
  // UUID de v2 no es parseable.
  int32  int_id               = 14;
  // user_type — derivado del permission_group del user. Lo necesita el
  // front v1 (ucsp-front) para rutear post-login al dashboard correcto:
  //   1 = admin (admin_permissions)
  //   2 = asesor (asesor_permissions)
  //   3 = coordinador (coordinador_permissions)
  //   4 = student (student_permissions)
  //   0 = sin grupo (fallback — el front lo trata como student)
  // El backend lo computa via lookup user_permission_group + permission_group.
  // Si el user pertenece a varios grupos, gana el de menor valor (admin > asesor
  // > coordinador > student) — patron del front v1.
  int32  user_type            = 15;
}

message CreateUserRequest {
  string email               = 1;
  string password            = 2;
  string first_name          = 3;
  string last_name           = 4;
  string document_number     = 5;
  string school_id           = 6;  // opcional
  string phone               = 7;  // opcional, se sincroniza a HubSpot
  uint32 permission_group_id = 8;  // opcional, si >0 se asigna tras el create
}

message GetUserRequest        { string id = 1; }
message GetUserByEmailRequest { string email = 1; }

message UpdateUserRequest {
  string id              = 1;
  string first_name      = 2;
  string last_name       = 3;
  string document_number = 4;
  string school_id       = 5;
  string phone           = 6;
}

message DeactivateUserRequest { string id = 1; }
message ReactivateUserRequest { string id = 1; }

message AuthenticateRequest   { string email = 1; string password = 2; }
message AuthenticateResponse  { User user = 1; repeated string permissions = 2; }

// JWT Login flow.
message LoginRequest {
  string email      = 1;
  string password   = 2;
  string ip         = 3;  // opcional; si vacío, el server lo extrae del context
  string user_agent = 4;
}

message LoginResponse {
  User   user          = 1;
  repeated string permissions = 2;
  string access_token  = 3;
  string refresh_token = 4;
}

message RefreshRequest {
  string refresh_token = 1;
  string ip            = 2;
  string user_agent    = 3;
}

message RefreshResponse {
  string access_token  = 1;
  string refresh_token = 2;  // rotado
}

message LogoutRequest { string refresh_token = 1; }

message RequestStudentOTPRequest {
  string email = 1;
  string ip    = 2; // opcional; si vacío el server lo extrae del context
}

message VerifyStudentOTPRequest {
  string email      = 1;
  string otp        = 2; // 6 dígitos
  string ip         = 3;
  string user_agent = 4;
}

message RegisterStudentWithKeyRequest {
  string email           = 1;
  string first_name      = 2;
  string last_name       = 3;
  string document_number = 4;
  string phone           = 5;
  // school_id resuelto por el gateway via keys_service.ValidateKey antes
  // de invocar esta RPC. users_service NO consulta keys_service.
  string school_id       = 6;
  string ip              = 7;
}

// status: "created" (user nuevo creado) | "exists" (ya existia como
// estudiante del mismo colegio; se reenvio OTP). En ambos casos el OTP
// se dispara.
message RegisterStudentWithKeyResponse {
  string status = 1;
}

message CheckStudentEmailRequest {
  string email = 1;
}

// exists=true si el email corresponde a un estudiante activo. Falso para
// emails desconocidos O para usuarios que no son estudiantes (el flow
// publico no debe revelar la existencia de cuentas de asesor/admin).
// user_id se devuelve SOLO si exists=true — lo usa el gateway para
// chequear cuota de attempts contra una key sin exponer ListByUser.
message CheckStudentEmailResponse {
  bool   exists  = 1;
  string user_id = 2;
}

message AssignGroupRequest { string user_id = 1; uint32 permission_group_id = 2; }
message RevokeGroupRequest { string user_id = 1; uint32 permission_group_id = 2; }

message ListPermsRequest  { string user_id = 1; }
message ListPermsResponse { repeated string codes = 1; }

message HasPermissionRequest  { string user_id = 1; string code = 2; }
message HasPermissionResponse { bool allowed = 1; }

message UserResponse  { User user = 1; }
message EmptyResponse {}
message EmptyRequest  {}

// Me / ChangePassword / ResetPassword
message MeResponse {
  User   user        = 1;
  // Para superadmins: ["*"] (sentinel — el front asume todo permitido).
  // Para otros: lista de codes en formato `<service>.<table>.<action>`.
  repeated string permissions = 2;
}

message ChangeMyPasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ResetPasswordRequest {
  string target_user_id = 1;
}

message ResetPasswordResponse {
  // Password temporal en CLARO. Viaja UNA SOLA VEZ. El admin la entrega
  // al user. El user verá must_change_password=true y será forzado a
  // cambiarla en su primer login.
  string temp_password = 1;
}

// ---------- Visita ----------

message Visita {
  string id              = 1;
  string asesor_user_id  = 2;
  string school_id       = 3;
  google.protobuf.Timestamp scheduled_at = 4;
  google.protobuf.Timestamp completed_at = 5; // nil si no completada
  string status          = 6;  // scheduled | completed | cancelled | no_show
  string notes           = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateVisitaRequest {
  string asesor_user_id = 1;
  string school_id      = 2;
  google.protobuf.Timestamp scheduled_at = 3;
  string status         = 4; // opcional, default "scheduled"
  string notes          = 5;
  google.protobuf.Timestamp completed_at = 6; // opcional (si se crea ya completada)
}

message UpdateVisitaRequest {
  string id            = 1;
  string status        = 2; // "" = no tocar
  string notes         = 3; // "" = no tocar (no se puede vaciar con esta API)
  google.protobuf.Timestamp scheduled_at = 4; // nil/zero = no tocar
  // completed_at:
  //   * no enviado / zero        = no tocar
  //   * "1900-01-01T00:00:00Z"   = sentinel para LIMPIAR a NULL
  //   * cualquier otro timestamp = setear ese valor
  google.protobuf.Timestamp completed_at = 5;
}

message GetVisitaRequest   { string id = 1; }
message VisitaResponse     { Visita visita = 1; }

message ListVisitasRequest {
  string asesor_user_id = 1; // opcional
  string school_id      = 2; // opcional
  string status         = 3; // opcional
  google.protobuf.Timestamp from = 4; // opcional, scheduled_at >= from
  google.protobuf.Timestamp to   = 5; // opcional, scheduled_at < to
  uint32 limit          = 6;
  uint32 offset         = 7;
}

message ListVisitasResponse {
  repeated Visita items = 1;
  uint32 total          = 2;
}
