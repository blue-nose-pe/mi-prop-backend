syntax = "proto3";

package keys.v1;

option go_package = "keys_service/proto/gen;keyspb";

import "google/protobuf/timestamp.proto";
import "common/search.proto";

service KeyService {
  rpc GenerateKey   (GenerateKeyRequest)  returns (KeyResponse);
  rpc UpdateKey     (UpdateKeyRequest)    returns (KeyResponse);
  rpc DeactivateKey (DeactivateKeyRequest)returns (EmptyResponse);
  rpc ValidateKey   (ValidateKeyRequest)  returns (KeyResponse);
  rpc IncrementUsage(IncrementUsageRequest) returns (EmptyResponse);
  // UserHasKeyUsage: chequea si (key, user) ya tiene fila en key_usage —
  // i.e. si ese alumno ya ocupa una plaza del aforo. Lo usa el gateway en
  // /api/auth/student/lookup-by-key para distinguir "aforo lleno y user
  // sin plaza" (bloquear pre-OTP) de "aforo lleno pero user con plaza"
  // (dejar entrar como retry). Publico via jwtSkip.
  rpc UserHasKeyUsage(UserHasKeyUsageRequest) returns (UserHasKeyUsageResponse);
  rpc GetKey        (GetKeyRequest)       returns (KeyResponse);
  rpc GetByCode     (GetByCodeRequest)    returns (KeyResponse);
  rpc ListByAsesor  (ListByAsesorRequest) returns (ListKeysResponse);
  rpc ListByColegio (ListByColegioRequest)returns (ListKeysResponse);
  // Devuelve distinct user_ids que rindieron tests usando keys de este
  // colegio. Sirve al gateway para hacer el listado de "Estudiantes del
  // Colegio X" aditivo: incluir tambien a quienes consumieron aforo de las
  // keys del colegio, aunque su users.school_id apunte a otro.
  rpc ListUserIDsByColegio (ListByColegioRequest) returns (ListUserIDsResponse);
  rpc SearchKeys    (common.v1.SearchRequest) returns (common.v1.SearchResponse);
}

message Key {
  string id              = 1;
  string code            = 2;
  int32  exam_type_id    = 3;
  string school_id       = 4;
  string asesor_user_id  = 5;
  string mode            = 6; // "school" | "lan"
  string grade           = 7;
  string section         = 8;
  google.protobuf.Timestamp valid_from = 9;
  google.protobuf.Timestamp valid_to   = 10;
  int32  max_uses        = 11;
  int32  current_uses    = 12;
  bool   active          = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // exam_id: si esta seteado, la key apunta a una version puntual del
  // exam (deterministico — el alumno siempre rinde ESA version). Si esta
  // vacio, el front busca el primer exam publicado del exam_type_id como
  // fallback (comportamiento legacy de keys pre-v0.16).
  string exam_id         = 16;
  // max_attempts_per_user: cuantas veces UN MISMO alumno puede rendir.
  // Default 1. 0 = sin limite. exams_service.StartAttempt cuenta
  // attempts submitted del user y rechaza con MAX_ATTEMPTS_REACHED.
  int32  max_attempts_per_user = 17;
}

message GenerateKeyRequest {
  string code            = 1; // si vacío, server lo genera
  int32  exam_type_id    = 2;
  string school_id       = 3;
  string asesor_user_id  = 4;
  string mode            = 5;
  string grade           = 6;
  string section         = 7;
  google.protobuf.Timestamp valid_from = 8;
  google.protobuf.Timestamp valid_to   = 9;
  int32  max_uses        = 10;
  // exam_id opcional. Si vacio, la key sirve el primer exam publicado
  // del tipo (legacy). Si seteado, atado a esa version puntual.
  string exam_id         = 11;
  // max_attempts_per_user opcional. Si no se provee o = 0 en el create,
  // el server usa default 1 (un intento por alumno).
  int32 max_attempts_per_user = 12;
}

message UpdateKeyRequest {
  string id        = 1;
  string grade     = 2;
  string section   = 3;
  google.protobuf.Timestamp valid_from = 4;
  google.protobuf.Timestamp valid_to   = 5;
  // max_uses opcional para distinguir "no provisto" (nil) de "0" (ilimitado
  // explicito). Antes era int32 zero-value y un PATCH que solo tocaba grade
  // dejaba max_uses=0 silenciosamente, destruyendo el aforo.
  optional int32 max_uses = 6;
  // max_attempts_per_user opcional: nil = no tocar; *N = nuevo valor.
  optional int32 max_attempts_per_user = 7;
  // active opcional: nil = no tocar; true = reactivar; false = desactivar.
  // Es el camino para REACTIVAR una key apagada — DeactivateKey solo apaga.
  optional bool active = 8;
}

message DeactivateKeyRequest { string id = 1; }
message ValidateKeyRequest   { string code = 1; }
message GetKeyRequest        { string id = 1; }
message GetByCodeRequest     { string code = 1; }
message ListByAsesorRequest  { string asesor_user_id = 1; }
message ListByColegioRequest { string school_id = 1; }
message ListKeysResponse     { repeated Key items = 1; }
message ListUserIDsResponse  { repeated string user_ids = 1; }
message KeyResponse          { Key key = 1; }
message EmptyResponse        {}

message IncrementUsageRequest {
  string key_id     = 1;
  string user_id    = 2;
  string attempt_id = 3;
}

message UserHasKeyUsageRequest {
  string key_id  = 1;
  string user_id = 2;
}
message UserHasKeyUsageResponse {
  bool has_usage = 1;
}
