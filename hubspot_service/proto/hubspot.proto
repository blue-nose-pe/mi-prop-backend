syntax = "proto3";

package hubspot.v1;

option go_package = "hubspot_service/proto/gen;hubspotpb";

// HubspotService — el contrato que CONSUMEN los demás microservicios.
// Toda la lógica de SDK / colas / retry vive del lado del adapter Go.
service HubspotService {
  // Síncrono: el caller (users_service) necesita el record_id devuelto.
  rpc UpsertContact (UpsertContactRequest) returns (UpsertContactResponse);

  rpc GetContactByDNI (GetContactByDNIRequest) returns (UpsertContactResponse);

  // Síncrono: el alumno está esperando recibir el email.
  rpc SendOTP (SendOTPRequest) returns (EmptyResponse);

  // Síncrono: upsert del contacto del estudiante + asociacion a la
  // Company del colegio, SIN disparar el webhook OTP. Lo usa el flujo
  // "asesor crea estudiante" (POST /api/asesores/students), donde el
  // student no necesita verificar email — solo queremos que HubSpot
  // tenga el contacto completo + relacion al colegio para que el cliente
  // UCSP lo vea en el CRM. Mismo set de props que SendOTP minus el OTP.
  rpc SyncStudentContact (SyncStudentContactRequest) returns (EmptyResponse);

  // SyncKey: upsert del custom object Key (2-32450705) + asociaciones a
  // Asesor (2-32448565) y Company del colegio (0-2). Paridad con v1:
  // createKey/createVisita sincronizaban automaticamente cada key creada.
  // Sincrono porque el caller (keys_service.Generate) lo dispara en
  // goroutine separada — si quisieramos no bloquear el grpc, encolar.
  rpc SyncKey (SyncKeyRequest) returns (EmptyResponse);

  // Asíncrono (encola para retry con backoff exponencial).
  rpc SyncExamResult (SyncExamResultRequest) returns (EmptyResponse);
  rpc UpsertSchool   (UpsertSchoolRequest)   returns (EmptyResponse);
  rpc UpsertAsesor   (UpsertAsesorRequest)   returns (EmptyResponse);

  // Admin.
  rpc GetFailedSyncs (GetFailedSyncsRequest) returns (GetFailedSyncsResponse);
  rpc RetryFailed    (RetryFailedRequest)    returns (RetryFailedResponse);
}

message UpsertContactRequest {
  string dni          = 1;
  string email        = 2;
  string first_name   = 3;
  string last_name    = 4;
  string phone        = 5;
  string school_name  = 6;
  string grade        = 7;
  string user_id      = 8; // si se provee, persistimos record_id en users_service
  map<string, string> extra = 9;
}
message UpsertContactResponse { string record_id = 1; }
message GetContactByDNIRequest { string dni = 1; }

// SendOTPRequest — email + otp son obligatorios. Los demas campos son
// opcionales: cuando se proveen (tipicamente en register-with-key) se
// upsertean en el contacto de HubSpot junto con otp_estudiante, asi el
// contacto queda con nombre/apellido/dni/phone seteados desde el primer
// momento en vez de aparecer vacio en el CRM hasta el primer login. En
// request-otp (login posterior) van vacios y la upsert solo refresca
// otp_estudiante sin pisar lo que ya estaba.
message SendOTPRequest {
  string email           = 1;
  string otp             = 2;
  string first_name      = 3;
  string last_name       = 4;
  string document_number = 5;
  string phone           = 6;
  // UUID del colegio (uso interno; NO se manda a HubSpot porque su prop
  // mi_proposito___id_colegio esta tipada como INTEGER, no string).
  string school_id       = 7;
  // INT IDENTITY de la tabla school (users_service). ESTE es el que se
  // mapea a mi_proposito___id_colegio en HubSpot, por compat con P1 que
  // usaba autoincr de MySQL. 0 = no setear la prop.
  int32  school_int_id   = 8;
  // record_id de la Company del colegio en HubSpot (object type 0-2).
  // Cuando viene no-vacio, hubspot_service crea la asociacion
  // Contact <-> Company despues del upsert, replicando lo que P1 hacia en
  // createHubspotContacto.js (associations.v4.basicApi.createDefault).
  // Vacio => no se asocia (estudiante sin colegio).
  string school_record_id = 9;
}

// SyncStudentContactRequest — payload para hidratar/actualizar un contacto
// estudiante en HubSpot sin generar OTP. Pensado para el flujo "asesor
// crea estudiante": copia el mismo set de props que SendOTP setea
// (firstname/lastname/dni/phone/mi_proposito___id_colegio + flags de
// origen) y crea la asociacion Contact <-> Company si school_record_id
// viene seteado. Solo email es obligatorio.
message SyncStudentContactRequest {
  string email           = 1;
  string first_name      = 2;
  string last_name       = 3;
  string document_number = 4;
  string phone           = 5;
  int32  school_int_id   = 6;
  string school_record_id = 7;
}

// SyncKeyRequest — payload para upsert del custom object Key (2-32450705)
// en HubSpot + asociaciones a Asesor y Company. Mismos campos que P1
// guardaba en createKey.js / createVisita.js. herramienta lo deriva el
// servicio segun exam_type_code (vocacional -> "Test Vocacional", etc).
message SyncKeyRequest {
  string code              = 1; // codigo (key.code), unique key para upsert
  string exam_type_code    = 2; // "vocacional" | "simulacro" | "habitos"
  string asesor_user_id    = 3; // UUID del asesor en v2
  string school_id         = 4; // UUID o int_id del colegio en v2
  string school_name       = 5; // denormalizado para mostrar en la prop nombre_colegio
  string grade             = 6;
  string section           = 7;
  string valid_from        = 8; // RFC 3339
  string valid_to          = 9; // RFC 3339
  int32  max_uses          = 10;
  // record_ids opcionales: si el caller los conoce, se asocian directo
  // sin tener que hacer search (mas rapido + mas robusto).
  string asesor_record_id  = 11;
  string school_record_id  = 12;
  // asesor_email opcional: fallback para resolver el Asesor record cuando
  // asesor_record_id viene vacio. hubspot-service busca el Asesor por
  // email (prop unique en el portal) y crea la asociacion. Util en v2
  // donde users.hubspot_record_id aun no esta poblado para asesores
  // legacy de v1 — el email matchea entre v1 y v2 por ser unique global.
  string asesor_email      = 13;
}

message SyncExamResultRequest {
  string dni                = 1;
  string exam_type_code     = 2; // vocacional | simulacro | habitos
  int32  score              = 3;
  int32  max_score          = 4;
  string attempt_id         = 5;
  string submitted_at       = 6; // RFC 3339
  string contact_record_id  = 7; // opcional: evita un search por DNI
}

message UpsertSchoolRequest {
  string school_id        = 1;
  string email            = 2;
  string nombre           = 3;
  string personal_a_cargo = 4;
}

message UpsertAsesorRequest {
  string asesor_user_id = 1;
  string email          = 2;
  string nombre         = 3;
  string bio            = 4;
}

message GetFailedSyncsRequest { uint32 limit = 1; uint32 offset = 2; }
message FailedSync {
  string queue          = 1;
  string job_id         = 2;
  string failed_reason  = 3;
  string payload        = 4;
  string failed_at      = 5; // RFC 3339
}
message GetFailedSyncsResponse { repeated FailedSync items = 1; }
message RetryFailedRequest  { string queue = 1; string job_id = 2; }
message RetryFailedResponse { bool ok = 1; }

message EmptyResponse {}
