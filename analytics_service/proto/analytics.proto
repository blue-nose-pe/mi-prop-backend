syntax = "proto3";

package analytics.v1;

option go_package = "analytics_service/proto/gen;analyticspb";

import "google/protobuf/timestamp.proto";

service AnalyticsService {
  rpc GetAsesorDashboard      (GetAsesorDashboardRequest)      returns (AsesorDashboardResponse);
  rpc GetColegioDashboard     (GetColegioDashboardRequest)     returns (ColegioDashboardResponse);
  rpc GetEstudianteDashboard  (GetEstudianteDashboardRequest)  returns (EstudianteDashboardResponse);
  rpc GetColegioComparativo   (GetColegioComparativoRequest)   returns (ColegioComparativoResponse);
  rpc GetHistoricoEstudiante  (GetHistoricoEstudianteRequest)  returns (HistoricoEstudianteResponse);
  rpc GetHistoricoColegio     (GetHistoricoColegioRequest)     returns (HistoricoColegioResponse);
  rpc GetColegiosHistorico    (GetColegiosHistoricoRequest)    returns (ColegiosHistoricoResponse);
  rpc GetReporteEstudiante    (GetReporteEstudianteRequest)    returns (ReporteEstudianteResponse);
  rpc GetAsesorPendientes     (GetAsesorPendientesRequest)     returns (AsesorPendientesResponse);
  rpc ExportAsesorXLSX        (ExportAsesorXLSXRequest)        returns (ExportXLSXResponse);
  rpc ExportColegioXLSX       (ExportColegioXLSXRequest)       returns (ExportXLSXResponse);
  rpc ExportComparativoXLSX   (ExportComparativoXLSXRequest)   returns (ExportXLSXResponse);
  rpc ExportReporteEstudianteXLSX (ExportReporteEstudianteXLSXRequest) returns (ExportXLSXResponse);
}

message ExamTypeStats {
  int32  attempts       = 1;
  double avg_score      = 2;
  double avg_max_score  = 3;
  // Solo vocacional/estilos: inclinaciones agregadas del colegio (no
  // promediables por puntaje). El front las pinta como barra roja->verde.
  repeated ColegioAreaStat areas = 4;
}

// ColegioAreaStat — una aptitud (RIASEC) o estilo/canal agregado a nivel
// colegio. ratio = points/max_points (0..1).
message ColegioAreaStat {
  string code       = 1;
  string label      = 2;
  int32  points     = 3;
  int32  max_points = 4;
  double ratio      = 5;
}

// ----- Asesor -----
message GetAsesorDashboardRequest { string asesor_id = 1; }
message AsesorDashboardResponse {
  string asesor_id         = 1;
  string asesor_name       = 2;
  int32  total_colegios    = 3;
  int32  total_keys        = 4;
  int32  total_attempts    = 5;
  map<string, ExamTypeStats> by_exam_type = 6;
  google.protobuf.Timestamp generated_at = 7;
  int32  completed_visits  = 8;  // visitas con status=completed del asesor
  int32  scheduled_visits  = 9;  // visitas con status=scheduled (proximas)
  int32  pending_tests     = 10; // suma cross-estudiantes de tests pendientes
  int32  affected_students = 11; // estudiantes con al menos un test pendiente
  // Cliente (2026-06-04): "estudiantes impactados, X de Y". total_aforo (Y) =
  // suma de aforo (max_uses) de las keys del asesor = universo de cupos.
  // total_impactados (X) = suma de current_uses = estudiantes que ya usaron
  // una key (presentaron / se registraron).
  int32  total_aforo       = 12;
  int32  total_impactados  = 13;
}

// ----- Colegio -----
message GetColegioDashboardRequest { string school_id = 1; }
message ColegioDashboardResponse {
  string school_id       = 1;
  string school_name     = 2;
  int32  total_students  = 3;
  int32  total_attempts  = 4;
  map<string, ExamTypeStats> by_exam_type = 5;
  google.protobuf.Timestamp generated_at = 6;
}

// ----- Estudiante -----
message GetEstudianteDashboardRequest { string user_id = 1; }
message TestResult {
  string exam_type_code = 1;
  string exam_id        = 2;
  string exam_name      = 3;
  int32  score          = 4;
  int32  max_score      = 5;
  google.protobuf.Timestamp submitted_at = 6;
  string attempt_id     = 7;
}
message EstudianteDashboardResponse {
  string user_id      = 1;
  string student_name = 2;
  repeated TestResult tests = 3;
  google.protobuf.Timestamp generated_at = 4;
}

// ----- Comparativo -----
message GetColegioComparativoRequest { string exam_type_code = 1; }
message ColegioComparativoItem {
  string school_id   = 1;
  string school_name = 2;
  double avg_score   = 3;
  int32  attempts    = 4;
}
message ColegioComparativoResponse {
  string exam_type_code = 1;
  repeated ColegioComparativoItem items = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// ----- Histórico -----
message GetHistoricoEstudianteRequest { string user_id = 1; }
message HistoricoEstudianteResponse {
  string user_id = 1;
  repeated TestResult items = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Histórico trimestral de un colegio. exam_type_code opcional: "" agrega
// todos los tipos juntos. periods limita la ventana al N de quarters mas
// recientes (default 8 = 2 años).
message GetHistoricoColegioRequest {
  string school_id      = 1;
  string exam_type_code = 2;
  int32  periods        = 3;
}
message HistoricoColegioPoint {
  string period        = 1;  // "YYYY-QN"
  int32  year          = 2;
  int32  quarter       = 3;
  double avg_score     = 4;  // 0..100
  int32  attempts      = 5;
  double variation_pct = 6;  // contra el quarter previo; NaN -> protobuf no transporta NaN, se manda 0 si no aplica
  bool   has_previous  = 7;  // false => variation_pct no es interpretable
}
message HistoricoColegioResponse {
  string school_id      = 1;
  string school_name    = 2;
  string city           = 3;
  string category       = 4;
  string exam_type_code = 5;
  repeated HistoricoColegioPoint items = 6;
  google.protobuf.Timestamp generated_at = 7;
}

// Listing por colegio para la grilla "Histórico de Colegio". Devuelve la
// metrica del periodo solicitado para cada colegio + variacion vs anterior.
// period opcional: "" o "current" toma el quarter actual; sino "YYYY-QN".
message GetColegiosHistoricoRequest {
  string period         = 1;
  string exam_type_code = 2;
}
message ColegiosHistoricoRow {
  string school_id      = 1;
  string school_name    = 2;
  string city           = 3;
  string category       = 4;
  double avg_score      = 5;
  int32  attempts       = 6;
  double variation_pct  = 7;
  bool   has_previous   = 8;
  // Solo vocacional/estilos: el area/inclinacion mas elegida del colegio en
  // el periodo (no promediable por puntaje).
  string top_area_code  = 9;
  string top_area_label = 10;
}
message ColegiosHistoricoResponse {
  string period         = 1;  // resuelto (no "" ni "current")
  string exam_type_code = 2;
  repeated ColegiosHistoricoRow items = 3;
  google.protobuf.Timestamp generated_at = 4;
}

// ----- Reporte estudiante (Tour Vocacional UCSP) -----
message GetReporteEstudianteRequest {
  string user_id    = 1;
  string attempt_id = 2; // opcional; si "" se usa el ultimo attempt submitted
}

message CategoryStat {
  string code       = 1; // R/I/A/S/E/C
  string label      = 2; // "Realista", "Investigador"...
  int32  points     = 3;
  int32  max_points = 4;
}

message AreaInteresMatch {
  string code            = 1;
  string label           = 2;
  string area_label      = 3; // "CALCULO", etc
  string characteristics = 4;
  repeated string careers = 5;
  int32  points          = 6;
  int32  max_points      = 7;
}

message AreasInteresSection {
  bool   available                  = 1;
  string reason                     = 2; // por que no esta disponible si !available
  map<string, CategoryStat> scores  = 3;
  repeated AreaInteresMatch top     = 4;
}

// ReportSection: sobre de una seccion del reporte vocacional. Ademas de
// los modulos de interes (AreasInteresSection), las secciones Personalidad
// (caracter Le Senne), Apoyo Familiar (banda) y Proyecto de Vida (sub-
// dimensiones) usan este tipo: result_label/result_detail llevan el
// resultado textual y items[] las barras por dimension.
message ReportBlock {
  string title = 1; // ej "Potencialidades", "Perfil Académico"
  string text  = 2;
}

message ReportSection {
  bool   available = 1;
  string reason    = 2;
  string result_code   = 3; // ej "SANGUINEO", "FELICIDADES", banda...
  string result_label  = 4; // titulo legible del resultado
  string result_detail = 5; // descripcion larga (puede traer HTML del modelo)
  repeated CategoryStat items = 6; // barras por dimension (puntos x/max)
  // Bloques de texto del modelo (carácter Le Senne: Potencialidades /
  // Oportunidades de Mejora / Perfil Académico / Recomendaciones).
  repeated ReportBlock blocks = 7;
}

// ----- Pendientes del asesor -----
// "tests pendientes" = exams publicados+activos que un estudiante del
// colegio del asesor NO ha rendido (no tiene attempt submitted).
message GetAsesorPendientesRequest {
  string asesor_id = 1;
}

message PendingExam {
  string exam_id        = 1;
  string exam_name      = 2;
  string exam_type_code = 3; // "vocacional" | "simulacro" | "habitos" | ""
  string exam_code      = 4; // codigo legible (VOCC-2026-V1...)
}

message PendingStudent {
  string user_id      = 1;
  string student_name = 2;
  string school_id    = 3;
  string school_name  = 4;
  repeated PendingExam pending_exams = 5;
}

message PendingExamTypeCount {
  string exam_type_code   = 1;
  int32  pending_attempts = 2; // suma cross-estudiantes de tests pendientes
  int32  affected_students = 3; // cantidad de estudiantes con al menos un pendiente del tipo
}

message AsesorPendientesResponse {
  string asesor_id      = 1;
  string asesor_name    = 2;
  int32  total_pending  = 3; // suma total cross-estudiantes
  int32  total_students = 4; // total de estudiantes evaluados (de todos los colegios del asesor)
  repeated PendingExamTypeCount by_exam_type = 5;
  repeated PendingStudent students = 6; // solo incluye estudiantes con >0 pendientes
  google.protobuf.Timestamp generated_at = 7;
}

message ReporteEstudianteResponse {
  string user_id        = 1;
  string student_name   = 2;
  string attempt_id     = 3;
  string exam_id        = 4;
  string exam_name      = 5;
  string exam_type_code = 6;
  google.protobuf.Timestamp submitted_at = 7;
  int32  score          = 8;
  int32  max_score      = 9;
  AreasInteresSection areas_interes   = 10;
  ReportSection      personalidad     = 11; // placeholder hasta tener rubrica
  ReportSection      apoyo_familiar   = 12; // idem
  ReportSection      proyecto_de_vida = 13; // idem
  google.protobuf.Timestamp generated_at = 14;
}

// ----- Exports -----
message ExportAsesorXLSXRequest      { string asesor_id = 1; }
message ExportColegioXLSXRequest     { string school_id = 1; }
message ExportComparativoXLSXRequest {
  string exam_type_code = 1;
  // Cliente (2026-06-04): el export debe COINCIDIR con la tabla del historico,
  // que es period-aware. Sin period, el xlsx usaba otra query (otro promedio
  // y otros attempts) y no cuadraba. "" / "current" / "YYYY" / "YYYY-QN".
  string period         = 2;
}
message ExportReporteEstudianteXLSXRequest {
  string user_id    = 1;
  string attempt_id = 2; // opcional; vacio = ultimo attempt submitted del user
}
message ExportXLSXResponse {
  bytes  content   = 1;
  string filename  = 2;
}
