# values.yaml — defaults aplicables a TODOS los subcharts.
# Override en values.production.yaml o via --set en helm install.

global:
  # Container Registry donde están las imágenes (output del Bicep: ${namePrefix}acr.azurecr.io).
  imageRegistry: miprepositoacr.azurecr.io
  imageTag: "0.1.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

  # Switches: en staging (in-cluster) los cambia values.staging.yaml o el pipeline.
  inClusterSql: false
  inClusterRedis: false

  # Servidor Azure SQL (output del Bicep: ${namePrefix}-sql.database.windows.net).
  # Cuando inClusterSql=true, el Helm los reemplaza por mssql-server.miproposito.svc.cluster.local
  sqlServer: miproposito-sql.database.windows.net
  sqlPort: 1433
  sqlEncrypt: "true"        # Azure SQL exige TLS — mantener true para producción
  sqlTrustServerCert: "false"

  # Redis (output del Bicep: ${namePrefix}-redis.redis.cache.windows.net).
  # Cuando inClusterRedis=true, el Helm los reemplaza por redis-server.miproposito.svc.cluster.local:6379 sin TLS
  redisHost: miproposito-redis.redis.cache.windows.net
  redisSslPort: 6380
  redisTls: "true"

  # Key Vault para Secrets Store CSI (output del Bicep).
  keyVault:
    name: miproposito-kv
    tenantId: ""             # set en values.production.yaml
    userAssignedIdentityID: "" # workload identity, set en values.production.yaml

  # Dominio base. El Ingress de cada chart usa ${global.domain}.
  domain: miproposito.ucsp.edu.pe

# ----- Charts in-cluster (solo activos en staging) -----
mssqlServer:
  enabled: false
redisServer:
  enabled: false

# ----- Microservicios: enable/disable individualmente -----
usersService:
  enabled: true
exams-service:
  enabled: true
keys-service:
  enabled: true
hubspot-service:
  enabled: true
satisfaction-service:
  enabled: true
analytics-service:
  enabled: true
gateway:
  enabled: true

# ----- Defaults compartidos por subcharts (override en cada uno si necesario) -----
defaults:
  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
