apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "satisfactionService.fullname" . }}
  labels:
    {{- include "satisfactionService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.global.defaults.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "satisfactionService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "satisfactionService.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: satisfaction-service
          image: {{ include "satisfactionService.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: GRPC_PORT
              value: ":{{ .Values.service.grpcPort }}"
            - name: SQL_SERVER
              value: "{{ .Values.global.sqlServer }}"
            - name: SQL_PORT
              value: "{{ .Values.global.sqlPort }}"
            - name: SQL_DATABASE
              value: "{{ .Values.database.name }}"
            - name: SQL_USER
              value: "{{ .Values.database.user }}"
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "satisfactionService.fullname" . }}-kv
                  key: sql-password
            - name: SQL_ENCRYPT
              value: "{{ .Values.global.sqlEncrypt | default "true" }}"
            - name: SQL_TRUST_SERVER_CERT
              value: "{{ .Values.global.sqlTrustServerCert | default "false" }}"
            - name: JWT_ISSUER
              value: "{{ .Values.global.jwtIssuer | default "miproposito.users" }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "satisfactionService.fullname" . }}-kv
                  key: jwt-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "satisfactionService.fullname" . }}-spc
