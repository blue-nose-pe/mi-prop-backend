{{- if .Values.ingress.webhook.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hubspotService.fullname" . }}-webhook
  labels:
    {{- include "hubspotService.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.webhook.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.webhook.className }}
  rules:
    - host: {{ .Values.ingress.webhook.host }}
      http:
        paths:
          - path: /webhooks/hubspot
            pathType: Prefix
            backend:
              service:
                name: {{ include "hubspotService.fullname" . }}
                port:
                  name: webhook
  tls:
    - secretName: {{ include "hubspotService.fullname" . }}-webhook-tls
      hosts:
        - {{ .Values.ingress.webhook.host }}
{{- end }}
