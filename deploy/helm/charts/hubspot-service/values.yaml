# hubspot-service — valores por defecto.

image:
  repository: hubspot-service
  workerRepository: hubspot-service-worker

service:
  type: ClusterIP
  grpcPort: 50054
  webhookPort: 8080

# Custom Object IDs (configurables por entorno).
hubspot:
  environment: prod  # prod | dev
  customObjects:
    keyId: "2-32450705"
    asesorId: "2-32448565"
    colegioId: "2-32450269"
  team:
    asesorTeamId: "45462027"
    asesorRoleId: "1223012"
  otpWebhook:
    triggerId: "9013951"
  # Rate limit distribuido. El Secret hubspot-service-api-tokens contiene
  # un CSV con todas las API keys; el engine las balancea entre TODAS las
  # réplicas (server + worker) vía Redis con scripts Lua atómicos.
  # Capacidad total = len(tokens) × rps coordinados GLOBALMENTE.
  rateLimit:
    rps: 10            # rps POR token (HubSpot = 10)
    workers: 10        # goroutines internas del engine por proceso
    queueSize: 100     # buffer del canal interno
  redis:
    dbAsynq: 0         # DB para asynq (cola de jobs)
    dbRateLimit: 1     # DB separada para el contador de rate limit

worker:
  enabled: true
  replicas: 2
  # KEDA scaler: levanta más pods cuando crece la cola.
  keda:
    enabled: false
    listLengthThreshold: 50

server:
  replicas: 2

# Ingress externo opcional para el webhook inbound (HubSpot → nosotros).
ingress:
  webhook:
    enabled: true
    className: nginx
    host: hubspot-webhook.miproposito.ucsp.edu.pe
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 1Gi }
