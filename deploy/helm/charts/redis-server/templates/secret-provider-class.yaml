apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "redisServer.fullname" . }}-spc
  labels:
    {{- include "redisServer.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.global.keyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.passwordSecretName }}
          objectType: secret
          objectAlias: redis-password
  secretObjects:
    - secretName: {{ include "redisServer.fullname" . }}-pwd
      type: Opaque
      data:
        - objectName: redis-password
          key: REDIS_PASSWORD
