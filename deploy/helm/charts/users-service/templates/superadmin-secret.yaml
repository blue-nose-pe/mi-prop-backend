{{- /*
  Superadmin bootstrap — Secret con la password aleatoria.

  La password se genera UNA SOLA VEZ con `randAlphaNum 24` y se preserva
  entre `helm upgrade` consultando el Secret existente con `lookup`. Esto
  garantiza que el cliente puede leer la password con kubectl en cualquier
  momento (no se regenera en cada upgrade).

  Cómo lee la password el cliente:

      kubectl get secret <release>-users-service-superadmin -n <ns> \
        -o jsonpath='{.data.password}' | base64 -d

  Después del primer login, el binario `bootstrap` setea
  must_change_password=1 en el user → el sistema fuerza el cambio. La
  password de este Secret deja de ser útil tras ese primer login (sigue
  ahí pero ya no es válida).
*/ -}}

{{- if .Values.bootstrap.enabled -}}

{{- $name := printf "%s-superadmin" (include "usersService.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if $existing -}}
  {{- /* preservar la password existente para no romper el primer login del admin */ -}}
  {{- $password = (index $existing.data "password" | b64dec) -}}
{{- else -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "usersService.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  email:    {{ .Values.bootstrap.email | quote }}
  password: {{ $password | quote }}
{{- end }}
