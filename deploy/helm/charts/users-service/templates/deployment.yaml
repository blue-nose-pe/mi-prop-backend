apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usersService.fullname" . }}
  labels:
    {{- include "usersService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.global.defaults.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "usersService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "usersService.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: users-service
          image: {{ include "usersService.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            # Workaround del registro duplicado de proto/common/error.proto:
            # users_service importa hubspot_service/proto/gen (cliente OTP),
            # ambos paquetes registran el mismo file path en init() y protobuf
            # v1.20+ panicea por defecto. 'warn' degrada a log.
            # Fix definitivo: consolidar proto/common/ único compartido.
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: "warn"
            - name: GRPC_PORT
              value: ":{{ .Values.service.grpcPort }}"
            - name: SQL_SERVER
              value: "{{ .Values.global.sqlServer }}"
            - name: SQL_PORT
              value: "{{ .Values.global.sqlPort }}"
            - name: SQL_DATABASE
              value: "{{ .Values.database.name }}"
            - name: SQL_USER
              value: "{{ .Values.database.user }}"
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "usersService.fullname" . }}-kv
                  key: sql-password
            - name: SQL_ENCRYPT
              value: "{{ .Values.global.sqlEncrypt | default "true" }}"
            - name: SQL_TRUST_SERVER_CERT
              value: "{{ .Values.global.sqlTrustServerCert | default "false" }}"
            - name: REDIS_ADDR
              value: "{{ .Values.global.redisHost }}:{{ .Values.global.redisSslPort }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "usersService.fullname" . }}-kv
                  key: redis-password
            - name: REDIS_TLS
              value: "{{ .Values.global.redisTls | default "true" }}"
            - name: REDIS_DB
              value: "{{ .Values.redis.database }}"
            - name: CACHE_TTL
              value: "{{ .Values.redis.cacheTTL }}"
            - name: JWT_ISSUER
              value: "{{ .Values.jwt.issuer }}"
            - name: JWT_ACCESS_TTL
              value: "{{ .Values.jwt.accessTTL }}"
            - name: JWT_REFRESH_TTL
              value: "{{ .Values.jwt.refreshTTL }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "usersService.fullname" . }}-kv
                  key: jwt-secret
            - name: BCRYPT_COST
              value: "{{ .Values.bcryptCost }}"
            # OTP del estudiante: hubspot_service queda como path
            # alternativo. Con OTP_SENDER=resend el correo va directo
            # via Resend HTTP (bypass HubSpot Workflow) — el sync de
            # contacto al CRM lo hace el Resend adapter best-effort
            # contra el mismo hubspot_service.SyncStudentContact.
            - name: HUBSPOT_SERVICE_ADDR
              value: "{{ .Release.Name }}-hubspot-service:50054"
            - name: OTP_SENDER
              value: "{{ .Values.otp.sender | default "hubspot" }}"
            - name: RESEND_FROM
              value: "{{ .Values.otp.resend.from | default "Mi Proposito UCSP <onboarding@resend.dev>" }}"
            - name: RESEND_REPLY_TO
              value: "{{ .Values.otp.resend.replyTo | default "" }}"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "usersService.fullname" . }}-kv
                  key: resend-api-key
                  optional: true
            # SMTP (OTP_SENDER=smtp). Credenciales en secret manual
            # miproposito-smtp-credentials para no tener que verificar
            # dominio en Resend mientras estamos en demo. Gmail App Password.
            - name: SMTP_HOST
              value: "{{ .Values.otp.smtp.host | default "" }}"
            - name: SMTP_PORT
              value: "{{ .Values.otp.smtp.port | default 587 }}"
            - name: SMTP_FROM
              value: "{{ .Values.otp.smtp.from | default "" }}"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otp.smtp.secretName | default "miproposito-smtp-credentials" }}
                  key: smtp-username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otp.smtp.secretName | default "miproposito-smtp-credentials" }}
                  key: smtp-password
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "usersService.fullname" . }}-spc
