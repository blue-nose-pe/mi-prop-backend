{{- /*
ConfigMap con el contenido estático del sitio. Se rellena vía
helm `--set-file` o vía la convención de copiar los archivos de
deploy/api-docs/ al chart antes de instalar (ver README/INSTALL).
Se monta en /usr/share/nginx/html del nginx.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apiDocs.fullname" . }}
  labels:
    {{- include "apiDocs.labels" . | nindent 4 }}
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
  openapi.yaml: |
{{ .Files.Get "files/openapi.yaml" | indent 4 }}
