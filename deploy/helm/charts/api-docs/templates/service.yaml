apiVersion: v1
kind: Service
metadata:
  name: {{ include "apiDocs.fullname" . }}
  labels:
    {{- include "apiDocs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "apiDocs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
