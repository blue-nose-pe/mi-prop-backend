apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apiDocs.fullname" . }}
  labels:
    {{- include "apiDocs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "apiDocs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apiDocs.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: site
          configMap:
            name: {{ include "apiDocs.fullname" . }}
            items:
              - key: index.html
                path: index.html
              - key: openapi.yaml
                path: openapi.yaml
