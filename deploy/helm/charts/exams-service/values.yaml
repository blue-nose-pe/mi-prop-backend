# exams-service — valores por defecto.

image:
  repository: exams-service

service:
  type: ClusterIP
  grpcPort: 50052

database:
  name: db_exams
  user: miprop_admin

upstreams:
  keysService: "keys-service:50053"

migration:
  enabled: true
  image:
    repository: exams-service-migrate
  backoffLimit: 3

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
