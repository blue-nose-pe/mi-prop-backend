apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "analyticsService.fullname" . }}-spc
  labels:
    {{- include "analyticsService.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.global.keyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: users-service-jwt-secret
          objectType: secret
          objectAlias: jwt-secret
        - |
          objectName: analytics-service-redis-password
          objectType: secret
          objectAlias: redis-password
  secretObjects:
    - secretName: {{ include "analyticsService.fullname" . }}-kv
      type: Opaque
      data:
        - objectName: jwt-secret
          key: jwt-secret
        - objectName: redis-password
          key: redis-password
