apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mssqlServer.fullname" . }}-init-dbs
  labels:
    {{- include "mssqlServer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "mssqlServer.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
        component: init-dbs
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: "{{ .Values.initJob.image.repository }}:{{ .Values.initJob.image.tag }}"
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mssqlServer.fullname" . }}-sa
                  key: SA_PASSWORD
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/kv
              readOnly: true
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Esperando a mssql-server:1433..."
              for i in $(seq 1 60); do
                if /opt/mssql-tools/bin/sqlcmd -S {{ include "mssqlServer.fullname" . }} -U sa -P "$SA_PASSWORD" -Q "SELECT 1" -t 5 >/dev/null 2>&1; then
                  echo "Conectado."
                  break
                fi
                echo "  intento $i/60 - aún no responde, reintentando en 5s..."
                sleep 5
              done

              echo "Creando bases de datos (idempotente)..."
              {{- range .Values.databases }}
              /opt/mssql-tools/bin/sqlcmd -S {{ include "mssqlServer.fullname" $ }} -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = '{{ . }}') CREATE DATABASE [{{ . }}]"
              echo "  - {{ . }} OK"
              {{- end }}

              echo ""
              echo "Creando login 'miprop_admin' (mismo password que SA, sysadmin role)..."
              # Los servicios Go esperan conectarse con miprop_admin (es el user
              # de Azure SQL gestionado en producción). Lo creamos en el SQL
              # Server in-cluster con la misma SA password para que los charts
              # no tengan que cambiar credenciales según modo staging vs prod.
              # Escapamos comillas simples del password para T-SQL ('' = ').
              ESC=$(printf '%s' "$SA_PASSWORD" | sed "s/'/''/g")
              /opt/mssql-tools/bin/sqlcmd -S {{ include "mssqlServer.fullname" $ }} -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS (SELECT * FROM sys.sql_logins WHERE name = 'miprop_admin') CREATE LOGIN miprop_admin WITH PASSWORD = '$ESC'"
              /opt/mssql-tools/bin/sqlcmd -S {{ include "mssqlServer.fullname" $ }} -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_role_members r JOIN sys.server_principals m ON r.member_principal_id = m.principal_id JOIN sys.server_principals rl ON r.role_principal_id = rl.principal_id WHERE rl.name = 'sysadmin' AND m.name = 'miprop_admin') ALTER SERVER ROLE sysadmin ADD MEMBER miprop_admin"
              echo "  - login miprop_admin OK"

              echo "Init de bases + login completado."
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "mssqlServer.fullname" . }}-spc
