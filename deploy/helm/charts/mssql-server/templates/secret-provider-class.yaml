apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "mssqlServer.fullname" . }}-spc
  labels:
    {{- include "mssqlServer.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.global.keyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.global.keyVault.name | quote }}
    tenantId: {{ .Values.global.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.saPasswordSecretName }}
          objectType: secret
          objectAlias: sa-password
  secretObjects:
    - secretName: {{ include "mssqlServer.fullname" . }}-sa
      type: Opaque
      data:
        - objectName: sa-password
          key: SA_PASSWORD
