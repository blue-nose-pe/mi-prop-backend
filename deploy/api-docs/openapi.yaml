  /api/answers/by-attempt/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
        description: UUID del `exam_attempt`.
    get:
      tags: [Attempts]
      summary: Detalle por-pregunta de un attempt (enriched answers)
      description: |
        Devuelve cada respuesta del attempt con `question_text`,
        `option_text`, `option_is_correct` y `question_category`. Lo
        usa el modal "Resultados del estudiante" para:

        - **simulacro**: contar `correctas`/`incorrectas` reales (en
          vez de inferirlas de `score`/`max_score`, que solo
          coincidiría si todas las preguntas valen 1 punto);
        - **vocacional / habitos**: agrupar por `question_category`
          y calcular niveles ALTA/MEDIA/BAJA por rasgo (RIASEC,
          Estilos, Canales).

        La ruta vive bajo `/api/answers/by-attempt/...` y NO bajo
        `/api/attempts/{id}/answers` para evitar conflicto con
        `/api/attempts/by-key/{id}` en el matching del ServeMux 1.22+
        (ambos patrones matcheaban `/api/attempts/by-key/answers` sin
        ser uno estrictamente más específico → panic en startup).

        ### Scope (v0.15)

        Solo el **dueño del attempt** (caller cuyo JWT subject matchea
        `attempt.user_id`) o un **superadmin** pueden leer las respuestas.
        Otro caller → `403 FORBIDDEN`. Esto cierra el IDOR del v0.14
        donde cualquier user autenticado podía ver los detalles de
        attempts ajenos cambiando el `{id}` del path.

        El front lo usa en la vista `/test/simulacro/revision` ("Ver
        errores") que muestra cada pregunta + respuesta del alumno +
        si fue correcta.

        Permiso requerido: ser dueño del attempt o `superadmin`.
      responses:
        '200':
          description: Lista de respuestas enriquecidas (vacío si attempt sin answers).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:       { type: string, format: uuid }
                        question_text:     { type: string }
                        question_category: { type: string, description: "ej ACTIVO / REFLEXIVO / R / I / MATEMATICA / ..." }
                        option_id:         { type: string, format: uuid }
                        option_text:       { type: string }
                        option_sort_order: { type: integer }
                        option_is_correct: { type: boolean }
                        answered_at:       { type: string, format: date-time, nullable: true }
              example:
                items:
                  - question_id: "11111111-1111-1111-1111-111111111111"
                    question_text: "¿Cuál es la capital de Perú?"
                    question_category: "GENERAL"
                    option_id: "22222222-2222-2222-2222-222222222222"
                    option_text: "Lima"
                    option_sort_order: 0
                    option_is_correct: true
                    answered_at: "2026-05-09T14:25:00Z"
                  - question_id: "33333333-3333-3333-3333-333333333333"
                    question_text: "Prefiero trabajar en equipo organizando ideas."
                    question_category: "ACTIVO"
                    option_id: "44444444-4444-4444-4444-444444444444"
                    option_text: "Totalmente de acuerdo"
                    option_sort_order: 3
                    option_is_correct: true
                    answered_at: "2026-05-09T14:26:00Z"
        '404':
          description: Attempt no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "NOT_FOUND"
                message: "attempt not found"
                category: "NOT_FOUND"

  # ──────────────────────────────────────────────────────────────────
  # KEYS
  # ──────────────────────────────────────────────────────────────────
  /api/keys:
    post:
      tags: [Keys]
      summary: Generar una key
      description: |
        Crea una key de acceso para que estudiantes rindan un examen.

        **Auto-generación del `code`**: si dejás el campo vacío, el server
        arma un código con prefijo según `exam_type_id`:

        - `1` (vocacional) → `VO-XXXXXX`
        - `2` (simulacro)  → `SI-XXXXXX`
        - `3` (estilos / hábitos) → `ES-XXXXXX`

        Los 6 caracteres después del guión son alfanuméricos random
        (base32). Útil para identificar el tipo de un vistazo en reportes.
        Si pasás un `code` propio (ej. `"VOC-2026-A"`) se respeta tal cual
        y la unicidad la enforza el UNIQUE de la tabla.

        **Reglas de modo**:
        - `mode="school"` requiere `school_id` no vacío.
        - `mode="lan"` se usa para sesiones masivas sin colegio.

        Permiso requerido: `db_keys.key.write` (asesores generan, admin valida).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateKeyRequest' }
            examples:
              key_vocacional_autogen:
                summary: Vocacional, dejar que el server genere el code (recibe VO-XXXXXX)
                value:
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  section: "A"
                  valid_from: "2026-06-01T08:00:00Z"
                  valid_to:   "2026-06-30T23:59:59Z"
                  max_uses: 30
              key_simulacro_lan:
                summary: Simulacro LAN masivo, código custom
                value:
                  code: "SIM-LAN-2026-Q2"
                  exam_type_id: 2
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "lan"
                  valid_from: "2026-07-01T08:00:00Z"
                  valid_to:   "2026-07-01T18:00:00Z"
                  max_uses: 200
              key_habitos_autogen:
                summary: Estilos/hábitos, autogen (recibe ES-XXXXXX)
                value:
                  exam_type_id: 3
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  valid_from: "2026-06-01T08:00:00Z"
                  valid_to:   "2026-06-30T23:59:59Z"
                  max_uses: 30
      responses:
        '200':
          description: Key creada. El `code` puede ser el que mandaste o el autogen con prefijo.
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/Key' } } }
              example:
                key:
                  id: "b65299b3-19e8-4540-9ae7-c99a73959205"
                  code: "VO-HT74OL"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  section: "A"
                  valid_from: "2026-06-01T08:00:00Z"
                  valid_to:   "2026-06-30T23:59:59Z"
                  max_uses: 30
                  current_uses: 0
                  active: true
                  created_at: "2026-05-13T19:00:00Z"
                  updated_at: null
        '400':
          description: Validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                school_required:
                  value: { status: "error", code: "SCHOOL_ID_REQUIRED", message: "school_id is required when mode='school'", category: "VALIDATION_ERROR" }
                bad_dates:
                  value: { status: "error", code: "INVALID_DATE_RANGE", message: "valid_from must be before valid_to", category: "VALIDATION_ERROR" }

  /api/keys/{id}:
    parameters: [{ $ref: '#/components/parameters/KeyID' }]
    get:
      tags: [Keys]
      summary: Obtener key por ID
      description: |
        Devuelve la key con todos sus metadatos: code, asesor dueño, colegio
        (si aplica), ventana temporal y aforo (`max_uses` vs
        `current_uses`).

        Permiso requerido: `db_keys.key.read`.
      responses:
        '200':
          description: Key encontrada
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/Key' } } }
              example:
                key:
                  id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                  code: "S2026001"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  section: "A"
                  valid_from: "2026-06-01T00:00:00Z"
                  valid_to: "2026-06-30T23:59:59Z"
                  max_uses: 30
                  current_uses: 7
                  active: true
                  created_at: "2026-05-09T11:30:00Z"
                  updated_at: null
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Keys]
      summary: Actualizar key (solo metadatos editables)
      description: |
        Permite editar grade, section, valid_from/to, max_uses. **NO permite**
        cambiar code, mode, school_id o asesor_user_id (esos definen la
        identidad de la key — para cambiarlos, generar otra y desactivar la
        anterior).

        ### Comportamiento de `max_uses` (cambio en v0.15)

        El campo es **opcional** (nullable): omitirlo NO modifica el valor
        existente. Para setear ilimitado de forma explícita, mandar
        `max_uses: 0`.

        **Antes (v0.14)**: `max_uses` era `int32` no-nullable y omitirlo
        del body lo seteaba a `0` (ilimitado) silenciosamente. Un PATCH
        que solo cambiaba `grade` destruía el aforo sin que nadie se
        diera cuenta.

        Permiso requerido: `db_keys.key.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grade:      { type: string }
                section:    { type: string }
                valid_from: { type: string, format: date-time }
                valid_to:   { type: string, format: date-time }
                max_uses:
                  type: integer
                  format: int32
                  nullable: true
                  description: |
                    Opcional. Si se omite del body, el valor existente se
                    PRESERVA. `0` = ilimitado (explícito).
            examples:
              full:
                summary: Update completo
                value:
                  grade: "5to"
                  section: "B"
                  valid_from: "2026-06-01T00:00:00Z"
                  valid_to: "2026-07-15T23:59:59Z"
                  max_uses: 35
              only_grade:
                summary: Solo grade (max_uses NO se toca)
                value:
                  grade: "5to"
              explicit_unlimited:
                summary: Hacer la key ilimitada explícitamente
                value:
                  max_uses: 0
      responses:
        '200':
          description: Key actualizada
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/Key' } } }
              example:
                key:
                  id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                  code: "S2026001"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  section: "B"
                  valid_from: "2026-06-01T00:00:00Z"
                  valid_to: "2026-07-15T23:59:59Z"
                  max_uses: 35
                  current_uses: 7
                  active: true
                  created_at: "2026-05-09T11:30:00Z"
                  updated_at: "2026-05-09T16:00:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/keys/by-code/{code}:
    parameters:
      - in: path
        name: code
        required: true
        schema: { type: string }
        example: "S2026001"
    get:
      tags: [Keys]
      summary: Obtener key por código
      description: |
        Lookup por el código alfanumérico que el estudiante tipea para entrar
        al exam. Útil para la pantalla previa al inicio del attempt (mostrar
        en qué simulacro está por entrar).

        **No incrementa el contador de usos** — solo lee. El contador se
        incrementa al crear el attempt.

        Permiso requerido: `db_keys.key.read`.
      responses:
        '200':
          description: Key encontrada
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/Key' } } }
              example:
                key:
                  id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                  code: "S2026001"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  mode: "school"
                  grade: "5to"
                  section: "A"
                  valid_from: "2026-06-01T00:00:00Z"
                  valid_to: "2026-06-30T23:59:59Z"
                  max_uses: 30
                  current_uses: 7
                  active: true
                  created_at: "2026-05-09T11:30:00Z"
                  updated_at: null
        '404': { $ref: '#/components/responses/NotFound' }

  /api/keys/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/KeyID' }]
    post:
      tags: [Keys]
      summary: Desactivar key
      description: |
        Pone `active=false`. Los attempts que ya empezaron con esta key no se
        invalidan, pero NO se podrán iniciar nuevos. Idempotente.

        Permiso requerido: `db_keys.key.write`.
      responses:
        '200':
          description: Key desactivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/keys/validate:
    post:
      tags: [Keys]
      summary: Validar si una key es usable AHORA
      description: |
        **No incrementa el contador** — solo valida (activa, dentro de
        ventana temporal, aforo no lleno). El contador se incrementa al
        crear el `attempt`. Patrón "validate then commit".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
            example: { code: "S2026001" }
      responses:
        '200':
          description: Key válida y usable
          content:
            application/json:
              schema: { type: object, properties: { key: { $ref: '#/components/schemas/Key' } } }
        '403':
          description: Key inactiva, expirada o llena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "KEY_NOT_USABLE"
                message: "key is not usable"
                category: "PERMISSION_DENIED"

  /api/asesores/{id}/keys:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Keys]
      summary: Listar keys generadas por un asesor
      description: |
        Devuelve todas las keys cuyo `asesor_user_id` coincide con el path,
        ordenadas por `created_at DESC`. Útil para el dashboard del asesor:
        ver qué keys generó, cuáles se usaron y cuántos usos quedan.

        Permiso requerido: `db_keys.key.read` o ser el propio asesor.
      responses:
        '200':
          description: Lista (ordenada por created_at DESC)
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Key' } } } }
              example:
                items:
                  - id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                    code: "S2026001"
                    exam_type_id: 1
                    school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                    asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                    mode: "school"
                    grade: "5to"
                    section: "A"
                    valid_from: "2026-06-01T00:00:00Z"
                    valid_to: "2026-06-30T23:59:59Z"
                    max_uses: 30
                    current_uses: 7
                    active: true
                    created_at: "2026-05-09T11:30:00Z"
                    updated_at: null

  /api/colegios/{id}/students:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Schools]
      summary: Listar estudiantes del colegio (aditivo)
      description: |
        Devuelve los estudiantes asociados al colegio en **dos formas**:

        1. **Estudiantes "directos"** — usuarios cuyo `users.school_id`
           apunta a este colegio. Se obtienen vía `SearchUsers` con filtro
           `school_id=X` + `active=true`.
        2. **Estudiantes "via keys"** (nuevo en v0.15) — usuarios cuyo
           `school_id` apunta a OTRO colegio pero rindieron tests con keys
           de este colegio. Se resuelven con un JOIN cross-DB
           `db_keys.key_usage <-> db_keys.[key] WHERE k.school_id = X`,
           y se hidratan con `users-service.GetUser`. Estos vienen con
           `properties.via_key_attempts = "true"` para que el front los
           pinte distinto o aplique filtros opcionales.

        Razón del aditivo: en P1 las 3 herramientas vivían en BDs separadas
        y cada subdominio sólo veía SUS estudiantes. En P2 con la tabla
        unificada, si un alumno se registra con una key de un colegio y
        después usa una key de otro, su `users.school_id` no migra
        (decisión anti-hijack). El listado puro por `school_id` lo dejaba
        fuera del segundo colegio aunque haya rendido pruebas ahí. Con
        el aditivo, el coordinador/asesor sí lo ve.

        ### Scope (v0.15)

        - Superadmin: cualquier colegio.
        - Resto: solo colegios donde el caller tiene un `assignment`
          vigente (asesor/coordinador). Si no califica → `403 FORBIDDEN`.

      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 200, maximum: 1000 }
        - in: query
          name: after
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Lista combinada de estudiantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:   { type: integer, description: "directos + via_key_attempts" }
                  results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
                  paging:  { $ref: '#/components/schemas/Paging' }
              example:
                total: 6
                results:
                  - id: "11111111-2222-4111-9111-111111111111"
                    properties:
                      email: "estudiante1@colegio.edu.pe"
                      first_name: "Juan"
                      last_name: "Perez"
                      school_id: "55555555-5555-4555-8555-555555555555"
                      active: "true"
                  - id: "cb908c31-e3e6-492a-ace3-e3b11bd3a9a2"
                    properties:
                      email: "angel26900701@gmail.com"
                      first_name: "angel"
                      last_name: ""
                      school_id: "44444444-4444-4444-8444-444444444444"
                      active: "true"
                      via_key_attempts: "true"
        '403':
          description: Caller sin acceso a este colegio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/colegios/{id}/keys:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Keys]
      summary: Listar keys atadas a un colegio
      description: |
        Devuelve todas las keys cuyo `school_id` coincide (solo aplica a keys
        en `mode=school`). Útil para el coordinador del colegio que quiere
        ver qué keys hay vivas para su institución.

        Permiso requerido: `db_keys.key.read`.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Key' } } } }
              example:
                items:
                  - id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                    code: "S2026001"
                    exam_type_id: 1
                    school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                    asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                    mode: "school"
                    grade: "5to"
                    section: "A"
                    valid_from: "2026-06-01T00:00:00Z"
                    valid_to: "2026-06-30T23:59:59Z"
                    max_uses: 30
                    current_uses: 7
                    active: true
                    created_at: "2026-05-09T11:30:00Z"
                    updated_at: null

  /api/keys/search:
    post:
      tags: [Keys]
      summary: Búsqueda HubSpot-style de keys
      description: |
        Búsqueda paginada con filterGroups (AND dentro, OR entre grupos).

        Propiedades whitelist: `code`, `exam_type_id`, `school_id`,
        `asesor_user_id`, `mode`, `grade`, `section`, `valid_from`,
        `valid_to`, `max_uses`, `current_uses`, `active`, `created_at`,
        `updated_at`.

        Permiso requerido: `db_keys.key.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              filter_groups:
                - filters:
                    - { property_name: "active",       operator: "EQ",  values: ["true"] }
                    - { property_name: "exam_type_id", operator: "EQ",  values: ["1"] }
                    - { property_name: "valid_to",     operator: "GTE", values: ["2026-05-01T00:00:00Z"] }
              sorts: [{ property_name: "created_at", direction: "DESC" }]
              limit: 50
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                total: 12
                results:
                  - id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                    created_at: "2026-05-09T11:30:00Z"
                    updated_at: null
                    archived: false
                    properties:
                      code: "S2026001"
                      exam_type_id: 1
                      school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                      mode: "school"
                      max_uses: 30
                      current_uses: 7
                      active: true
                paging:
                  next_after: 0
                  has_more: false

  # ──────────────────────────────────────────────────────────────────
  # SURVEYS (satisfaction_service)
  # ──────────────────────────────────────────────────────────────────
  /api/surveys:
    post:
      tags: [Surveys]
      summary: Crear encuesta (en draft)
      description: |
        Crea una encuesta en estado **draft** (`published=false`,
        `version=1`). Hay que agregarle preguntas con
        `POST /api/surveys/{id}/questions` y luego publicarla.

        El `code` debe ser único — para crear una nueva versión de una
        encuesta existente, no se cambia el code, se versionan automáticamente.

        Permiso requerido: `satisfaction.survey.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, target_role, trigger_kind]
              properties:
                code:         { type: string, description: "Identificador estable (slug). Único por version." }
                title:        { type: string }
                description:  { type: string }
                target_role:  { type: string, enum: [admin, asesor, coordinador, estudiante] }
                trigger_kind: { type: string, enum: [post_test, on_demand, recurring] }
            example:
              code: "post-vocacional-2026"
              title: "Encuesta post Vocacional 2026"
              description: "Tu opinión es importante"
              target_role: "estudiante"
              trigger_kind: "post_test"
      responses:
        '200':
          description: Survey creada
          content:
            application/json:
              schema: { type: object, properties: { survey: { $ref: '#/components/schemas/Survey' } } }
              example:
                survey:
                  id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  code: "post-vocacional-2026"
                  title: "Encuesta post Vocacional 2026"
                  description: "Tu opinión es importante"
                  target_role: "estudiante"
                  trigger_kind: "post_test"
                  version: 1
                  published: false
                  active: true
                  created_at: "2026-05-09T12:00:00Z"
                  updated_at: null

  /api/surveys/{id}:
    parameters: [{ $ref: '#/components/parameters/SurveyID' }]
    get:
      tags: [Surveys]
      summary: Obtener encuesta por ID
      description: |
        Devuelve la cabecera de la encuesta (sin sus preguntas — para esas
        usar `GET /api/surveys/{id}/questions`).

        Permiso requerido: `satisfaction.survey.read`.
      responses:
        '200':
          description: Survey encontrada
          content:
            application/json:
              schema: { type: object, properties: { survey: { $ref: '#/components/schemas/Survey' } } }
              example:
                survey:
                  id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  code: "post-vocacional-2026"
                  title: "Encuesta post Vocacional 2026"
                  description: "Tu opinión es importante"
                  target_role: "estudiante"
                  trigger_kind: "post_test"
                  version: 1
                  published: true
                  active: true
                  created_at: "2026-05-09T12:00:00Z"
                  updated_at: "2026-05-09T13:00:00Z"
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Surveys]
      summary: Actualizar encuesta (solo si NO publicada)
      description: |
        Permite editar `title` y `description` mientras la encuesta esté en
        draft. Una vez publicada, hay que crear una versión nueva.

        Permiso requerido: `satisfaction.survey.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                description: { type: string }
            example:
              title: "Encuesta post Vocacional 2026 (revisada)"
              description: "Tu opinión es muy importante para mejorar el servicio"
      responses:
        '200':
          description: Survey actualizada
          content:
            application/json:
              schema: { type: object, properties: { survey: { $ref: '#/components/schemas/Survey' } } }
              example:
                survey:
                  id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  code: "post-vocacional-2026"
                  title: "Encuesta post Vocacional 2026 (revisada)"
                  description: "Tu opinión es muy importante para mejorar el servicio"
                  target_role: "estudiante"
                  trigger_kind: "post_test"
                  version: 1
                  published: false
                  active: true
                  created_at: "2026-05-09T12:00:00Z"
                  updated_at: "2026-05-09T12:30:00Z"
        '403':
          description: Survey ya publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "SURVEY_PUBLISHED_LOCKED"
                message: "published surveys cannot be edited"
                category: "PERMISSION_DENIED"

  /api/surveys/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/SurveyID' }]
    post:
      tags: [Surveys]
      summary: Publicar encuesta
      description: |
        Marca la encuesta como `published=true`. Requiere al menos una
        pregunta. A partir de este momento no se puede editar — hay que
        crear una nueva versión si se quiere cambiar algo.

        Permiso requerido: `satisfaction.survey.write`.
      responses:
        '200':
          description: Encuesta publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: La encuesta no tiene preguntas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "SURVEY_HAS_NO_QUESTIONS"
                message: "cannot publish a survey without questions"
                category: "VALIDATION_ERROR"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/surveys/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/SurveyID' }]
    post:
      tags: [Surveys]
      summary: Desactivar encuesta
      description: |
        Pone `active=false`. Las respuestas registradas se preservan; nuevas
        respuestas serán rechazadas. Idempotente.

        Permiso requerido: `satisfaction.survey.write`.
      responses:
        '200':
          description: Encuesta desactivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/surveys/by-code:
    get:
      tags: [Surveys]
      summary: Obtener encuesta por code + version
      description: |
        Lookup por la dupla `(code, version)`. Útil para que el frontend
        cargue la encuesta cuando solo conoce el slug y la versión (ej. URL
        compartible: `/encuesta/post-vocacional-2026/v1`).

        Permiso requerido: `satisfaction.survey.read`.
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
          example: "post-vocacional-2026"
        - in: query
          name: version
          required: true
          schema: { type: integer, format: int32 }
          example: 1
      responses:
        '200':
          description: Survey encontrada
          content:
            application/json:
              schema: { type: object, properties: { survey: { $ref: '#/components/schemas/Survey' } } }
              example:
                survey:
                  id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  code: "post-vocacional-2026"
                  title: "Encuesta post Vocacional 2026"
                  description: "Tu opinión es importante"
                  target_role: "estudiante"
                  trigger_kind: "post_test"
                  version: 1
                  published: true
                  active: true
                  created_at: "2026-05-09T12:00:00Z"
                  updated_at: "2026-05-09T13:00:00Z"
        '400':
          description: Falta `code` o `version` en query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "VALIDATION_ERROR"
                message: "code and version query params are required"
                category: "VALIDATION_ERROR"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/surveys/{id}/questions:
    parameters: [{ $ref: '#/components/parameters/SurveyID' }]
    get:
      tags: [Surveys]
      summary: Listar preguntas de la encuesta
      description: |
        Devuelve las preguntas de la encuesta ordenadas por `sort_order`. El
        front las muestra en ese orden al respondiente.

        Permiso requerido: `satisfaction.survey.read`.
      responses:
        '200':
          description: Lista ordenada por sort_order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SurveyQuestion' }
              example:
                items:
                  - id: "abc11111-2222-4333-8444-555555555555"
                    survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                    text: "¿Qué tan probable es que recomiendes Mi Propósito?"
                    kind: "nps"
                    sort_order: 0
                    options_json: ""
                    required: true
                  - id: "abc22222-3333-4444-8555-666666666666"
                    survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                    text: "¿La encuesta fue clara?"
                    kind: "single"
                    sort_order: 1
                    options_json: "[{\"value\":\"si\",\"label\":\"Sí\"},{\"value\":\"no\",\"label\":\"No\"}]"
                    required: true
    post:
      tags: [Surveys]
      summary: Agregar pregunta a la encuesta
      description: |
        Agrega una pregunta al final del listado (o en el `sort_order`
        provisto). Solo válido si la encuesta no está publicada todavía.

        El formato de `options_json` depende del `kind`:
        - `scale`/`nps`: `{"min":1,"max":5,"min_label":"Mal","max_label":"Excelente"}`
        - `single`/`multi`: `[{"value":"opt_1","label":"Sí"},{"value":"opt_2","label":"No"}]`
        - `open`: vacío

        Permiso requerido: `satisfaction.survey.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, kind]
              properties:
                text:         { type: string }
                kind:         { type: string, enum: [scale, nps, single, multi, open] }
                sort_order:   { type: integer, format: int32 }
                options_json: { type: string, description: "JSON serializado, formato según kind" }
                required:     { type: boolean, default: true }
            examples:
              nps:
                summary: Pregunta NPS
                value:
                  text: "¿Qué tan probable es que recomiendes Mi Propósito?"
                  kind: "nps"
                  sort_order: 1
                  required: true
              single:
                summary: Pregunta single-choice
                value:
                  text: "¿La encuesta fue clara?"
                  kind: "single"
                  sort_order: 2
                  options_json: "[{\"value\":\"si\",\"label\":\"Sí\"},{\"value\":\"no\",\"label\":\"No\"}]"
                  required: true
      responses:
        '200':
          description: Pregunta creada
          content:
            application/json:
              schema: { type: object, properties: { question: { $ref: '#/components/schemas/SurveyQuestion' } } }
              example:
                question:
                  id: "abc11111-2222-4333-8444-555555555555"
                  survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  text: "¿Qué tan probable es que recomiendes Mi Propósito?"
                  kind: "nps"
                  sort_order: 1
                  options_json: ""
                  required: true
        '404': { $ref: '#/components/responses/NotFound' }

  /api/survey-questions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
        description: UUID de la pregunta de encuesta (no del survey)
    patch:
      tags: [Surveys]
      summary: Actualizar pregunta de encuesta
      description: |
        Edita el texto, el orden, las opciones o el flag `required`. Solo
        permitido en encuestas no publicadas.

        Permiso requerido: `satisfaction.survey.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:         { type: string }
                sort_order:   { type: integer, format: int32 }
                options_json: { type: string }
                required:     { type: boolean }
            example:
              text: "¿Qué tan probable es que recomiendes Mi Propósito a un amigo?"
              sort_order: 0
              required: true
      responses:
        '200':
          description: Pregunta actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Surveys]
      summary: Eliminar pregunta de encuesta
      description: |
        Borra la pregunta. Solo permitido si la encuesta NO está publicada.

        Permiso requerido: `satisfaction.survey.write`.
      responses:
        '200':
          description: Pregunta eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/surveys/search:
    post:
      tags: [Surveys]
      summary: Búsqueda HubSpot-style de encuestas
      description: |
        Búsqueda paginada con filterGroups (AND dentro, OR entre grupos).

        Propiedades whitelist: `code`, `title`, `target_role`, `trigger_kind`,
        `version`, `published`, `active`, `created_at`.

        Permiso requerido: `satisfaction.survey.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              filter_groups:
                - filters:
                    - { property_name: "target_role", operator: "EQ", values: ["estudiante"] }
                    - { property_name: "active",      operator: "EQ", values: ["true"] }
                    - { property_name: "published",   operator: "EQ", values: ["true"] }
              sorts: [{ property_name: "created_at", direction: "DESC" }]
              limit: 20
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                total: 3
                results:
                  - id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                    created_at: "2026-05-09T12:00:00Z"
                    updated_at: "2026-05-09T13:00:00Z"
                    archived: false
                    properties:
                      code: "post-vocacional-2026"
                      title: "Encuesta post Vocacional 2026"
                      target_role: "estudiante"
                      trigger_kind: "post_test"
                      version: 1
                      published: true
                      active: true
                paging:
                  next_after: 0
                  has_more: false

  /api/survey-responses:
    post:
      tags: [Surveys]
      summary: Enviar respuesta a una encuesta
      description: |
        Persiste la respuesta + answers en una sola transacción. Falla si la
        encuesta no está publicada o está desactivada.

        Para `value_number`, mandar `has_number: true` cuando se quiera
        registrar un 0 explícito (sin el flag se interpreta como "no
        respondió numéricamente").

        Permiso requerido: `satisfaction.response.write` o ser el `user_id`
        del body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [survey_id, user_id, answers]
              properties:
                survey_id:       { type: string, format: uuid }
                user_id:         { type: string, format: uuid }
                exam_attempt_id: { type: string, format: uuid, description: "Opcional. Lo manda el front cuando trigger=post_test" }
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id]
                    properties:
                      question_id:  { type: string, format: uuid }
                      value_text:   { type: string, description: "Para open/single/multi" }
                      value_number: { type: integer, format: int32, description: "Para scale/nps" }
                      has_number:   { type: boolean, description: "true si value_number es válido (distingue 0 explícito de no-respuesta)" }
            example:
              survey_id: "0aa1..."
              user_id: "7c11..."
              exam_attempt_id: "f3b9..."
              answers:
                - { question_id: "abc1...", value_number: 9, has_number: true }
                - { question_id: "abc2...", value_text: "si" }
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema: { type: object, properties: { response: { $ref: '#/components/schemas/SurveyResponse' } } }
              example:
                response:
                  id: "ee99aabb-1122-4333-8444-555566667777"
                  survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  exam_attempt_id: "f3b9e07c-1234-4def-9876-abcdef012345"
                  submitted_at: "2026-05-09T15:25:00Z"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/survey-responses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
        description: UUID de la response (no del survey)
    get:
      tags: [Surveys]
      summary: Obtener respuesta por ID
      description: |
        Devuelve la cabecera de la respuesta. Las answers individuales no se
        exponen en este endpoint en esta versión — se procesan agregadas en
        `/api/surveys/{id}/metrics`.

        Permiso requerido: `satisfaction.response.read` o ser el dueño de la
        respuesta.
      responses:
        '200':
          description: Respuesta encontrada
          content:
            application/json:
              schema: { type: object, properties: { response: { $ref: '#/components/schemas/SurveyResponse' } } }
              example:
                response:
                  id: "ee99aabb-1122-4333-8444-555566667777"
                  survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                  user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  exam_attempt_id: "f3b9e07c-1234-4def-9876-abcdef012345"
                  submitted_at: "2026-05-09T15:25:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/surveys/{id}/metrics:
    parameters: [{ $ref: '#/components/parameters/SurveyID' }]
    get:
      tags: [Surveys]
      summary: Métricas agregadas de la encuesta
      description: |
        Calcula NPS, average y distribuciones por pregunta según el `kind`:
        - `nps`: devuelve `nps` (-100..100) y el `count` de respuestas.
        - `scale`: devuelve `average` (promedio) y la distribución por valor.
        - `single`/`multi`: devuelve `distribution` `{value: count}`.
        - `open`: solo devuelve `count`.

        Los flags `has_average` y `has_nps` indican si esos campos son
        significativos (false → ignorar el valor numérico). Computado en
        runtime sobre los responses publicados — no cacheado.

        Permiso requerido: `satisfaction.metrics.read`.
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyMetrics' }
              example:
                survey_id: "0aa1b2c3-d4e5-4f67-8a9b-0c1d2e3f4a5b"
                total_responses: 142
                per_question:
                  - question_id: "abc11111-2222-4333-8444-555555555555"
                    kind: "nps"
                    count: 142
                    average: null
                    has_average: false
                    nps: 47
                    has_nps: true
                    distribution: {}
                  - question_id: "abc22222-3333-4444-8555-666666666666"
                    kind: "single"
                    count: 142
                    average: null
                    has_average: false
                    nps: null
                    has_nps: false
                    distribution:
                      si: 128
                      no: 14
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────────────────
  # ANALYTICS
  # ──────────────────────────────────────────────────────────────────
  /api/analytics/asesor/{id}/dashboard:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Analytics]
      summary: Dashboard de un asesor
      description: |
        Agrega métricas operativas del asesor: colegios asignados, keys,
        attempts, visitas, tests pendientes y métricas por tipo de examen
        (`vocacional`, `simulacro`, `habitos`).

        Cuerpo principal:
        - `total_colegios` / `total_keys` / `total_attempts`: contadores
          básicos (igual que v1).
        - `completed_visits` / `scheduled_visits`: cantidad de visitas
          completed y scheduled del asesor (ver `/api/visitas`).
        - `pending_tests` / `affected_students`: resumen del endpoint
          `/api/analytics/asesor/{id}/pendientes` para evitar dos llamadas
          en la pantalla principal.
        - `by_exam_type`: stats por tipo de examen (puede traer 0..N entradas).

        Permiso requerido: el asesor dueño del `{id}` o superadmin. Otro
        usuario autenticado (otro asesor, coordinador, estudiante) recibe
        `403 FORBIDDEN`.
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsesorDashboard' }
              example:
                asesor_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                asesor_name: "María Quispe"
                total_colegios: 4
                total_keys: 27
                total_attempts: 542
                completed_visits: 18
                scheduled_visits: 3
                pending_tests: 26
                affected_students: 12
                by_exam_type:
                  vocacional:
                    attempts: 210
                    avg_score: 14.7
                    avg_max_score: 20.0
                  simulacro:
                    attempts: 332
                    avg_score: 62.4
                    avg_max_score: 100.0
                generated_at: "2026-05-09T16:00:00Z"
        '403':
          description: El caller no es el asesor dueño ni un superadmin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { status: "error", code: "FORBIDDEN", message: "no access to this asesor" }

  /api/analytics/colegio/{id}/dashboard:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Analytics]
      summary: Dashboard de un colegio
      description: |
        Agrega: total estudiantes (users con `school_id = id`), total
