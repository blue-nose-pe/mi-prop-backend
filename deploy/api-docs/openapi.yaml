  /api/analytics/asesor/{id}/pendientes:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Analytics]
      summary: Tests pendientes del asesor (por rendir)
      description: |
        Lista los **tests publicados y activos** que estudiantes de los
        colegios del asesor todavía no han rendido (no tienen un attempt
        con `submitted_at`).

        Agregación: para cada colegio asignado al asesor, se intersecta
        el catálogo de exams publicados aplicables (school-specific +
        abiertos) con el conjunto de exams que cada estudiante ya rindió.
        Lo que falta = pendiente.

        El response trae:
        - `by_exam_type`: contador agregado por tipo (`vocacional`,
          `simulacro`, `habitos`) — útil para los chips/contadores arriba
          de la pantalla.
        - `students`: solo aparece el estudiante si tiene **al menos un
          pendiente**. Cada entry incluye su nombre, colegio y lista
          completa de exams pendientes con nombre y código legible.

        Permiso requerido: `analytics.dashboard.read` o ser el propio
        asesor.
      responses:
        '200':
          description: Pendientes
