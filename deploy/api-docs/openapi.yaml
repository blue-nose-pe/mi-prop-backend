                asesor_name: "María Quispe"
                total_pending: 26
                total_students: 187
                by_exam_type:
                  - { exam_type_code: "vocacional", pending_attempts: 15, affected_students: 10 }
                  - { exam_type_code: "simulacro",  pending_attempts: 8,  affected_students: 6 }
                  - { exam_type_code: "habitos",    pending_attempts: 3,  affected_students: 3 }
                students:
                  - user_id: "256b28ef-f035-4056-a5e7-5232650986f4"
                    student_name: "Juan Pérez"
                    school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                    school_name: "Colegio San Pablo"
                    pending_exams:
                      - { exam_id: "e3024a97-3f7b-428e-91f8-2b090b186ed8", exam_name: "Test Vocacional Demo", exam_type_code: "vocacional", exam_code: "VOCC-2026-V1" }
                generated_at: "2026-05-14T16:00:00Z"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/visitas:
    post:
      tags: [Visitas]
      summary: Crear visita
      description: |
        Registra una visita (presencial o remota) del asesor a un colegio.

        `status` es opcional al crear (default `scheduled`). Si la visita se
        crea ya completada, mandar también `completed_at` y `status:
        "completed"`. Para el flujo típico se crea como `scheduled`, y luego
        un PATCH marca `status: "completed"` + `completed_at`.

        Permiso requerido: `db_users.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asesor_user_id, school_id, scheduled_at]
              properties:
                asesor_user_id: { type: string, format: uuid }
                school_id:      { type: string, format: uuid }
                scheduled_at:   { type: string, format: date-time }
                status:
                  type: string
                  enum: [scheduled, completed, cancelled, no_show]
                  default: scheduled
                completed_at:   { type: string, format: date-time, description: "Solo si la visita ya ocurrió al crearla." }
                notes:          { type: string }
            example:
              asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
              school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
              scheduled_at: "2026-05-20T09:00:00Z"
              notes: "Coordinar con Coord. Pérez en la entrada."
      responses:
        '200':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  visita: { $ref: '#/components/schemas/Visita' }
    get:
      tags: [Visitas]
      summary: Listar visitas (paginado, con filtros)
      description: |
        Lista paginada. Filtros opcionales por query string. Devuelve
        `total` (count sin paginar) + `items` (ordenados por
        `scheduled_at` desc).

        Permiso requerido: `db_users.school.read`.
      parameters:
        - in: query
          name: asesor_user_id
          schema: { type: string, format: uuid }
        - in: query
          name: school_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, completed, cancelled, no_show]
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: "Inclusive: scheduled_at >= from."
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: "Exclusive: scheduled_at < to."
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Visita' }
                  total: { type: integer, format: int32 }

  /api/visitas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Visitas]
      summary: Obtener una visita por ID
      description: |
        Permiso requerido: `db_users.school.read`.
      responses:
        '200':
          description: Visita
          content:
            application/json:
              schema:
                type: object
                properties:
                  visita: { $ref: '#/components/schemas/Visita' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Visitas]
      summary: Actualizar visita (parcial)
      description: |
        Convención de la API:
        - `status`, `notes`: `""` = no tocar.
        - `scheduled_at`: zero-value o ausente = no tocar.
        - `completed_at`:
          - ausente / zero-value = **no tocar**
          - `"1900-01-01T00:00:00Z"` = **limpiar a null** (deshacer la
            marca de completada)
          - cualquier otro timestamp = setear ese valor

        Flujo típico: el asesor vuelve de la visita y manda
        `{ "status": "completed", "completed_at": "<ahora>" }`.

        Permiso requerido: `db_users.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["", scheduled, completed, cancelled, no_show]
                notes:        { type: string }
                scheduled_at: { type: string, format: date-time }
                completed_at: { type: string, format: date-time }
            example:
              status: "completed"
              completed_at: "2026-05-20T11:30:00Z"
              notes: "Reunión con 4to y 5to. Pendiente envío de keys."
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  visita: { $ref: '#/components/schemas/Visita' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/analytics/estudiante/{id}/reporte:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Analytics]
      summary: Reporte "Tour Vocacional UCSP" consolidado del estudiante
      description: |
        Devuelve el reporte vocacional consolidado de un estudiante, listo
        para imprimir o renderizar como la hoja que Flor comparte con los
        participantes. Es la versión digital y al-día del PDF que hoy se
        arma manualmente.

        Si no se manda `attempt_id`, el servidor toma el último attempt
        **submitted** del usuario.

        ### Cobertura actual

        Para evitar cocinar números sin rúbrica oficial, las secciones del
        reporte se devuelven con un flag `available`:

        | Sección                | `available` | Cómo se computa hoy |
        |------------------------|-------------|---------------------|
        | `areas_interes`        | `true`      | RIASEC sobre las respuestas del attempt: cuenta `sort_order` (peso Likert) por categoría de pregunta y mapea la top a un área + carreras sugeridas. |
        | `personalidad`         | `false`     | Pendiente: cuestionario y rúbrica de 4 temperamentos (Colérico/Sanguíneo/Melancólico/Flemático). |
        | `apoyo_familiar`       | `false`     | Pendiente: cuestionario familiar + rúbrica 0..5 estrellas. |
        | `proyecto_de_vida`     | `false`     | Pendiente: cuestionario de 5 ejes (autoconocimiento / información / preparación / presupuesto / vocación). |

        Cuando UCSP entregue las rúbricas, las 3 secciones que están en
        `false` se rellenan sin cambiar este contrato.

        Permiso requerido: `analytics.dashboard.read` o ser el propio
        estudiante.
      parameters:
        - in: query
          name: attempt_id
          schema: { type: string, format: uuid }
          description: |
            Opcional. Si se omite, el server toma el último attempt
            `submitted` del usuario. Útil cuando el estudiante rindió
            varias versiones del test y querés un reporte específico.
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteEstudiante' }
              example:
                user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                student_name: "Albeyron Missael Cahuana Puma"
                attempt_id: "b0db134b-e321-40c2-a040-b140109fed84"
                exam_id: "e3024a97-3f7b-428e-91f8-2b090b186ed8"
                exam_name: "Test Vocacional Demo"
                exam_type_code: "vocacional"
                submitted_at: "2026-05-09T12:48:04Z"
                score: 8
                max_score: 12
                areas_interes:
                  available: true
                  reason: ""
                  scores:
                    R: { code: "R", label: "Realista",     points: 2, max_points: 6 }
                    I: { code: "I", label: "Investigador", points: 6, max_points: 6 }
                    A: { code: "A", label: "Artistico",    points: 1, max_points: 6 }
                    S: { code: "S", label: "Social",       points: 3, max_points: 6 }
                    E: { code: "E", label: "Emprendedor",  points: 4, max_points: 6 }
                    C: { code: "C", label: "Convencional", points: 5, max_points: 6 }
                  top:
                    - code: "I"
                      label: "Investigador"
                      area_label: "CALCULO"
                      characteristics: "Gusto de trabajar con conceptos abstractos, con numeros y problemas matematicos."
                      careers: ["Matematica", "Economia", "Ingenieria Geologica", "Telecomunicaciones", "Ingenieria de Minas", "Ingenieria Civil"]
                      points: 6
                      max_points: 6
                    - code: "C"
                      label: "Convencional"
                      area_label: "ORGANIZACION Y SISTEMAS"
                      characteristics: "Gusto por organizar informacion, seguir procedimientos y trabajar con datos estructurados."
                      careers: ["Contabilidad", "Auditoria", "Administracion"]
                      points: 5
                      max_points: 6
                personalidad:
                  available: false
                  reason: "Personality scoring requires a separate questionnaire and rubric from UCSP (4-temperaments model). To be wired when the rubric is provided."
                apoyo_familiar:
                  available: false
                  reason: "Family-support score requires a separate questionnaire and a 0..5 rubric. To be wired when the rubric is provided."
                proyecto_de_vida:
                  available: false
                  reason: "5-axis Life Project requires its own questionnaire and rubric."
                generated_at: "2026-05-14T07:30:00Z"
        '400':
          description: Validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "MISSING_USER_ID"
                message: "user_id is required"
                category: "VALIDATION_ERROR"
        '403':
          description: El attempt no pertenece al user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "ATTEMPT_NOT_OWNED"
                message: "attempt does not belong to this user"
                category: "PERMISSION_DENIED"
        '404':
          description: No hay attempt submitted del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "NO_SUBMITTED_ATTEMPT"
                message: "user has no submitted attempts to build a report from"
                category: "NOT_FOUND"

  /api/analytics/estudiante/{id}/historico:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Analytics]
      summary: Histórico completo de attempts del estudiante
      description: |
        Devuelve TODOS los tests rendidos del estudiante a lo largo del
        tiempo, ordenados cronológicamente. Útil para que el estudiante (o
        sus padres) vean evolución temporal de sus puntuaciones.

        Permiso requerido: `analytics.dashboard.read` o ser el propio
        estudiante.
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoricoEstudiante' }
              example:
                user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                items:
                  - exam_type_code: "simulacro"
                    exam_id: "ab12cd34-5678-49ab-cdef-1234567890ab"
                    exam_name: "Simulacro UCSP 2026 - 1"
                    score: 60
                    max_score: 100
                    submitted_at: "2026-03-10T10:00:00Z"
                  - exam_type_code: "simulacro"
                    exam_id: "cd34ef56-7890-49ab-cdef-1234567890cd"
                    exam_name: "Simulacro UCSP 2026 - 2"
                    score: 73
                    max_score: 100
                    submitted_at: "2026-04-12T09:42:00Z"
                  - exam_type_code: "vocacional"
                    exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                    exam_name: "Vocacional 2026 — Colegio San Pablo"
                    score: 17
                    max_score: 20
                    submitted_at: "2026-05-09T15:18:42Z"
                generated_at: "2026-05-09T16:00:00Z"

  /api/analytics/asesor/{id}/export.xlsx:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Analytics]
      summary: Exportar dashboard de asesor a Excel
      description: |
        Genera un workbook XLSX con **tres hojas**:

        - **`Asesor`** — resumen: nombre, total colegios/keys/attempts,
          visitas completadas/agendadas, y breakdown por tipo de examen
          (`Attempts`, `Score promedio`, `Score máximo prom.`).
        - **`Colegios`** — un row por colegio asignado (assignment SCD-2
          vigente): `Colegio`, `Ciudad`, `Categoría`, `ID`. Ordenada
          alfabéticamente por nombre para abrir en orden útil sin
          re-sortear en Excel.
        - **`Keys`** — un row por key creada/asociada al asesor (activas
          + inactivas): `Código`, `Tipo de examen`, `Colegio` (o
          `— (LAN)` si la key no tiene school_id), `Usos`,
          `Aforo máximo`. Ordenada por usos descendente: las keys más
          consumidas aparecen primero.

        Devuelve `application/vnd.openxmlformats-officedocument.
        spreadsheetml.sheet` binario. El frontend lo descarga directo
        (`window.location` o `Blob`).

        Permiso requerido: `analytics.dashboard.read`.
      responses:
        '200':
          description: Archivo XLSX (workbook con `Asesor` + `Colegios` + `Keys`)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/analytics/colegio/{id}/export.xlsx:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Analytics]
      summary: Exportar dashboard de colegio a Excel
      description: |
        Genera un workbook XLSX con **dos hojas**:

        - **`Colegio`** — resumen agregado: nombre del colegio, total
          estudiantes, total attempts y breakdown por tipo de examen
          (`Attempts`, `Score promedio`, `Score máximo prom.`).
        - **`Estudiantes`** — un row por cada estudiante activo del
          colegio: `Nombre`, `Apellido`, `DNI`, `Correo`, `Telefono`,
          `ID`. Ordenada por apellido + nombre para que el archivo abra
          en un orden útil sin necesidad de re-sortear en Excel.

        El listado se construye con `users_service.SearchUsers` filtrando
        por `school_id` + `active=true` (límite 200; si el colegio supera
        ese número hay que paginar, hoy ningún colegio lo hace).

        Permiso requerido: `analytics.dashboard.read`.
      responses:
        '200':
          description: Archivo XLSX (workbook con `Colegio` + `Estudiantes`)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/analytics/comparativo/export.xlsx:
    get:
      tags: [Analytics]
      summary: Exportar comparativo a Excel
      parameters:
        - in: query
          name: exam_type_code
          required: true
          schema: { type: string, enum: [vocacional, simulacro, habitos] }
      responses:
        '200':
          description: Archivo XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ──────────────────────────────────────────────────────────────────
  # HUBSPOT (mostly admin)
  # ──────────────────────────────────────────────────────────────────
  /api/hubspot/contacts:
    post:
      tags: [HubSpot]
      summary: Upsert contact en HubSpot por DNI
      description: |
        **Síncrono** — el caller necesita el `record_id` devuelto. Si se
        provee `user_id`, además persistimos el record_id en la columna
        `users.hubspot_record_id` para evitar tener que buscar el contacto
        por DNI en sincronizaciones posteriores.

        El campo `extra` permite mandar properties extra de HubSpot que no
        formen parte del contrato base (ej: campos custom del cliente).

        Permiso requerido: `hubspot.contact.write` (típicamente solo admins).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni]
              properties:
                dni:         { type: string }
                email:       { type: string, format: email }
                first_name:  { type: string }
                last_name:   { type: string }
                phone:       { type: string }
                school_name: { type: string }
                grade:       { type: string }
                user_id:     { type: string, format: uuid }
                extra:
                  type: object
                  additionalProperties: { type: string }
                  description: "Propiedades extra (escapan el contrato base)"
            example:
              dni: "70123456"
              email: "estudiante@gmail.com"
              first_name: "Juan"
              last_name: "Pérez"
              phone: "+51987654321"
              school_name: "Colegio San Pablo"
              grade: "5to"
              user_id: "7c11..."
      responses:
        '200':
          description: Record ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  record_id: { type: string, description: "ID del Contact en HubSpot (no UUID)" }
              example:
                record_id: "12345678901"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/contacts/by-dni/{dni}:
    parameters:
      - in: path
        name: dni
        required: true
        schema: { type: string }
        example: "70123456"
    get:
      tags: [HubSpot]
      summary: Buscar contact por DNI
      description: |
        Busca el `record_id` del Contact en HubSpot por DNI. Si el contact
        no existe, devuelve `record_id: ""` (string vacío) y NO 404 — para
        que el caller pueda decidir si crearlo via
        `POST /api/hubspot/contacts`.

        Permiso requerido: `hubspot.contact.read`.
      responses:
        '200':
          description: Record ID (vacío si no existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  record_id: { type: string }
              example:
                record_id: "12345678901"

  /api/hubspot/otp:
    post:
      tags: [HubSpot]
      summary: Disparar webhook OTP
      description: |
        Escribe la propiedad `otp_estudiante` en el contact (si existe) y
        dispara el Automation Webhook de HubSpot que envía el email al
        alumno con el código.

        **No hay flow inverso desde acá** — la verificación del OTP la hace
        el endpoint `POST /api/auth/student/verify-otp` contra el cache
        local. Este endpoint solo sirve para entregar el código al user.

        Permiso requerido: `hubspot.otp.write` (uso interno del backend).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp:   { type: string, description: "6 dígitos, generado server-side" }
            example: { email: "alumno@gmail.com", otp: "489201" }
      responses:
        '200':
          description: Webhook disparado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/results:
    post:
      tags: [HubSpot]
      summary: Sync de resultado de examen al Contact
      description: |
        **Asíncrono** — encolado en BullMQ con backoff exponencial. La cola
        deduplica por `attempt_id` (idempotente). El caller recibe 200 OK
        en cuanto se encola, sin esperar al resultado real del sync.

        Si el sync falla repetidamente, el job aparece en
        `GET /api/hubspot/failed` y se puede reintentar manualmente.

        Permiso requerido: `hubspot.result.write` (típicamente lo dispara el
        propio backend al finalizar un attempt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, exam_type_code, score, max_score, attempt_id, submitted_at]
              properties:
                dni:                { type: string }
                exam_type_code:     { type: string, enum: [vocacional, simulacro, habitos] }
                score:              { type: integer, format: int32 }
                max_score:          { type: integer, format: int32 }
                attempt_id:         { type: string, format: uuid }
                submitted_at:       { type: string, format: date-time }
                contact_record_id:  { type: string, description: "Opcional. Si se provee, evita un search por DNI" }
            example:
              dni: "70123456"
              exam_type_code: "simulacro"
              score: 73
              max_score: 100
              attempt_id: "f3b9e07c-1234-4def-9876-abcdef012345"
              submitted_at: "2026-05-09T15:18:42Z"
              contact_record_id: "12345678901"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/schools:
    post:
      tags: [HubSpot]
      summary: Sync school como Custom Object
      description: |
        Asíncrono — encolado en BullMQ. Idempotente por `school_id`. Crea
        o actualiza el Custom Object "Colegio" en HubSpot.

        Permiso requerido: `hubspot.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, email, nombre]
              properties:
                school_id:        { type: string, format: uuid }
                email:            { type: string }
                nombre:           { type: string }
                personal_a_cargo: { type: string }
            example:
              school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
              email: "contacto@colsanpablo.edu.pe"
              nombre: "Colegio San Pablo"
              personal_a_cargo: "Lic. Carlos Romero"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/asesores:
    post:
      tags: [HubSpot]
      summary: Sync asesor como Custom Object
      description: |
        Asíncrono. Idempotente por `asesor_user_id`. Crea o actualiza el
        Custom Object "Asesor" en HubSpot con los datos del user.

        Permiso requerido: `hubspot.asesor.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asesor_user_id, email, nombre]
              properties:
                asesor_user_id: { type: string, format: uuid }
                email:          { type: string }
                nombre:         { type: string }
                bio:            { type: string }
            example:
              asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
              email: "asesor@ucsp.edu.pe"
              nombre: "María Quispe"
              bio: "Asesora académica con 8 años de experiencia"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/failed:
    get:
      tags: [HubSpot]
      summary: Listar jobs fallidos (admin)
      description: |
        Devuelve los jobs que agotaron sus reintentos automáticos en BullMQ
        y quedaron en dead-letter. Para cada uno se ve la cola, el id, el
        motivo de la falla y el payload original para poder reintentar.

        Para reintentar uno, llamar a `POST /api/hubspot/retry` con `queue`
        y `job_id` del item.

        Permiso requerido: `hubspot.admin`.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, format: int32, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, format: int32, default: 0 }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        queue:         { type: string, example: "hubspot:sync-result" }
                        job_id:        { type: string }
                        failed_reason: { type: string }
                        payload:       { type: string, description: "JSON serializado del payload original" }
                        failed_at:     { type: string, format: date-time }
              example:
                items:
                  - queue: "hubspot:sync-result"
                    job_id: "1738"
                    failed_reason: "HubSpot API 429: rate limit exceeded"
                    payload: "{\"dni\":\"70123456\",\"attempt_id\":\"f3b9e07c-1234-4def-9876-abcdef012345\",\"score\":73}"
                    failed_at: "2026-05-09T14:21:00Z"
                  - queue: "hubspot:sync-school"
                    job_id: "1739"
                    failed_reason: "HubSpot API 400: invalid email format"
                    payload: "{\"school_id\":\"3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c\",\"email\":\"\"}"
                    failed_at: "2026-05-09T14:25:11Z"

  /api/hubspot/retry:
    post:
      tags: [HubSpot]
      summary: Reintentar un job fallido
      description: |
        Reencola un job que estaba en dead-letter. El `queue` y `job_id`
        salen del listado de `GET /api/hubspot/failed`. Si el job ya no
        existe (fue removido) responde con `ok: false`.

        Permiso requerido: `hubspot.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queue, job_id]
              properties:
                queue:  { type: string }
                job_id: { type: string }
            example:
              queue: "hubspot:sync-result"
              job_id: "1738"
      responses:
        '200':
          description: Resultado del retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
              example:
                ok: true
        '400': { $ref: '#/components/responses/ValidationError' }

# ====================================================================
# Components
# ====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT obtenido via `POST /api/auth/login`.
        Vence a las 12 horas — renovar con `POST /api/auth/refresh`.

  parameters:
    UserID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del user
    SchoolID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del colegio
    ExamID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del exam
    QuestionID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la pregunta
    AttemptID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del attempt
    KeyID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la key
    SurveyID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la encuesta

  responses:
    Empty:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: "ok" }
    NotFound:
      description: Recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "NOT_FOUND"
            message: "resource not found"
            category: "NOT_FOUND"
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "INVALID_EMAIL"
            message: "email format is invalid"
            errors:
              - { code: "INVALID_EMAIL", message: "email format is invalid", context: { propertyName: ["email"] } }
            category: "VALIDATION_ERROR"
    RateLimit:
      description: Demasiadas requests
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a esperar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "RATE_LIMIT"
            message: "too many requests"

  schemas:
    # ----- Error envelope -----
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:         { type: string, enum: [error] }
        code:           { type: string, description: "Código simbólico (ej: EMAIL_TAKEN)" }
        message:        { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        category:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL_ERROR, RATE_LIMIT]
        correlation_id: { type: string, description: "Reflejado también en el header X-Correlation-Id" }

    ErrorDetail:
      type: object
      properties:
        code:    { type: string }
        message: { type: string }
        context:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Contexto del error. Convención: `propertyName: ["email"]` para
            indicar qué campo causó el problema.

    # ----- Auth -----
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    LoginResponse:
      type: object
      properties:
        user:         { $ref: '#/components/schemas/User' }
        permissions:  { type: array, items: { type: string }, description: "Codes de permisos efectivos" }
        access_token: { type: string }
        refresh_token: { type: string }

    # ----- Common search -----
    SearchRequest:
      type: object
      properties:
        filter_groups:
          type: array
          items:
            type: object
            properties:
              filters:
                type: array
                items:
                  type: object
                  required: [property_name, operator]
                  properties:
                    property_name: { type: string }
                    operator:
                      type: string
                      enum: [EQ, NEQ, LT, LTE, GT, GTE, IN, NOT_IN, CONTAINS, STARTS_WITH, HAS_PROPERTY, NOT_HAS_PROPERTY, BETWEEN]
                    values:
                      type: array
                      items: { type: string }
        properties:
          type: array
          items: { type: string }
          description: "Whitelist de propiedades a devolver. Vacío = default del schema."
        sorts:
          type: array
          items:
            type: object
            properties:
              property_name: { type: string }
              direction:     { type: string, enum: [ASC, DESC], default: ASC }
        limit: { type: integer, format: int32, default: 50, maximum: 200 }
        after: { type: integer, format: int32, default: 0, description: "Offset para paginación" }

    SearchResponse:
      type: object
      properties:
        total: { type: integer, format: int64 }
        results:
          type: array
          items:
            type: object
            properties:
              id:         { type: string }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time, nullable: true }
              archived:   { type: boolean }
              properties:
                type: object
                additionalProperties: true
        paging:
          type: object
          properties:
            next_after: { type: integer, format: int32 }
            has_more:   { type: boolean }

    # ----- Domain entities -----
    User:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        email:                { type: string, format: email }
        first_name:           { type: string }
        last_name:            { type: string }
        document_number:      { type: string }
        phone:                { type: string, description: "Telefono del usuario. '' si no se cargo. Espejo del campo phone en HubSpot." }
        school_id:            { type: string, format: uuid, description: "'' si no pertenece a un colegio" }
        active:               { type: boolean }
        last_access_at:       { type: string, format: date-time, nullable: true }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time, nullable: true }
        is_superadmin:
          type: boolean
          description: "Si true, el user bypassa el chequeo de permisos. Solo otro superadmin puede setear este flag."
        must_change_password:
          type: boolean
          description: "Si true, todas las rutas excepto Me y ChangeMyPassword devuelven 403 PASSWORD_CHANGE_REQUIRED."

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:           { type: string, format: email }
        password:        { type: string, format: password, minLength: 8 }
        first_name:      { type: string }
        last_name:       { type: string }
        document_number: { type: string }
        phone:           { type: string, description: "Opcional. Se sincroniza a HubSpot junto con el resto del contacto." }
        school_id:       { type: string, format: uuid, description: "UUID del colegio. Opcional. Usar GET /api/schools para llenar el dropdown." }
        permission_group_id:
          type: integer
          format: int32
          description: "Opcional. Si >0, asigna el grupo al user recién creado en la misma llamada (evita el round-trip extra a /api/users/{id}/permissions/groups)."

    # ----- Permissions -----
    Permission:
      type: object
      description: |
        Permiso individual del catálogo. El catálogo lo gobierna Blue Nose
        vía migraciones SQL — el cliente solo lo lista (no lo edita).
      properties:
        id:          { type: integer, format: int32 }
        code:
          type: string
          description: "Código `<service>.<table>.<action>` (ej: `db_users.users.read`)"
        scope:
          type: string
          description: "Microservicio dueño del permiso (ej: `db_users`, `db_exams`, `analytics`)"
        name:        { type: string }
        description: { type: string }

    PermissionGroup:
      type: object
      description: |
        Grupo de permisos (rol). El cliente lo crea combinando permisos del
        catálogo. Los users se asignan a uno o más grupos vía
        `POST /api/users/{id}/permissions/groups`.
      properties:
        id:          { type: integer, format: int32 }
        code:
          type: string
          description: "Código único y estable del grupo (ej: `marketing_permissions`). No editable."
        name:        { type: string }
        description: { type: string }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time, nullable: true }
        permissions:
          type: array
          description: "Permisos individuales asociados al grupo (hidratados)."
          items: { $ref: '#/components/schemas/Permission' }

    CreatePermissionGroupRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: "Código único del grupo. Una vez creado no se puede editar."
        name:        { type: string }
        description: { type: string }
        permission_ids:
          type: array
          description: |
            Opcional. Si se pasan, los permisos quedan asociados al grupo en
            el momento de la creación. Se pueden agregar/quitar después con
            los endpoints de `/api/permission-groups/{id}/permissions/{permission_id}`.
          items: { type: integer, format: int32 }

    UpdatePermissionGroupRequest:
      type: object
      description: |
        Solo se pueden editar `name` y `description`. El `code` es la clave
        estable y no se modifica.
      properties:
        name:        { type: string }
        description: { type: string }

    School:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        user_id:            { type: string, format: uuid, description: "Usuario que representa al colegio" }
        name:               { type: string }
        city:               { type: string, description: "Ciudad/distrito del colegio. '' si no se cargó." }
        category:
          type: string
          enum: ["", "A+", "A", "B", "C", "D"]
          description: |
            Tag interno UCSP para clasificar el colegio. '' = sin clasificar.
            No es categoría oficial (Saber 11 es Colombia); convención interna.
        active:             { type: boolean }
        hubspot_record_id:  { type: string, description: "ID del Custom Object Colegio en HubSpot. '' si todavía no se sincronizó." }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time, nullable: true }

    Exam:
      type: object
      properties:
        id:               { type: string, format: uuid }
        exam_type_id:     { type: integer, format: int32, description: "FK al catálogo exam_type" }
        school_id:        { type: string, format: uuid, description: "'' si exam abierto" }
        parent_exam_id:   { type: string, format: uuid, description: "'' si primera versión" }
        version:          { type: integer, format: int32, description: "Versión dentro de la familia. Al clonar, sube monótono: max(version) de la familia + 1." }
        code:             { type: string, description: "Identificador legible único (p.ej. \"VOCC-2026-V3\"). Visible al usuario en la UI." }
        name:             { type: string }
        start_at:         { type: string, format: date-time }
        end_at:           { type: string, format: date-time }
        max_participants: { type: integer, format: int32, description: "0 = ilimitado" }
        published:        { type: boolean }
        active:           { type: boolean }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time, nullable: true }

    CreateExamRequest:
      type: object
      required: [exam_type_code, name, start_at, end_at]
      properties:
        exam_type_code:    { type: string, enum: [vocacional, simulacro, habitos] }
        school_id:         { type: string, format: uuid }
        code:
          type: string
          description: |
            Identificador legible que se ve en la UI. **Opcional**: si llega
            vacío el servidor autogenera uno con el formato
            `{PREFIX}-{YYYY}-V1` donde `PREFIX` es:
              * `VOCC` para `vocacional`
              * `SIME` para `simulacro`
              * `ESTI` para `habitos`
            Si el código que mandás ya existe, devuelve `409 EXAM_CODE_TAKEN`.
        name:              { type: string }
        start_at:          { type: string, format: date-time }
        end_at:            { type: string, format: date-time }
        max_participants:  { type: integer, format: int32 }

    Question:
      type: object
      properties:
        id:         { type: string, format: uuid }
        text:       { type: string }
        category:   { type: string }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    QuestionOption:
      type: object
      properties:
        id:          { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        text:        { type: string }
        is_correct:  { type: boolean }
        sort_order:  { type: integer, format: int32 }

    ExamQuestion:
      type: object
      properties:
        exam_id:     { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        points:      { type: integer, format: int32 }
        sort_order:  { type: integer, format: int32 }

    Attempt:
      type: object
      properties:
        id:           { type: string, format: uuid }
        exam_id:      { type: string, format: uuid }
        user_id:      { type: string, format: uuid }
        key_id:       { type: string, format: uuid, description: "'' si no se usó key" }
        score:        { type: integer, format: int32 }
        max_score:    { type: integer, format: int32 }
        started_at:   { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }

    Key:
      type: object
      properties:
        id:             { type: string, format: uuid }
        code:           { type: string, description: "Código alfanumérico" }
        exam_type_id:   { type: integer, format: int32 }
        school_id:      { type: string, format: uuid, description: "'' en mode='lan'" }
        asesor_user_id: { type: string, format: uuid }
        mode:           { type: string, enum: [school, lan] }
        grade:          { type: string }
        section:        { type: string }
        valid_from:     { type: string, format: date-time, nullable: true }
        valid_to:       { type: string, format: date-time, nullable: true }
        max_uses:       { type: integer, format: int32, description: "0 = ilimitado" }
        current_uses:   { type: integer, format: int32 }
        active:         { type: boolean }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time, nullable: true }

    GenerateKeyRequest:
      type: object
      required: [exam_type_id, asesor_user_id, mode]
      properties:
        code:           { type: string, description: "Opcional — si vacío, se genera random" }
        exam_type_id:   { type: integer, format: int32 }
        school_id:      { type: string, format: uuid, description: "Requerido si mode=school" }
        asesor_user_id: { type: string, format: uuid }
        mode:           { type: string, enum: [school, lan] }
        grade:          { type: string }
        section:        { type: string }
        valid_from:     { type: string, format: date-time, nullable: true }
        valid_to:       { type: string, format: date-time, nullable: true }
        max_uses:       { type: integer, format: int32, default: 0 }

    Survey:
      type: object
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string }
        title:        { type: string }
        description:  { type: string }
        target_role:  { type: string, enum: [admin, asesor, coordinador, estudiante] }
        trigger_kind: { type: string, enum: [post_test, on_demand, recurring] }
        version:      { type: integer, format: int32 }
        published:    { type: boolean }
        active:       { type: boolean }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }

    SurveyQuestion:
      type: object
      properties:
        id:           { type: string, format: uuid }
        survey_id:    { type: string, format: uuid }
        text:         { type: string }
        kind:         { type: string, enum: [scale, nps, single, multi, open] }
        sort_order:   { type: integer, format: int32 }
        options_json: { type: string, description: "JSON serializado, formato según kind" }
        required:     { type: boolean }

    SurveyResponse:
      type: object
      properties:
        id:              { type: string, format: uuid }
        survey_id:       { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        exam_attempt_id: { type: string, format: uuid }
        submitted_at:    { type: string, format: date-time }

    SurveyMetrics:
      type: object
      properties:
        survey_id:       { type: string, format: uuid }
        total_responses: { type: integer, format: int32 }
        per_question:
          type: array
          items:
            type: object
            properties:
              question_id:  { type: string, format: uuid }
              kind:         { type: string }
              count:        { type: integer, format: int32 }
              average:      { type: number, format: double, nullable: true, description: "Para scale/nps" }
              has_average:  { type: boolean }
              nps:          { type: integer, format: int32, nullable: true, description: "-100..100, solo para kind=nps" }
              has_nps:      { type: boolean }
              distribution:
                type: object
                additionalProperties: { type: integer, format: int32 }
                description: "Solo para single/multi: option_value → count"

    # ----- Analytics dashboards -----
    ExamTypeStats:
      type: object
      properties:
        attempts:      { type: integer, format: int32 }
        avg_score:     { type: number, format: double }
        avg_max_score: { type: number, format: double }

    AsesorDashboard:
      type: object
      properties:
        asesor_id:         { type: string, format: uuid }
        asesor_name:       { type: string }
        total_colegios:    { type: integer, format: int32, description: "Colegios donde el asesor es responsable vigente." }
        total_keys:        { type: integer, format: int32 }
        total_attempts:    { type: integer, format: int32 }
        completed_visits:  { type: integer, format: int32, description: "Visitas con status=completed del asesor." }
        scheduled_visits:  { type: integer, format: int32, description: "Visitas con status=scheduled (próximas)." }
        pending_tests:     { type: integer, format: int32, description: "Suma cross-estudiantes de tests publicados sin attempt submitted." }
        affected_students: { type: integer, format: int32, description: "Estudiantes con al menos un test pendiente." }
        by_exam_type:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ExamTypeStats' }
        generated_at:      { type: string, format: date-time }

    Visita:
      type: object
      properties:
        id:             { type: string, format: uuid }
        asesor_user_id: { type: string, format: uuid }
        school_id:      { type: string, format: uuid }
        scheduled_at:   { type: string, format: date-time }
        completed_at:   { type: string, format: date-time, nullable: true, description: "null si todavía no se completó." }
        status:
          type: string
          enum: [scheduled, completed, cancelled, no_show]
        notes:          { type: string }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time, nullable: true }

    PendingExam:
      type: object
      properties:
        exam_id:        { type: string, format: uuid }
        exam_name:      { type: string }
        exam_type_code: { type: string, enum: [vocacional, simulacro, habitos] }
        exam_code:      { type: string }

    PendingStudent:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        student_name: { type: string }
        school_id:    { type: string, format: uuid }
        school_name:  { type: string }
        pending_exams:
          type: array
          items: { $ref: '#/components/schemas/PendingExam' }

    PendingExamTypeCount:
      type: object
      properties:
        exam_type_code:    { type: string }
        pending_attempts:  { type: integer, format: int32, description: "Suma cross-estudiantes de tests pendientes del tipo." }
        affected_students: { type: integer, format: int32, description: "Estudiantes con al menos un pendiente del tipo." }

    AsesorPendientes:
      type: object
      properties:
        asesor_id:      { type: string, format: uuid }
        asesor_name:    { type: string }
        total_pending:  { type: integer, format: int32 }
        total_students: { type: integer, format: int32, description: "Total de estudiantes evaluados (todos los de los colegios del asesor)." }
        by_exam_type:
          type: array
          items: { $ref: '#/components/schemas/PendingExamTypeCount' }
        students:
          type: array
          items: { $ref: '#/components/schemas/PendingStudent' }
          description: "Solo incluye estudiantes con >=1 pendiente."
        generated_at:   { type: string, format: date-time }

    ColegioDashboard:
      type: object
      properties:
        school_id:      { type: string, format: uuid }
        school_name:    { type: string }
        total_students: { type: integer, format: int32 }
        total_attempts: { type: integer, format: int32 }
        by_exam_type:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ExamTypeStats' }
        generated_at:   { type: string, format: date-time }

    EstudianteDashboard:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        student_name: { type: string }
        tests:
          type: array
          items: { $ref: '#/components/schemas/TestResult' }
        generated_at: { type: string, format: date-time }

    TestResult:
      type: object
      properties:
        exam_type_code: { type: string }
        exam_id:        { type: string, format: uuid }
        exam_name:      { type: string }
        score:          { type: integer, format: int32 }
        max_score:      { type: integer, format: int32 }
        submitted_at:   { type: string, format: date-time }

    ColegioComparativo:
      type: object
      properties:
        exam_type_code: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              school_id:   { type: string, format: uuid }
              school_name: { type: string }
              avg_score:   { type: number, format: double }
              attempts:    { type: integer, format: int32 }
        generated_at:   { type: string, format: date-time }

    HistoricoEstudiante:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/TestResult' }
        generated_at: { type: string, format: date-time }

    HistoricoColegioPoint:
      type: object
      properties:
        period:        { type: string, description: "Etiqueta YYYY-QN" }
        year:          { type: integer, format: int32 }
        quarter:       { type: integer, format: int32, minimum: 1, maximum: 4 }
        avg_score:     { type: number, format: double, description: "Promedio del porcentaje score/max_score*100. 0..100." }
        attempts:      { type: integer, format: int32 }
        variation_pct: { type: number, format: double, description: "Variación % vs el período anterior. Ignorar si has_previous=false." }
        has_previous:  { type: boolean }

    HistoricoColegio:
      type: object
      properties:
        school_id:      { type: string, format: uuid }
        school_name:    { type: string }
        city:           { type: string }
        category:       { type: string, description: "Tag UCSP del colegio en ese momento (A+/A/B/C/D o '')." }
        exam_type_code: { type: string, description: "'' si agregado de todos los tipos." }
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoricoColegioPoint' }
        generated_at:   { type: string, format: date-time }

    ColegiosHistoricoRow:
      type: object
      properties:
        school_id:     { type: string, format: uuid }
        school_name:   { type: string }
        city:          { type: string }
        category:      { type: string }
        avg_score:     { type: number, format: double }
        attempts:      { type: integer, format: int32 }
        variation_pct: { type: number, format: double }
        has_previous:  { type: boolean }

    ColegiosHistorico:
      type: object
      properties:
        period:         { type: string, description: "YYYY-QN del período resuelto" }
        exam_type_code: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ColegiosHistoricoRow' }
        generated_at:   { type: string, format: date-time }

    CategoryStat:
      type: object
      properties:
        code:       { type: string, description: "Código RIASEC: R/I/A/S/E/C" }
        label:      { type: string, description: "Nombre del eje (Realista, Investigador...)" }
        points:     { type: integer, format: int32 }
        max_points: { type: integer, format: int32, description: "Máximo alcanzable en esta categoría dado el exam" }

    AreaInteresMatch:
      type: object
      properties:
        code:            { type: string }
        label:           { type: string }
        area_label:      { type: string, description: "Etiqueta del área que se imprime grande (p.ej. 'CALCULO')" }
        characteristics: { type: string, description: "Descripción del área para mostrar al estudiante" }
        careers:
          type: array
          items: { type: string }
        points:     { type: integer, format: int32 }
        max_points: { type: integer, format: int32 }

    AreasInteresSection:
      type: object
      properties:
        available: { type: boolean }
        reason:    { type: string, description: "Por qué no está disponible si available=false" }
        scores:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CategoryStat' }
          description: "Mapa codigo RIASEC -> stats. Una entrada por categoría con datos."
        top:
          type: array
          items: { $ref: '#/components/schemas/AreaInteresMatch' }
          description: "Top 1-3 áreas por puntaje, listas para imprimir."

    ReportSection:
      type: object
      description: |
        Sobre genérico para secciones del reporte cuyo cálculo aún depende
        de una rúbrica externa de UCSP (personalidad, apoyo familiar,
        proyecto de vida). Cuando se entreguen las reglas, esto se
        reemplaza por un schema concreto sin cambiar el endpoint.
      properties:
        available: { type: boolean }
        reason:    { type: string }

    ReporteEstudiante:
      type: object
      properties:
        user_id:        { type: string, format: uuid }
        student_name:   { type: string }
        attempt_id:     { type: string, format: uuid }
        exam_id:        { type: string, format: uuid }
        exam_name:      { type: string }
        exam_type_code: { type: string }
        submitted_at:   { type: string, format: date-time, nullable: true }
        score:          { type: integer, format: int32 }
        max_score:      { type: integer, format: int32 }
        areas_interes:    { $ref: '#/components/schemas/AreasInteresSection' }
        personalidad:     { $ref: '#/components/schemas/ReportSection' }
        apoyo_familiar:   { $ref: '#/components/schemas/ReportSection' }
        proyecto_de_vida: { $ref: '#/components/schemas/ReportSection' }
        generated_at:   { type: string, format: date-time }
