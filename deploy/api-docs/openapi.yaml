  /api/analytics/colegio/{id}/historico:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Analytics]
      summary: Histórico trimestral de un colegio
      description: |
        Agrupa los `exam_attempt` del colegio por **quarter** (`YYYY-QN`,
        calculado en UTC sobre `submitted_at`) y calcula el promedio del
        porcentaje `score / max_score * 100` por bucket. Devuelve además la
        variación porcentual contra el quarter anterior.

        Items ordenados ascendentemente por período (más antiguo → más
        nuevo). Pensado para gráficas de línea.

        Pensado para la pantalla **Histórico de Colegio** al hacer click en
        una fila del listado.

        Permiso requerido: `analytics.dashboard.read`.
      parameters:
        - in: query
          name: exam_type_code
          schema: { type: string, enum: [vocacional, simulacro, habitos] }
          description: "Opcional. Si se omite agrega los attempts de todos los tipos."
          example: "simulacro"
        - in: query
          name: periods
          schema: { type: integer, minimum: 1, maximum: 40, default: 8 }
          description: "Cantidad de quarters más recientes a devolver. Default 8 (≈ 2 años)."
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoricoColegio' }
              example:
                school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                school_name: "Colegio Santa María"
                city: "Arequipa"
                category: "A+"
                exam_type_code: "simulacro"
                items:
                  - { period: "2025-Q1", year: 2025, quarter: 1, avg_score: 62.0, attempts: 40, variation_pct: 0, has_previous: false }
                  - { period: "2025-Q2", year: 2025, quarter: 2, avg_score: 67.5, attempts: 52, variation_pct: 8.87, has_previous: true }
                  - { period: "2025-Q3", year: 2025, quarter: 3, avg_score: 64.1, attempts: 48, variation_pct: -5.04, has_previous: true }
                generated_at: "2026-05-13T16:00:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/analytics/colegios/historico:
    get:
      tags: [Analytics]
      summary: Listado cross-colegio con métrica del período actual
      description: |
        Devuelve una fila por cada colegio activo con: `avg_score` del
        período solicitado, `attempts` del período, `variation_pct` contra
        el período anterior y los campos descriptivos (`city`, `category`).
        Ordenado alfabéticamente por nombre.

        Si el colegio no tuvo attempts en el período anterior, `has_previous`
        es `false` y `variation_pct` no es interpretable (el front debería
        mostrar "—").

        Este endpoint sirve directamente la grilla **Histórico de Colegio**
        del dashboard de admin.

        Permiso requerido: **superadmin** (vista agregada de TODOS los
        colegios). Un asesor o coordinador autenticado recibe `403`.
      parameters:
        - in: query
          name: period
          schema: { type: string, default: "current" }
          description: |
            Período a usar. Valores: `current` (= quarter actual en UTC) o
            literal `YYYY-QN` (ej `2026-Q1`). Vacío equivale a `current`.
          example: "current"
        - in: query
          name: exam_type_code
          schema: { type: string, enum: [vocacional, simulacro, habitos] }
          description: "Opcional. Si se omite agrega todos los tipos."
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColegiosHistorico' }
              example:
                period: "2026-Q2"
                exam_type_code: "simulacro"
                items:
                  - { school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c", school_name: "Colegio Santa María", city: "Arequipa", category: "A+", avg_score: 67.4, attempts: 48, variation_pct: 4.2, has_previous: true }
                  - { school_id: "5e21b9a3-4c8d-4a1b-bc55-8e9f0a1b2c3d", school_name: "Inst. Nacional Camilo Torres", city: "Cayma", category: "A", avg_score: 61.1, attempts: 31, variation_pct: -1.3, has_previous: true }
                  - { school_id: "ab12cd34-5678-49ab-cdef-1234567890ab", school_name: "Col. Americano", city: "Yanahuara", category: "A", avg_score: 64.6, attempts: 22, variation_pct: 0, has_previous: false }
                generated_at: "2026-05-13T16:00:00Z"

