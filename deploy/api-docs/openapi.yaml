openapi: 3.1.0

# ====================================================================
# Mi Propósito 2.0 — API REST pública (gateway)
# ====================================================================
# Este archivo es la fuente de verdad para el frontend Angular y para
# cualquier integración externa. Toda ruta documentada acá corre en el
# gateway (Go + REST→gRPC) y termina en uno de los 6 microservicios
# internos (users, exams, keys, hubspot, satisfaction, analytics).
#
# Cómo se renderiza:
#   - `index.html` carga este archivo con Stoplight Elements (3 columnas,
#     "try it", search). Servir con cualquier servidor estático.
#   - También compatible con Swagger UI, ReDoc y Postman (importar YAML).

info:
  title: Mi Propósito 2.0 API
  version: 0.15.0
  summary: API REST pública del sistema Mi Propósito 2.0 (UCSP).
  description: |
    # Bienvenido

    Esta es la **API REST pública** del sistema Mi Propósito 2.0 — la plataforma
    de orientación vocacional, simulacro de admisión y hábitos de estudio de la
    UCSP (Arequipa).

    Todo el tráfico HTTPS pasa por el **gateway**, que valida JWT, aplica CORS
    y rate-limit, y traduce las requests REST a llamadas gRPC contra los
    microservicios internos.

    ## Plataforma e infraestructura

    - **Persistencia**: Azure SQL gestionado en la suscripción del cliente
      (UCSP). Cada microservicio tiene su propia base lógica (`db_users`,
      `db_exams`, `db_keys`, `db_satisfaction`).
    - **Migraciones T-SQL**: se aplican automáticamente al primer arranque
      de cada servicio mediante un Job `pre-install` / `pre-upgrade` del
      chart Helm — no requieren intervención manual.
    - **JWT**: el secret HS256 es el MISMO en todos los microservicios. El
      gateway lo emite (login/refresh/student-otp); los demás servicios lo
      validan via interceptor gRPC.
    - **Auth**: access token de 12 h + refresh token de 7 días con rotación.
      Cada `refresh` revoca el refresh anterior y emite uno nuevo.
    - **Superadmin inicial**: el chart Helm crea automáticamente un Secret
      `<release>-users-service-superadmin` con email + password aleatoria.
      Leer la password una sola vez con
      `kubectl get secret <release>-users-service-superadmin -n miproposito -o jsonpath='{.data.password}' | base64 -d`
      y forzar el cambio en el primer login (`POST /api/users/me/change-password`).
    - **Health**: el gateway expone `GET /health` (sin prefijo `/api/`) para
      readiness/liveness del Ingress y checks externos. No requiere auth.

    ## Cambios — v0.15.0 (2026-05-21)

    Sesión grande de bugfixes (auditoría de seguridad + comportamientos
    legados de Mi Propósito 1). Lo más relevante:

    ### Seguridad (rompe cliente si dependía de bugs)

    - **IDOR cerrado**: 11 endpoints que aceptaban `{id}` del path sin validar
      ownership ahora exigen `superadmin` o que el caller sea dueño/asesor
      del recurso. Afecta: `GET /api/attempts/{id}`, `POST /api/attempts/{id}/answer`,
      `POST /api/attempts/{id}/finish`, `GET /api/answers/by-attempt/{id}`,
      `GET /api/users/{id}/attempts`, `GET /api/exams/{id}/attempts` (solo superadmin),
      `GET /api/attempts/by-key/{id}`, `GET /api/colegios/{id}/keys`,
      `GET /api/colegios/{id}/students`, `GET /api/colegios/{id}/dashboard|historico|export.xlsx`,
      `GET /api/analytics/estudiante/{id}/dashboard|historico|reporte|reporte.xlsx`,
      `GET /api/analytics/asesor/{id}/pendientes|export.xlsx`. En todos:
      respuesta `403 FORBIDDEN` cuando el caller no califica.
    - **Impersonación bloqueada en `POST /api/attempts`**: el `user_id` del
      body se ignora (se usa el del JWT) salvo que el caller sea superadmin.
      Antes un estudiante podía mandar `user_id` de otro alumno y consumir
      su aforo a su nombre.
    - **`GET /api/analytics/dashboard` (global)** ahora exige superadmin.
    - **Anti-enumeración mejorada**: `POST /api/auth/student/request-otp` y
      `POST /api/auth/student/register-with-key` devuelven `200` uniforme
      independientemente de si el email existe o si pertenece a otro rol.
    - **`clientIP` priorizando `X-Real-Ip`** sobre `X-Forwarded-For` para
      rate-limit y auditoría (XFF era spoofeable trivialmente).

    ### Comportamiento del flujo de prueba

    - **`POST /api/attempts` cross-type guard**: si la `key_code` es de
      `exam_type` distinto al del `exam_id`, devuelve `422 KEY_EXAM_TYPE_MISMATCH`
      (ej: key vocacional `VO-XXXXX` usada para iniciar un Simulacro).
    - **Idempotencia de StartAttempt**: si el caller ya tenía un attempt
      sin submit para el mismo exam, se devuelve ese mismo (no se crea
      uno nuevo ni se consume aforo extra).
    - **Race-safe**: `IncrementUsage` de keys_service se llama ANTES de
      crear el attempt; si el aforo está lleno → `422 KEY_NOT_USABLE`.
    - **`POST /api/attempts/{id}/finish` no aplica scoring académico a
      vocacional** (`exam_type_id=1`): devuelve `score=0, max_score=0`.
      El reporte real con RIASEC se consulta vía
      `GET /api/analytics/estudiante/{id}/reporte`.
    - **`POST /api/auth/student/register-with-key` acepta keys LAN** (sin
      colegio asignado). El estudiante queda con `users.school_id=NULL`
      pero puede rendir el examen masivo.

    ### Comportamiento de listados / datos

    - **`GET /api/colegios/{id}/students` aditivo**: ahora incluye también
      estudiantes que rindieron tests con keys de este colegio, aunque su
      `users.school_id` apunte a otro. Estos vienen con
      `properties.via_key_attempts = "true"` para que el front pueda
      diferenciarlos visualmente.
    - **`PATCH /api/keys/{id}` con `max_uses` opcional**: el campo es
      `*int32` (nullable). Si no se envía → no se modifica. Antes, omitir
      `max_uses` lo seteaba a `0` (ilimitado) silenciosamente y destruía
      el aforo.
    - **Avg score normalizado** en `GetAsesorDashboard` /
      `GetColegioDashboard`: ahora promedia porcentajes (cada attempt
      aporta `score/max_score * 100`) en lugar de sumar puntos absolutos
      de exams con escalas distintas.

    ### OTP / delivery

    - **OTP del estudiante via Resend** (HTTP) en lugar del HubSpot
      Workflow. El cliente UCSP no tuvo que cambiar nada en su CRM. El
      sync del contacto a HubSpot se conserva como best-effort en
      goroutine. Toggle por env var `OTP_SENDER=resend|hubspot`
      (default `hubspot`, prod actual: `resend`).
    - `POST /api/auth/student/request-otp`: regex front ahora exige 6
      dígitos exactos (era 4-8 y dejaba al usuario adivinar).
    - **`hubspot_service.SendOTP` propaga errores de upsert**: si la
      operación de upsertar el contacto falla, ya no dispara el webhook
      con OTP vacío.

    ## Arquitectura interna (resumen)

    ```
      Frontend (Angular) ──HTTPS REST──▶ gateway ──gRPC──▶ users-service
                                                       ├──▶ exams-service
                                                       ├──▶ keys-service
                                                       ├──▶ hubspot-service
                                                       ├──▶ satisfaction-service
                                                       └──▶ analytics-service
    ```

    ## Autenticación

    Todas las rutas excepto las marcadas como `públicas` requieren un
    **access token JWT** en el header:

    ```
    Authorization: Bearer <access_token>
    ```

    El token se obtiene con `POST /api/auth/login`. Vence a las **12 horas**.
    Para renovarlo sin volver a pedir credenciales, usar `POST /api/auth/refresh`
    con el `refresh_token` (vence a los **7 días**).

    Los refresh tokens se rotan en cada uso: cada `Refresh` revoca el viejo y
    devuelve uno nuevo. Si un atacante reusa un refresh token revocado, el
    servidor lo detecta y rechaza.

    ## Identificación

    - **Usuarios internos** (admin, asesor, coordinador): login con email + password.
    - **Estudiantes**: login con OTP (6 dígitos enviados al email vía HubSpot Automation).
    - **Business key**: el **DNI** (`document_number`) es el identificador estable
      cross-sistema (también es la clave de búsqueda en HubSpot).

    ## Errores

    Todos los errores siguen un envelope estándar **HubSpot-style**:

    ```json
    {
      "status": "error",
      "code": "EMAIL_TAKEN",
      "message": "email already registered",
      "errors": [
        { "code": "EMAIL_TAKEN", "message": "email already registered",
          "context": { "propertyName": ["email"] } }
      ],
      "category": "CONFLICT",
      "correlation_id": "a3f9..."
    }
    ```

    | HTTP | Categoría             | Cuándo                                      |
    |-----:|-----------------------|---------------------------------------------|
    | 400  | `VALIDATION_ERROR`    | Body inválido / campos faltantes            |
    | 401  | `UNAUTHENTICATED`     | Sin token, token expirado o credenciales bad |
    | 403  | `PERMISSION_DENIED`   | Autenticado pero sin permiso                 |
    | 404  | `NOT_FOUND`           | Recurso no existe                            |
    | 409  | `CONFLICT`            | Choque de unicidad (email ya tomado, etc.)   |
    | 429  | `RATE_LIMIT`          | Demasiadas requests (default 600/IP/min)     |
    | 500  | `INTERNAL_ERROR`      | Error inesperado del servidor                |

    ## Búsqueda HubSpot-style

    Los endpoints `*/search` (users, exams, questions, keys, surveys) aceptan
    el mismo schema de búsqueda compuesta:

    - `filterGroups[]`: lista de grupos. **Filtros dentro del mismo grupo se
      combinan con AND**; **distintos grupos se combinan con OR**.
    - `properties[]`: qué columnas devolver (whitelist por entidad — no se puede
      pedir `password_hash`).
    - `sorts[]`: ordenamiento (default: `created_at DESC, id DESC`).
    - `limit`: 1-200 (default 50).
    - `after`: offset para paginación.

    ## Sistema de permisos

    El sistema usa el formato **`<service>.<table>.<action>`** para los códigos
    de permiso. Eso da granularidad por (microservicio, tabla, acción) y
    escala sin ambigüedad cuando aparecen tablas nuevas.

    - **service**: `db_users`, `db_exams`, `db_keys`, `db_satisfaction`,
      `hubspot`, `analytics`.
    - **table**: nombre de la tabla destino (o `dashboard`/`export` para
      servicios sin BD propia como analytics).
    - **action**: `read` o `write` (granularidad puede crecer sin romper
      compatibilidad).

    Ejemplos:

    ```
    db_users.users.read              → listar y ver detalle de users
    db_users.users.write             → crear/editar/desactivar users
    db_users.permission.write        → editar el catálogo de permisos
    db_exams.exam.write              → crear/publicar/clonar exams
    db_keys.key.write                → generar y deactivar keys
    hubspot.contact.write            → upsert de contacts en HS
    analytics.dashboard.read         → leer cualquier dashboard agregado
    ```

    Los permisos se asignan a los users **a través de `permission_group`**
    (no directamente). Hay 3 grupos canónicos seedeados:

    - `admin_permissions`: CRUD completo sobre todas las tablas operacionales.
      No incluye `db_users.permission.write` (eso es exclusivo del superadmin).
    - `asesor_permissions`: lectura amplia + write en sus colegios y keys.
    - `coordinador_permissions`: lectura del colegio asignado + sus
      estudiantes y resultados.

    ## Superadmin

    Hay un flag `is_superadmin` en `users` que **bypassa el chequeo de
    permisos**: cualquier llamada autorizada con un token de superadmin
    pasa el check sin importar el `permission_group` asignado. El JWT del
    superadmin trae el rol `superadmin` en el claim `roles[]`.

    El **primer superadmin** se crea automáticamente al instalar el chart
    Helm:

    1. El chart crea un Secret `<release>-users-service-superadmin` con una
       password aleatoria de 24 chars (preservada entre `helm upgrade` —
       no se regenera).
    2. Un k8s Job (`post-install`/`post-upgrade` hook) corre el binario
       `bootstrap` que verifica si ya hay algún user con `is_superadmin=1`.
       Si no, crea uno con el email + password del Secret y `must_change_password=1`.
    3. El admin lee la password una sola vez con:

       ```powershell
       kubectl get secret <release>-users-service-superadmin -n miproposito `
         -o jsonpath='{.data.password}' | base64 -d
       ```

    4. En el primer login, el sistema fuerza al superadmin a cambiar la
       password vía `POST /api/users/me/change-password`. Hasta que no la
       cambie, todas las rutas (excepto `Me` y `ChangeMyPassword`) devuelven
       `403 PASSWORD_CHANGE_REQUIRED`.

    El superadmin puede crear otros superadmins via `PATCH /api/users/{id}`
    (próximamente — el contrato existe; el handler está pendiente).
    También puede **resetear** la password de cualquier user con
    `POST /api/users/{id}/reset-password` (devuelve la password temporal
    una sola vez para entregársela al user).

    ## Quickstart — flujos completos para el frontend

    Esta sección muestra los flujos reales del producto, paso a paso, con
    los bodies y respuestas tal cual los devuelve el backend en sandbox.
    Sirve de guía rápida para integrar desde Angular.

    ### Flujo 1 — Login admin / asesor / coordinador

    ```http
    POST /api/auth/login
    Content-Type: application/json

    { "email": "admin@ucsp.edu.pe", "password": "..." }
    ```

    Respuesta:

    ```json
    {
      "user": { "id": "68BD...", "email": "...", "is_superadmin": true, "must_change_password": false, "active": true },
      "permissions": [],
      "access_token": "eyJ...",   // 12 h
      "refresh_token": "eyJ..."   // 7 días, rotativo
    }
    ```

    Guardar `access_token` en memoria; mandarlo en cada request como
    `Authorization: Bearer <access_token>`. Cuando expire, llamar
    `POST /api/auth/refresh` con el `refresh_token` para conseguir un par nuevo.

    ### Flujo 2 — Login estudiante (OTP por email)

    El estudiante NO usa password. Pide un código de un solo uso:

    ```http
    POST /api/auth/student/request-otp
    Content-Type: application/json

    { "email": "alumno@example.com" }
    ```

    El backend genera un código de 6 dígitos, lo guarda hasheado y lo envía
    al email del estudiante (vía workflow de HubSpot Automation). El
    estudiante recibe el mail y lo verifica:

    ```http
    POST /api/auth/student/verify-otp
    Content-Type: application/json

    { "email": "alumno@example.com", "otp": "654321" }
    ```

    Si el código matchea, el backend devuelve el mismo shape que `/login`
    (user + access_token + refresh_token + permissions).

    ### Flujo 3 — Crear y asignar un grupo de permisos

    Modelo de tres niveles: **permiso atómico** (`db_exams.exam.write`) →
    **grupo** (set de permisos atómicos con `code`/`name`) → **usuario**
    (al cual se le asigna 0..N grupos).

    Listar el catálogo de permisos atómicos:

    ```http
    GET /api/permissions
    Authorization: Bearer <admin_token>
    ```

    Crear un grupo "Cargador de exámenes":

    ```http
    POST /api/permission-groups
    Authorization: Bearer <admin_token>

    {
      "code": "exam_loader",
      "name": "Cargador de exámenes",
      "description": "Solo carga preguntas y crea exámenes",
      "permission_ids": [25, 26, 27, 28, 29]
    }
    ```

    Asignar el grupo a un usuario:

    ```http
    POST /api/users/{user_id}/permissions/groups
    Authorization: Bearer <admin_token>

    { "permission_group_id": 7 }
    ```

    ### Flujo 4 — Generar una key para que un grupo de estudiantes rinda un test

    El asesor genera el código que después le pasa al colegio. `mode` debe
    ser `"school"` (con `school_id` obligatorio) o `"lan"` (sin school).

    ```http
    POST /api/keys
    Authorization: Bearer <admin_token>

    {
      "code": "VOC-2026-A",
      "exam_type_id": 1,
      "school_id": "",
      "asesor_user_id": "<id_del_asesor>",
      "mode": "lan",
      "grade": "5",
      "section": "A",
      "valid_from": "2026-01-01T00:00:00Z",
      "valid_to":   "2027-01-01T00:00:00Z",
      "max_uses": 100
    }
    ```

    El estudiante valida la key antes de empezar:

    ```http
    POST /api/keys/validate
    { "code": "VOC-2026-A" }
    ```

    Devuelve la key entera (incluyendo `exam_type_id`, `valid_from/to`,
    `current_uses`/`max_uses`) si está activa y vigente. El front la usa
    para mostrarle al estudiante "estás por rendir el Test Vocacional".

    ### Flujo 5 — Tomar un examen completo (start → answer → finish)

    Este es el flujo central del estudiante. Se hace **una llamada por cada
    pregunta** porque las opciones NO viajan anidadas en el listing del
    examen (decisión deliberada para mantener payloads chicos en exámenes
    largos).

    **Paso 1 — listar las preguntas del examen** (devuelve solo IDs y orden):

    ```http
    GET /api/exams/{exam_id}/questions
    Authorization: Bearer <student_token>
    ```

    ```json
    {
      "items": [
        { "exam_id": "...", "question_id": "Q1", "points": 1, "sort_order": 0 },
        { "exam_id": "...", "question_id": "Q2", "points": 1, "sort_order": 1 }
      ]
    }
    ```

    **Paso 2 — iniciar el attempt** (esto consume 1 uso de la key):

    ```http
    POST /api/attempts
    Authorization: Bearer <student_token>

    {
      "exam_id":  "<exam_id>",
      "user_id":  "<student_id>",
      "key_code": "VOC-2026-A"
    }
    ```

    Devuelve `{"attempt": {"id": "...", "started_at": "..."}}`.

    **Paso 3 — para cada pregunta, traer sus opciones y mandar la respuesta**:

    ```http
    GET /api/questions/{question_id}/options
    Authorization: Bearer <student_token>
    ```

    ```json
    {
      "options": [
        { "id": "OPT1", "text": "Nada",     "is_correct": false, "sort_order": 0 },
        { "id": "OPT2", "text": "Poco",     "is_correct": false, "sort_order": 1 },
        { "id": "OPT3", "text": "Bastante", "is_correct": false, "sort_order": 2 },
        { "id": "OPT4", "text": "Mucho",    "is_correct": true,  "sort_order": 3 }
      ]
    }
    ```

    > **Nota**: `is_correct` viene en la respuesta porque la API es interna y
    > admite que los formularios de admin lo muestren. **El frontend del
    > estudiante NO debe mostrarlo en pantalla** — usar solo `id`/`text`.

    Mandar la respuesta:

    ```http
    POST /api/attempts/{attempt_id}/answer
    Authorization: Bearer <student_token>

    {
      "question_id": "Q1",
      "option_id":   "OPT3"
    }
    ```

    Repetir por cada pregunta. Las respuestas son idempotentes por
    `(attempt_id, question_id)` — si el estudiante cambia de opción, el
    backend reemplaza la respuesta vieja.

    **Paso 4 — finalizar el attempt** (calcula score y cierra el intento):

    ```http
    POST /api/attempts/{attempt_id}/finish
    Authorization: Bearer <student_token>
    ```

    Respuesta:

    ```json
    {
      "attempt": {
        "id": "...",
        "exam_id": "...",
        "user_id": "...",
        "score": 10,
        "max_score": 10,
        "started_at":   "2026-05-09T12:00:00Z",
        "submitted_at": "2026-05-09T12:25:30Z"
      }
    }
    ```

    En tests psicológicos (vocacional, hábitos) `score` siempre vuelve `0` —
    no hay respuestas "correctas", el análisis de perfil RIASEC/VARK se
    hace en el módulo Analytics. En el simulacro de admisión el `score`
    refleja las respuestas correctas (1 punto por pregunta acertada).

    ### Flujo 6 — Encuesta de satisfacción post-test

    Crear la encuesta (admin):

    ```http
    POST /api/surveys
    {
      "code": "sat-vocacional-2026",
      "title": "Tu experiencia con el test vocacional",
      "description": "Tu opinión nos ayuda a mejorar",
      "target_role": "estudiante",
      "trigger_kind": "post_test"
    }
    ```

    `trigger_kind` debe ser uno de: `post_test`, `on_demand`, `recurring`.

    Agregar preguntas a la encuesta:

    ```http
    POST /api/surveys/{survey_id}/questions
    {
      "text": "¿Cómo calificás el test?",
      "kind": "scale",
      "sort_order": 1,
      "required": true,
      "options_json": "{\"min\":1,\"max\":5}"
    }
    ```

    `kind` debe ser uno de: `scale` (escala numérica), `nps`, `single`
    (un select), `multi` (multi-select), `open` (texto libre).

    Publicar y dejarla disponible:

    ```http
    POST /api/surveys/{survey_id}/publish
    ```

    El estudiante envía su respuesta linkeándola al attempt del examen:

    ```http
    POST /api/survey-responses
    Authorization: Bearer <student_token>

    {
      "survey_id":       "<survey_id>",
      "user_id":         "<student_id>",
      "exam_attempt_id": "<attempt_id>",
      "answers": [
        {
          "question_id":  "<question_id>",
          "value_text":   "",
          "value_number": 5,
          "has_number":   true
        }
      ]
    }
    ```

    `has_number=true` indica que el valor a guardar es `value_number` (para
    `kind=scale` o `nps`); `false` indica que se usa `value_text` (para
    `kind=open|single|multi`).

    ### Flujo 7 — Analytics y exports

    El asesor ve el resumen de su grupo:

    ```http
    GET /api/analytics/asesor/{asesor_id}/dashboard
    Authorization: Bearer <admin_token>
    ```

    Y descarga un Excel con el detalle:

    ```http
    GET /api/analytics/asesor/{asesor_id}/export.xlsx
    Authorization: Bearer <admin_token>
    ```

    Devuelve `Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`.
    Dashboards equivalentes para colegio (`/api/analytics/colegio/{id}/dashboard`),
    estudiante (`/api/analytics/estudiante/{id}/dashboard`) y comparativo
    cross-asesor (`/api/analytics/comparativo`).

    **Reglas de scope en analytics** (todas validadas en el gateway,
    devolviendo `403 FORBIDDEN` en vez de filtrar la query):

    - `/api/analytics/asesor/{id}/dashboard`,
      `/api/analytics/asesor/{id}/pendientes`,
      `/api/analytics/asesor/{id}/export.xlsx` →
      solo el asesor dueño o un superadmin. Otro asesor recibe `403`.
    - `/api/analytics/colegio/{id}/...` →
      asesor o coordinador con el colegio asignado, o superadmin.
    - `/api/analytics/estudiante/{id}/...` →
      el propio estudiante (self-scope) o superadmin.
    - `/api/analytics/comparativo`,
      `/api/analytics/colegios/historico`,
      `/api/analytics/comparativo/export.xlsx`,
      `/api/analytics/dashboard` (global) →
      **superadmin-only** (vistas agregadas de TODOS los colegios; un
      asesor no debería ver scores de colegios fuera de su zona).

    ### Flujo 8 — Sync HubSpot

    **Al crear o actualizar un user, el sync a HubSpot es automático**: el
    backend dispara un `UpsertContact` en background tras `POST /api/users`,
    `POST /api/users/bulk` o `PATCH /api/users/{id}`. Si HubSpot está caído
    el user igual queda creado y se puede forzar el sync después.

    Para empujar manualmente entidades distintas a un user (colegio, asesor
    o resultado de un test), usar los endpoints dedicados:

    Sincronizar un contacto (estudiante o asesor):

    ```http
    POST /api/hubspot/contacts
    Authorization: Bearer <admin_token>

    { "email": "...", "dni": "12345678", "first_name": "...", "last_name": "..." }
    ```

    Devuelve `{ "record_id": "220618784410" }` (ID del contact en HubSpot).
    Si el contact ya existía, hace upsert por DNI.

    Otros endpoints equivalentes: `/api/hubspot/schools` (colegios),
    `/api/hubspot/asesores`, `/api/hubspot/results` (resultado de un test).

    ### Notas para integrar desde Angular

    - **Refresh transparente**: interceptor HTTP que ante un `401 TOKEN_EXPIRED`
      llama `/api/auth/refresh` y reintenta el request original con el nuevo
      access_token. Si el refresh también falla → logout.
    - **Polling de estado**: el endpoint `GET /api/users/me` devuelve user
      + permisos efectivos en una sola llamada. Útil para inicializar la app.
    - **Idempotencia de respuestas**: re-mandar una respuesta de examen al
      mismo `(attempt_id, question_id)` la actualiza en lugar de crear duplicados.
    - **Validaciones del backend**: cuando un POST falla, el body trae
      `{"status":"error","code":"<CODE>","message":"..."}`. Los códigos más
      comunes están en la sección "Errores" arriba.

    ## Convenciones

    - Todos los IDs UUID se transportan como `string` (formato canónico `36`
      caracteres con guiones).
    - Timestamps en formato ISO 8601 UTC (`2026-05-02T14:30:00Z`).
    - Bodies JSON con `Content-Type: application/json`.
    - Headers de respuesta: `X-Correlation-Id` para trazabilidad end-to-end.

  contact:
    name: Mi Propósito 2.0 — Blue Nose
    email: pablo.perez@bluenose.pe

  license:
    name: Propietario UCSP
    identifier: UNLICENSED

# ====================================================================
# Servers
# ====================================================================
servers:
  - url: https://api.miproposito.ucsp.edu.pe
    description: Producción
  - url: https://api-staging.miproposito.ucsp.edu.pe
    description: Staging (para QA)
  - url: http://localhost:8080
    description: Desarrollo local (gateway directo)

# ====================================================================
# Tags (orden = orden en el sidebar)
# ====================================================================
tags:
  - name: Auth
    description: |
      Login, refresh, logout y flujo OTP de estudiante. Emite y rota JWT
      (access 12 h HS256 + refresh 7 días con rotación).

      Rutas públicas (sin token): `login`, `refresh`, `student/request-otp`,
      `student/verify-otp`. La ruta `logout` requiere `Authorization: Bearer`
      del dueño del refresh token (anti-DoS sobre la sesión).

  - name: Users
    description: |
      CRUD de usuarios + asignación de permission groups + búsqueda.
      Un `User` modela cualquier persona del sistema (admin, asesor, coordinador,
      estudiante). Los colegios también se representan como users — ver `Schools`.

  - name: Permissions
    description: |
      Administración de roles y permisos. Los grupos los crea el cliente
      combinando permisos del catálogo. El catálogo de permisos individuales
      (codes como `db_users.users.read`) lo gobierna Blue Nose vía migraciones
      SQL — el cliente solo lo lista.

  - name: Schools
    description: Colegios. Cada `school` está atado a un `user.id` (`schools_as_users`).

  - name: Visitas
    description: |
      Visitas (presenciales o remotas) de un asesor a un colegio. Estados:
      `scheduled`, `completed`, `cancelled`, `no_show`. El dashboard del
      asesor cuenta las `completed` para la métrica de "visitas realizadas".

  - name: Exams
    description: |
      Exámenes (vocacional / simulacro / hábitos) y su versionado por linaje.
      Editar las preguntas de un exam publicado obliga a clonarlo (nueva versión
      con `parent_exam_id` apuntando al original).

  - name: Questions
    description: Banco de preguntas reusable + sus opciones (multiple choice).

  - name: ExamQuestions
    description: Asociación N:M entre `exam` y `question` con puntaje y orden.

  - name: Attempts
    description: Intentos de un usuario contra un examen + sus respuestas.

  - name: Keys
    description: |
      Códigos de acceso a tests. Modos: `school` (atado a un colegio) o `lan`
      (sesión masiva sin colegio).

  - name: Surveys
    description: |
      Encuestas de satisfacción configurables (NPS, escala, abierta, single,
      multi). Incluye cálculo de métricas agregadas (NPS, average, distribución).

  - name: Analytics
    description: |
      Dashboards agregados (asesor, colegio, estudiante) + comparativos +
      históricos + export Excel.

  - name: HubSpot
    description: |
      Sincronización con HubSpot (contacts, custom objects Key/Asesor/Colegio,
      OTP webhook). Mayoría de endpoints son **admin-only**.

# ====================================================================
# Security global
# ====================================================================
security:
  - bearerAuth: []

# ====================================================================
# Paths
# ====================================================================
paths:
  # ──────────────────────────────────────────────────────────────────
  # HEALTH
  # ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Auth]
      summary: Health-check del gateway
      description: |
        Endpoint sin prefijo `/api/` usado por:

        - el Liveness/Readiness probe del Pod en AKS,
        - el Ingress Controller (Application Gateway),
        - monitoreo externo / status pages.

        Es público (no exige `Authorization`) y no chequea dependencias
        downstream — solo confirma que el gateway está vivo y aceptando
        conexiones HTTP. Para health checks profundos (BD, Redis, gRPC
        backends), ver el endpoint `/admin/health` interno de cada microservicio.
      security: []  # público
      responses:
        '200':
          description: Gateway up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  # ──────────────────────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login con email + password
      description: |
        Verifica credenciales contra `users-service` y emite un par
        `access_token` + `refresh_token`. Si el user no existe o la password
        es incorrecta, devuelve `401 INVALID_CREDENTIALS` **sin distinguir**
        cuál falló (anti-enumeración).

        El campo `permissions` retornado son los `code`s granulares
        en formato `<service>.<table>.<action>` (ej. `db_users.users.read`,
        `db_keys.key.write`) que el frontend usa para habilitar/ocultar UI.

        Para superadmins, `permissions` viene como `["*"]` (sentinel —
        el front interpreta como "todo permitido").
      security: []  # público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Login de admin UCSP
                value: { email: "admin@ucsp.edu.pe", password: "Sup3rS3cr3t!" }
              asesor:
                summary: Login de asesor
                value: { email: "asesor@ucsp.edu.pe", password: "Otr0Pass!" }
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  id: "9b24e0e3-3d22-4c14-bd8b-62a7b6a8d21f"
                  email: "admin@ucsp.edu.pe"
                  first_name: "Admin"
                  last_name: "UCSP"
                  document_number: "00000000"
                  school_id: ""
                  active: true
                permissions: ["db_users.users.read", "db_users.users.write", "db_users.school.read", "db_users.school.write"]
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "INVALID_CREDENTIALS"
                message: "email or password is incorrect"
                category: "UNAUTHENTICATED"
        '403':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "USER_INACTIVE"
                message: "user account is disabled"
                category: "PERMISSION_DENIED"
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar refresh token y obtener nuevo access
      description: |
        Valida el `refresh_token` (firma + estado en BD), lo **revoca**, emite
        un nuevo par y devuelve ambos. El cliente DEBE descartar el refresh
        anterior — si lo reusa, el servidor lo detecta y rechaza con `401`.

        Si el user fue desactivado entre el login y el refresh, el servidor
        **revoca toda la familia de refresh tokens** del user y devuelve
        `403 USER_INACTIVE`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: "Refresh token entregado por /login o un /refresh anterior." }
            example:
              refresh_token: "eyJhbGciOiJIUzI1NiI..."
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:  { type: string }
                  refresh_token: { type: string, description: "NUEVO refresh — descartar el anterior" }
              example:
                access_token: "eyJhbGciOi..."
                refresh_token: "eyJhbGciOi... (rotated)"
        '401':
          description: Refresh inválido / expirado / revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "INVALID_REFRESH_TOKEN"
                message: "refresh token is invalid, expired or revoked"
                category: "UNAUTHENTICATED"

  /api/auth/student/request-otp:
    post:
      tags: [Auth]
      summary: Disparar OTP de login para estudiante
      description: |
        Inicia el flujo de login alternativo de estudiantes (sin password).
        El servidor genera un OTP de 6 dígitos, lo persiste con TTL de
        **10 minutos** y dispara el webhook Automation de HubSpot que envía
        el código por email al alumno.

        **Comportamiento silencioso (anti-enumeración)**: la respuesta es
        SIEMPRE `200 {"status":"ok"}`, aunque:

        - el email no exista en la BD,
        - el user exista pero NO sea estudiante,
        - ya haya un OTP activo (en ese caso se invalida el viejo y se
          genera uno nuevo).

        Reglas:

        - Solo **un OTP activo por usuario**: pedir uno nuevo invalida el
          anterior aunque no haya expirado.
        - **TTL = 10 minutos** desde que se emite.
        - **Máximo 3 intentos fallidos** en `verify-otp` antes de invalidarse.
      security: []  # público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example: { email: "alumno@gmail.com" }
      responses:
        '200':
          description: Aceptado (siempre — el comportamiento real es silencioso)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
        '400':
          description: Body inválido (no JSON, falta `email`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "BAD_BODY"
                message: "invalid request body"
                category: "VALIDATION_ERROR"
        '500':
          description: HubSpot Automation devolvió error al enviar el email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "OTP_DELIVERY_FAIL"
                message: "could not dispatch OTP email"
                category: "INTERNAL_ERROR"
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/auth/student/verify-otp:
    post:
      tags: [Auth]
      summary: Verificar OTP y obtener access + refresh
      description: |
        Verifica el OTP recibido por email contra el OTP activo del user.
        Si matchea, lo marca como consumido y emite el par
        `access_token` + `refresh_token` (mismo schema que `/api/auth/login`).

        Causas de `401 OTP_INVALID` (no se distinguen para no filtrar info):

        - El OTP no matchea el almacenado.
        - El OTP ya expiró (>10 min desde request).
        - El OTP ya fue consumido.
        - El user no existe / no es estudiante.
        - Se llegó al límite de 3 intentos fallidos (OTP queda invalidado).
      security: []  # público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp:   { type: string, description: "6 dígitos" }
            example: { email: "alumno@gmail.com", otp: "489201" }
      responses:
        '200':
          description: OTP correcto — sesión emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                user:
                  id: "7c11..."
                  email: "alumno@gmail.com"
                  first_name: "Juan"
                  last_name: "Pérez"
                  document_number: "70123456"
                  active: true
                  is_superadmin: false
                  must_change_password: false
                permissions: ["db_exams.exam.read","db_satisfaction.survey.read"]
                access_token: "eyJhbGci..."
                refresh_token: "eyJhbGci..."
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: OTP inválido / expirado / consumido / user no estudiante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "OTP_INVALID"
                message: "otp is invalid, expired or already used"
                category: "UNAUTHENTICATED"
        '403':
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "USER_INACTIVE"
                message: "user account is disabled"
                category: "PERMISSION_DENIED"
        '429': { $ref: '#/components/responses/RateLimit' }

  /api/auth/student/register-with-key:
    post:
      tags: [Auth]
      summary: Auto-registro de estudiante con llave válida
      description: |
        Crea (o reusa) un usuario estudiante asociado al colegio que
        resuelve la llave y dispara el envío del OTP. Pensado para el
        flujo público donde el estudiante NO fue cargado previamente por
        el coordinador y se da de alta a sí mismo con el código de la
        llave que su asesor distribuyó.

        ### Flujo interno

        1. **`keys_service.ValidateKey(key_code)`** — read-only; verifica
           que la llave exista, esté `active=true`, dentro de
           `valid_from`/`valid_to` y con `current_uses < max_uses`. NO
           consume aforo.
        2. **Antes (v0.14)**: keys LAN (sin `school_id`) eran rechazadas
           con `422 KEY_HAS_NO_SCHOOL`. **En v0.15**: se aceptan; el
           estudiante queda con `users.school_id = NULL` pero puede
           rendir el examen masivo (replica del flujo "LAN##" de P1).
        3. **`users_service.AuthService.RegisterStudentWithKey`** —
           idempotente y **anti-enumeración**:
           - email no existe → crea user con `permission_group =
             student_permissions`, `school_id` resuelto de la llave
             (NULL si la key es LAN), password random (nunca se usa —
             login es siempre OTP), `active=true`. Responde
             `status: "created"`.
           - email existe como estudiante del **mismo `school_id`**:
             reusa el user y solo dispara OTP nuevo. Responde
             `status: "exists"`.
           - email pertenece a otro rol (asesor/admin/coord) o a otro
             colegio: **se responde `status: "exists"` igualmente, sin
             disparar OTP**, y se logea internamente. Esto evita la
             enumeración trivial donde un atacante podía descubrir
             qué emails son staff probando con sus propias keys.
        4. **OTP** se envía igual que `/api/auth/student/request-otp`
           (mismo TTL 10 min, mismo `OTP_SENDER` configurado en
           `users_service` — actualmente Resend HTTP en prod).
      security: []  # público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, first_name, last_name, key_code]
              properties:
                email:           { type: string, format: email }
                first_name:      { type: string, example: "María" }
                last_name:       { type: string, example: "González" }
                document_number: { type: string, description: "DNI opcional; recomendado para dedup", example: "70123456" }
                phone:           { type: string, description: "Teléfono opcional", example: "+51999111222" }
                key_code:        { type: string, example: "SI-000018" }
            example:
              email: "maria.gonzalez@gmail.com"
              first_name: "María"
              last_name: "González"
              document_number: "70123456"
              phone: "+51999111222"
              key_code: "SI-000018"
      responses:
        '200':
          description: Usuario creado (o reusado) — OTP disparado por correo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [created, exists]
                    description: |
                      `created` si se insertó un user nuevo;
                      `exists` si el email ya pertenecía a un estudiante
                      del mismo colegio (solo se reenvió OTP).
              example: { status: "created" }
        '400':
          description: Body inválido o faltan campos obligatorios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "VALIDATION_ERROR"
                message: "email, first_name, last_name y key_code son obligatorios"
                category: "VALIDATION_ERROR"
        '404':
          description: La llave no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "KEY_NOT_FOUND"
                message: "key not found"
                category: "NOT_FOUND"
        '409':
          description: Email pertenece a otro rol o a otro colegio (anti-hijack)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EMAIL_TAKEN"
                message: "email already in use"
                category: "CONFLICT"
        '410':
          description: Llave vencida o agotada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                expired:
                  value:
                    status: "error"
                    code: "KEY_EXPIRED"
                    message: "key is outside its validity window"
                    category: "GONE"
                exhausted:
                  value:
                    status: "error"
                    code: "KEY_EXHAUSTED"
                    message: "key reached its max_uses cap"
                    category: "GONE"
        '422':
          description: Llave en modo LAN — no asignable para auto-registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "KEY_HAS_NO_SCHOOL"
                message: "esta llave no esta asociada a un colegio"
                category: "VALIDATION_ERROR"
        '429': { $ref: '#/components/responses/RateLimit' }
        '500':
          description: Falló el envío del OTP por HubSpot Automation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "OTP_DELIVERY_FAIL"
                message: "could not dispatch OTP email"
                category: "INTERNAL_ERROR"

  /api/auth/student/lookup-by-key:
    post:
      tags: [Auth]
      summary: Preflight para la pantalla pública de acceso al test
      description: |
        Endpoint público que el front llama desde
        `/test/{vocacional|simulacro|eda}/acceso` para decidir qué hacer
        ANTES de pedir OTP:

        | Respuesta | Front hace |
        |---|---|
        | `exists=false` | Redirige al form de registro (`/registro`). |
        | `exists=true, can_attempt=true` | Pide OTP normalmente. |
        | `exists=true, can_attempt=false` | Bloquea con mensaje (no manda OTP). |

        ### Anti-enumeration

        El payload requiere `key_code` además de `email`. El gateway
        **valida la key PRIMERO** (`keys.ValidateKey`) y solo si la key
        existe + está activa + dentro de su ventana responde algo sobre
        el email. Un atacante sin una key válida no puede iterar emails.

        Además aplica **rate-limit estricto**: `30 req/min/IP` con bucket
        Redis separado (`rl:lookup:`) del global. Un script de
        enumeration recibe `429 RATE_LIMIT` antes de poder cubrir un
        dominio razonable de emails.

        ### Reglas para `can_attempt`

        - `max_attempts_per_user > 0` y el estudiante ya rindió esa
          cantidad de attempts SUBMITTED con esta key → `can_attempt=false`,
          `block_reason="max_attempts"`.
        - `max_uses > 0` y `current_uses >= max_uses` y el estudiante
          **no tiene `key_usage` previo** → `can_attempt=false`,
          `block_reason="aforo_lleno"`.
        - En cualquier otro caso → `can_attempt=true`.
      security: []  # público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, key_code]
              properties:
                email:    { type: string, format: email, example: "maria.gonzalez@gmail.com" }
                key_code: { type: string, example: "SI-000018" }
      responses:
        '200':
          description: Resultado del preflight. La forma es uniforme aún si el email no existe (anti-enumeration).
          content:
            application/json:
              schema:
                type: object
                required: [exists, can_attempt, max_attempts_per_user, submitted_count, last_attempt_id, block_reason]
                properties:
                  exists:                { type: boolean }
                  can_attempt:           { type: boolean }
                  max_attempts_per_user: { type: integer, description: "0 = sin limite" }
                  submitted_count:       { type: integer }
                  last_attempt_id:       { type: string, description: "vacio si el usuario no tiene attempts previos con esta key" }
                  block_reason:
                    type: string
                    enum: ["", "max_attempts", "aforo_lleno"]
                    description: "Motivo del block. Vacio cuando can_attempt=true."
              examples:
                puede:
                  summary: Existe y puede intentar
                  value: { exists: true, can_attempt: true, max_attempts_per_user: 0, submitted_count: 0, last_attempt_id: "", block_reason: "" }
                cuota_agotada:
                  summary: Existe pero ya rindio el max
                  value: { exists: true, can_attempt: false, max_attempts_per_user: 1, submitted_count: 1, last_attempt_id: "AT-018af2...", block_reason: "max_attempts" }
                aforo_lleno:
                  summary: Existe pero la key esta llena
                  value: { exists: true, can_attempt: false, max_attempts_per_user: 0, submitted_count: 0, last_attempt_id: "", block_reason: "aforo_lleno" }
                no_existe:
                  summary: Email desconocido
                  value: { exists: false, can_attempt: true, max_attempts_per_user: 0, submitted_count: 0, last_attempt_id: "", block_reason: "" }
        '400':
          description: Faltan email o key_code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { status: "error", code: "VALIDATION_ERROR", message: "email y key_code son obligatorios", category: "VALIDATION_ERROR" }
        '404':
          description: La key no existe o esta fuera de vigencia / desactivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { status: "error", code: "KEY_NOT_FOUND", message: "key not found", category: "NOT_FOUND" }
        '429':
          description: |
            Excedio el rate-limit estricto de este endpoint (30 req/min/IP).
            El header `Retry-After: 60` indica cuanto esperar.
          headers:
            Retry-After:
              schema: { type: integer, example: 60 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { status: "error", code: "RATE_LIMIT", message: "too many requests" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revocar refresh token
      description: |
        Marca el refresh token como revocado. **Idempotente**: si ya estaba
        revocado o no existe, devuelve 200 igual (no filtra info a un atacante).

        El access token sigue siendo criptográficamente válido hasta su `exp`
        natural (12 h). El cliente debe descartarlo.

        **Requiere `Authorization: Bearer <access_token>`** del mismo usuario
        dueño del refresh token. Esto impide que un atacante con sólo un
        refresh token robado pueda invalidarlo (DoS sobre la sesión víctima).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
            example:
              refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3YzExNGY2MS04..."
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: Body inválido o `refresh_token` ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "BAD_BODY"
                message: "EOF"
                category: "VALIDATION_ERROR"
        '401':
          description: Falta access token o está expirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ──────────────────────────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────────────────────────
  /api/users:
    post:
      tags: [Users]
      summary: Crear usuario
      description: |
        Hashea la password con bcrypt y persiste el user en `db_users.users`.
        Falla con `409 EMAIL_TAKEN` o `409 DOCUMENT_TAKEN` si ya existe otro
        user con el mismo email o DNI.

        **Campos opcionales destacados**:
        - `phone`: se persiste local y se sincroniza a HubSpot junto con el
          resto del contacto.
        - `school_id`: UUID del colegio (usar `GET /api/schools` para llenar
          el dropdown).
        - `permission_group_id`: si `>0`, asigna el grupo en la misma llamada
          (evita un round-trip extra a `POST /api/users/{id}/permissions/groups`).
          Útil para crear coordinadores/asesores/estudiantes con su grupo
          predefinido (`student_permissions`, `asesor_permissions`,
          `coordinador_permissions`).

        **Sync HubSpot automático**: tras crear el user con éxito el
        servicio dispara en background un `UpsertContact` al CRM HubSpot
        con el email, DNI, nombre, apellido y phone. Es fire-and-forget —
        si HubSpot está caído el user queda creado de todos modos y se
        puede forzar el sync después con `POST /api/hubspot/contacts`.

        Permisos requeridos: `db_users.users.write`. Si se usa
        `permission_group_id`, también `db_users.user_permission_group.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            examples:
              admin_user:
                summary: Crear un asesor sin grupo (legacy flow)
                value:
                  email: "asesor.nuevo@ucsp.edu.pe"
                  password: "TempPass!123"
                  first_name: "María"
                  last_name: "Quispe"
                  document_number: "71234567"
                  phone: "+51 999 111 222"
                  school_id: ""
              coordinador_con_grupo:
                summary: Crear un coordinador y asignarle su grupo en 1 llamada
                value:
                  email: "coord.smartin@ucsp.edu.pe"
                  password: "TempPass!123"
                  first_name: "Carlos"
                  last_name: "Mendoza"
                  document_number: "70112233"
                  phone: "+51 999 555 666"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  permission_group_id: 3
      responses:
        '200':
          description: Usuario creado. Si se pasó `permission_group_id`, el grupo ya quedó asignado al user retornado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: "a117827b-67c0-4ddd-addf-4e3cb5c74618"
                  email: "coord.smartin@ucsp.edu.pe"
                  first_name: "Carlos"
                  last_name: "Mendoza"
                  document_number: "70112233"
                  phone: "+51 999 555 666"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  active: true
                  last_access_at: null
                  created_at: "2026-05-12T10:30:00Z"
                  updated_at: null
                  is_superadmin: false
                  must_change_password: false
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email o DNI ya existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EMAIL_TAKEN"
                message: "email already registered"
                errors:
                  - code: "EMAIL_TAKEN"
                    message: "email already registered"
                    context: { propertyName: ["email"] }
                category: "CONFLICT"

  /api/users/bulk:
    post:
      tags: [Users]
      summary: Carga masiva de usuarios (CSV o JSON)
      description: |
        Crea N usuarios en una sola llamada — pensado para que el admin
        suba el listado de un colegio entero. Acepta dos formatos según el
        header `Content-Type`:

        - `application/json`: body con un array `items` de hasta 1000 entradas.
          Cada item tiene los mismos campos que `POST /api/users` (incluye
          `phone` y `school_id` opcionales). Si se manda `permission_group_id`
          a nivel raíz, se asigna a TODOS los users creados (típicamente `1`
          para `student_permissions`).

        - `text/csv`: primera fila de header con columnas `email,password,
          first_name,last_name,document_number,phone,school_id`. El orden
          no importa siempre que las columnas estén nombradas; `email` y
          `password` son obligatorias, el resto opcional. Si querés
          asignar grupo a todos, mandalo como query string:
          `?permission_group_id=1`.

        La operación NO es transaccional: si la fila 5 falla, las primeras
        4 quedan creadas y las siguientes se intentan igual. La respuesta
        trae `created` (filas exitosas con su `id`) y `errors` (filas
        fallidas con `code`/`message`) para que el frontend muestre el
        detalle al admin. El sync a HubSpot se dispara automáticamente
        para cada user creado (mismo flujo que `POST /api/users`).

        Permiso requerido: `db_users.users.write`. Si se usa
        `permission_group_id`, también se requiere `db_users.user_permission_group.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                permission_group_id:
                  type: integer
                  description: Si se provee, se asigna a TODOS los users creados.
                  example: 1
                items:
                  type: array
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/CreateUserRequest' }
            example:
              permission_group_id: 1
              items:
                - { email: "alumno1@col.pe", password: "Temp1234!", first_name: "Ana",  last_name: "Quispe", document_number: "70000001", phone: "+51 900 100 001", school_id: "" }
                - { email: "alumno2@col.pe", password: "Temp1234!", first_name: "Luis", last_name: "Ramos",  document_number: "70000002", phone: "+51 900 100 002", school_id: "" }
                - { email: "alumno3@col.pe", password: "Temp1234!", first_name: "Sofía",last_name: "Ríos",   document_number: "70000003", phone: "+51 900 100 003", school_id: "" }
          text/csv:
            schema:
              type: string
              format: binary
              description: |
                CSV con header en primera fila. Columnas obligatorias:
                `email`, `password`. Opcionales: `first_name`, `last_name`,
                `document_number`, `phone`, `school_id`.
            example: |
              email,password,first_name,last_name,document_number,phone,school_id
              alumno1@col.pe,Temp1234!,Ana,Quispe,70000001,+51 900 100 001,
              alumno2@col.pe,Temp1234!,Luis,Ramos,70000002,+51 900 100 002,
              alumno3@col.pe,Temp1234!,Sofía,Ríos,70000003,+51 900 100 003,
      responses:
        '200':
          description: |
            Resumen del procesamiento. Notar que un `200` no garantiza que
            todas las filas se hayan creado — revisar `summary.failed` y `errors`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        id:    { type: string, format: uuid }
                        email: { type: string }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        index:   { type: integer }
                        email:   { type: string }
                        code:    { type: string, example: "EMAIL_TAKEN" }
                        message: { type: string }
                  summary:
                    type: object
                    properties:
                      total:   { type: integer }
                      created: { type: integer }
                      failed:  { type: integer }
              example:
                summary: { total: 3, created: 2, failed: 1 }
                created:
                  - { index: 0, id: "78ab...", email: "alumno1@col.pe" }
                  - { index: 2, id: "9fcd...", email: "alumno3@col.pe" }
                errors:
                  - { index: 1, email: "alumno2@col.pe", code: "DOCUMENT_TAKEN", message: "document number already registered" }
        '400':
          description: |
            Body inválido. Códigos posibles: `EMPTY_BULK` (items array vacío),
            `BULK_TOO_LARGE` (más de 1000 items), `BAD_BODY` (JSON malformado
            o CSV con header inválido).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EMPTY_BULK"
                message: "items must contain at least one entry"
                category: "VALIDATION_ERROR"

  /api/users/bulk/template.csv:
    get:
      tags: [Users]
      summary: Descargar plantilla CSV vacía (solo header)
      description: |
        Devuelve un archivo CSV con únicamente la primera fila (las
        columnas que acepta `POST /api/users/bulk`). El admin lo abre en
        Excel, llena las filas y lo vuelve a subir vía el bulk endpoint.

        Headers de la respuesta:
        - `Content-Type: text/csv; charset=utf-8`
        - `Content-Disposition: attachment; filename="users-bulk-template.csv"`

        Permiso requerido: `db_users.users.write`.
      responses:
        '200':
          description: Plantilla CSV (solo el header).
          content:
            text/csv:
              schema: { type: string, format: binary }
              example: |
                email,password,first_name,last_name,document_number,phone,school_id

  /api/users/bulk/sample.csv:
    get:
      tags: [Users]
      summary: Descargar CSV de ejemplo con datos ficticios
      description: |
        Devuelve un CSV con el mismo header que la plantilla más 5 filas
        de datos ficticios (emails `@example.com`). Pensado para que el
        admin vea cómo se ve un archivo real listo para subir. **Reemplazar
        las filas antes de hacer POST**, los emails de ejemplo no chocan
        con datos reales pero tampoco son usuarios válidos.

        Permiso requerido: `db_users.users.write`.
      responses:
        '200':
          description: CSV con 5 filas de ejemplo.
          content:
            text/csv:
              schema: { type: string, format: binary }
              example: |
                email,password,first_name,last_name,document_number,phone,school_id
                ana.quispe@example.com,Temp1234!,Ana,Quispe,70000001,+51 900 100 001,
                luis.ramos@example.com,Temp1234!,Luis,Ramos,70000002,+51 900 100 002,
                sofia.rios@example.com,Temp1234!,Sofia,Rios,70000003,+51 900 100 003,
                diego.cardenas@example.com,Temp1234!,Diego,Cardenas,70000004,+51 900 100 004,
                camila.flores@example.com,Temp1234!,Camila,Flores,70000005,+51 900 100 005,

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      description: |
        Devuelve el detalle completo de un user (sin password_hash). Cache-first
        (Redis con TTL 5 min). Útil para pantallas de detalle, autocompletado y
        verificación previa a operaciones admin.

        Permiso requerido: `db_users.users.read`.
      responses:
        '200':
          description: User encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  email: "asesor@ucsp.edu.pe"
                  first_name: "María"
                  last_name: "Quispe"
                  document_number: "71234567"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  active: true
                  last_access_at: "2026-05-08T19:42:11Z"
                  created_at: "2026-03-12T09:14:22Z"
                  updated_at: "2026-04-29T15:02:11Z"
                  is_superadmin: false
                  must_change_password: false
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Actualizar usuario (parcial)
      description: |
        Actualiza solo los campos provistos no vacíos. Para **no tocar** un
        campo, no lo mandes en el body (o mandalo como `""` — el server
        trata string vacío como "no tocar").

        El campo `phone` se sincroniza a HubSpot junto con el resto en el
        próximo `UpsertContact` (disparado automáticamente).

        Esta ruta NO sirve para cambiar `email`, `password`, `is_superadmin`
        ni `active`. Para esos:
        - email: no se puede cambiar (es identificador estable).
        - password: `POST /api/users/me/change-password` (el dueño) o
          `POST /api/users/{id}/reset-password` (admin).
        - active: `POST /api/users/{id}/deactivate` / `/reactivate`.
        - is_superadmin: solo otro superadmin via canal interno (no expuesto).

        Permiso requerido: `db_users.users.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:      { type: string }
                last_name:       { type: string }
                document_number: { type: string }
                phone:           { type: string, description: "'' = no tocar" }
                school_id:       { type: string, description: "UUID o '' (vacío = no tocar)" }
            example:
              first_name: "María Elena"
              last_name: "Quispe Ramos"
              phone: "+51 999 888 777"
      responses:
        '200':
          description: User actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: "a117827b-67c0-4ddd-addf-4e3cb5c74618"
                  email: "coord.smartin@ucsp.edu.pe"
                  first_name: "María Elena"
                  last_name: "Quispe Ramos"
                  document_number: "70112233"
                  phone: "+51 999 888 777"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  active: true
                  last_access_at: "2026-05-12T11:05:00Z"
                  created_at: "2026-05-12T10:30:00Z"
                  updated_at: "2026-05-12T11:14:00Z"
                  is_superadmin: false
                  must_change_password: false
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Users]
      summary: Desactivar usuario (soft delete)
      description: |
        Pone `active = false`. **No borra** ni asignaciones ni histórico —
        Mi Propósito preserva todos los datos por requisito de UCSP. El user
        no podrá volver a loguear hasta que un admin llame
        `POST /api/users/{id}/reactivate`.

        Idempotente: si el user ya estaba desactivado, devuelve 200 igual.

        Permiso requerido: `db_users.users.write`.
      responses:
        '200':
          description: User desactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Users]
      summary: Reactivar usuario previamente desactivado
      description: |
        Revierte un `DeactivateUser` anterior — pone `active = true` y
        devuelve el user actualizado.

        **Idempotente**: si el user ya estaba activo, devuelve `200` con
        el user igual (sin error).

        Por seguridad, esta operación **NO resetea la password** del usuario.
        Si la perdió o nunca la supo (ej. cuenta creada por bootstrap), hace
        falta llamar `POST /api/users/{id}/reset-password` aparte.

        Permiso: `db_users.users.write`.
      responses:
        '200':
          description: User reactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: "7c11..."
                  email: "asesor@ucsp.edu.pe"
                  first_name: "María"
                  last_name: "Quispe"
                  document_number: "71234567"
                  active: true
                  is_superadmin: false
                  must_change_password: false
        '400':
          description: ID vacío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "MISSING_ID"
                message: "id is required"
                category: "VALIDATION_ERROR"
        '404':
          description: Usuario no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "USER_NOT_FOUND"
                message: "user not found"
                category: "NOT_FOUND"

  /api/users/me:
    get:
      tags: [Users]
      summary: User logueado + permisos efectivos
      description: |
        Devuelve el user que corresponde al `sub` del access token + sus
        permisos efectivos (lista de codes en formato `<service>.<table>.<action>`).

        Para superadmins, `permissions` viene como `["*"]` (sentinel — el
        front interpreta como "todo permitido" sin enumerar).

        Esta ruta NO está bloqueada por `must_change_password=true`. El
        front la usa después del login para detectar si necesita
        redireccionar a la pantalla de cambio de password.
      responses:
        '200':
          description: User + permisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:        { $ref: '#/components/schemas/User' }
                  permissions: { type: array, items: { type: string } }
              examples:
                superadmin:
                  summary: Superadmin (post-bootstrap, debe cambiar password)
                  value:
                    user:
                      id: "9b24..."
                      email: "admin@ucsp.edu.pe"
                      first_name: ""
                      last_name: ""
                      active: true
                      is_superadmin: true
                      must_change_password: true
                    permissions: ["*"]
                asesor:
                  summary: Asesor con grupo asesor_permissions
                  value:
                    user:
                      id: "7c11..."
                      email: "asesor@ucsp.edu.pe"
                      first_name: "María"
                      last_name: "Quispe"
                      active: true
                      is_superadmin: false
                      must_change_password: false
                    permissions:
                      - "db_users.users.read"
                      - "db_users.school.read"
                      - "db_users.school.write"
                      - "db_keys.key.read"
                      - "db_keys.key.write"
                      - "analytics.dashboard.read"

  /api/users/me/change-password:
    post:
      tags: [Users]
      summary: Cambiar la propia password
      description: |
        Verifica `old_password` contra el hash actual y aplica `new_password`
        si pasa los requisitos de fortaleza (mínimo 8 chars). Limpia el flag
        `must_change_password` automáticamente.

        **Esta ruta es la ÚNICA junto con `/api/users/me` que sigue
        funcionando si `must_change_password=true`.** Cualquier otra ruta
        responde `403 PASSWORD_CHANGE_REQUIRED` hasta que el user complete
        este flujo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
            example:
              old_password: "TempBootstrap-K8s-XYZ1"
              new_password: "M1Pr0p0s1t0Adm1n!"
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400':
          description: Password nueva no cumple requisitos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "WEAK_PASSWORD"
                message: "password must have at least 8 characters"
                category: "VALIDATION_ERROR"
        '401':
          description: old_password no coincide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "INVALID_CREDENTIALS"
                message: "email or password is incorrect"
                category: "UNAUTHENTICATED"

  /api/users/{id}/reset-password:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    post:
      tags: [Users]
      summary: (Superadmin) Resetear password de cualquier user
      description: |
        Genera una password aleatoria server-side de 16 chars URL-safe,
        persiste su hash con `must_change_password=1` y devuelve la temporal
        en CLARO en la respuesta. **Viaja UNA SOLA VEZ** — el admin debe
        entregársela al user; el server no la guarda en claro ni en logs.

        El user, en su próximo login, será forzado a cambiarla via
        `/api/users/me/change-password`.

        **Restringido a superadmins** (`role: "superadmin"` en el JWT).
        Cualquier otro caller recibe `403 SUPERADMIN_REQUIRED`.
      responses:
        '200':
          description: Password temporal (una sola vez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp_password:
                    type: string
                    description: Password temporal en claro. Entregar al user inmediatamente.
              example:
                temp_password: "Wf5aQ_pZxKL7_Mn3"
        '403':
          description: El caller no es superadmin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "SUPERADMIN_REQUIRED"
                message: "this action is restricted to superadmins"
                category: "PERMISSION_DENIED"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/by-email:
    get:
      tags: [Users]
      summary: Obtener un usuario por email
      description: |
        Lookup directo por email (case-insensitive). Útil para flujos OTP de
        estudiante, autocompletado en formularios admin y validación previa a
        crear un user. Devuelve la misma forma que `GET /api/users/{id}`.

        Permiso requerido: `db_users.users.read`.
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
          example: "alumno@gmail.com"
      responses:
        '200':
          description: User encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user:
                  id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  email: "alumno@gmail.com"
                  first_name: "Juan"
                  last_name: "Pérez"
                  document_number: "70123456"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  active: true
                  last_access_at: "2026-05-07T18:22:00Z"
                  created_at: "2026-02-10T12:00:00Z"
                  updated_at: null
                  is_superadmin: false
                  must_change_password: false
        '400':
          description: Falta el query param `email`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "VALIDATION_ERROR"
                message: "email query param is required"
                category: "VALIDATION_ERROR"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/search:
    post:
      tags: [Users]
      summary: Búsqueda HubSpot-style sobre users
      description: |
        Patrón `filterGroups` (AND dentro, OR entre grupos), `properties`,
        `sorts`, paginación. Permiso `db_users.users.read`.

        **Propiedades whitelist**: `id`, `email`, `first_name`,
        `last_name`, `document_number`, `phone`, `school_id`, `active`,
        `last_access_at`, `created_at`, `updated_at`. `password_hash` no
        aparece — no es seleccionable ni filtrable.

        `id` es **filtrable pero NO seleccionable**: el UUID siempre
        viaja en el sobre como `__id`, no como columna del payload.
        Sirve para hidrataciones por lote tipo `id IN (uuid1, uuid2,
        ...)` desde otros servicios (p. ej. `exams_service` devuelve
        attempts con `user_id` y el front pide los nombres en una sola
        request).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            examples:
              activos_de_un_colegio:
                summary: Usuarios activos de un colegio
                value:
                  filter_groups:
                    - filters:
                        - { property_name: "school_id", operator: "EQ", values: ["3a8f..."] }
                        - { property_name: "active",    operator: "EQ", values: ["true"] }
                  properties: ["email","first_name","last_name","document_number"]
                  sorts: [ { property_name: "last_name", direction: "ASC" } ]
                  limit: 50
              busqueda_por_dni:
                summary: Buscar por DNI prefix
                value:
                  filter_groups:
                    - filters:
                        - { property_name: "document_number", operator: "STARTS_WITH", values: ["7012"] }
                  limit: 10
              hidrataci_n_por_lote_de_ids:
                summary: Hidratar usuarios por lote de IDs (caso típico - resolver nombres desde lista de user_id devuelta por otro servicio)
                value:
                  filter_groups:
                    - filters:
                        - { property_name: "id", operator: "IN", values: ["7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e", "8d224a72-9b2e-5f3b-ac4d-2e3b4c5d6e7f"] }
                  properties: ["email","first_name","last_name","document_number","phone"]
                  limit: 50
      responses:
        '200':
          description: Resultados paginados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }

  /api/users/{id}/permissions/groups:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [Users]
      summary: Asignar un permission_group al user
      description: |
        Asocia el user al grupo indicado (rol). El cliente puede asignar
        múltiples grupos al mismo user — los permisos efectivos son la unión
        de los permisos de todos sus grupos.

        Idempotente: si la asignación ya existe no falla y devuelve 200. Si el
        `permission_group_id` no existe en el catálogo devuelve 404.

        Permiso requerido: `db_users.permission.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_group_id]
              properties:
                permission_group_id:
                  type: integer
                  format: int32
                  description: ID del catálogo `permission_group` (no UUID, INT identity)
            example: { permission_group_id: 1 }
      responses:
        '200':
          description: Grupo asignado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: Body inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "BAD_BODY"
                message: "EOF"
                category: "VALIDATION_ERROR"
        '404':
          description: User o permission_group no existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_NOT_FOUND"
                message: "permission group not found"
                category: "NOT_FOUND"

  /api/users/{id}/permissions/groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - in: path
        name: group_id
        required: true
        schema: { type: integer, format: int32 }
        description: ID INT del permission_group a desasociar
    delete:
      tags: [Users]
      summary: Revocar permission_group
      description: |
        Quita la asociación user ↔ permission_group. **Idempotente**: si la
        asociación no existía, devuelve 200 igual. No borra el grupo ni el
        user — solo el join.

        Permiso requerido: `db_users.permission.write`.
      responses:
        '200':
          description: Asociación revocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: "`group_id` no es un entero positivo"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "VALIDATION_ERROR"
                message: "group_id must be a positive integer"
                category: "VALIDATION_ERROR"

  /api/users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Users]
      summary: Listar permission codes efectivos del user
      description: |
        Devuelve los codes (`db_users.users.read`, etc.) calculados via
        `user → user_permission_group → permission_group → permission`.
      responses:
        '200':
          description: Lista de codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes: { type: array, items: { type: string } }
              example:
                codes: ["db_users.users.read","db_users.users.write","db_users.school.read"]

  /api/users/{id}/permissions/check:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Users]
      summary: ¿El user tiene este permiso?
      description: |
        Útil para que el front muestre/oculte botones según el permiso real
        del user en cuestión (no del caller). Para superadmins siempre
        devuelve `allowed=true` sin importar el `code` consultado.

        Permiso requerido: `db_users.permission.read`.
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
          example: "db_users.users.write"
      responses:
        '200':
          description: Sí/No
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
              example:
                allowed: true
        '400':
          description: Falta el query param `code`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "VALIDATION_ERROR"
                message: "code query param is required"
                category: "VALIDATION_ERROR"

  # ──────────────────────────────────────────────────────────────────
  # PERMISSIONS — CRUD de permission groups + catálogo de permisos
  # ──────────────────────────────────────────────────────────────────
  /api/permission-groups:
    post:
      tags: [Permissions]
      summary: Crear grupo de permisos (rol)
      description: |
        Crea un `permission_group` (rol). El `code` es la clave estable y debe
        ser **único** en todo el sistema (ej: `marketing_permissions`).

        El campo `permission_ids` es opcional al crear: si se pasan, los
        permisos quedan asociados al grupo en el momento de la creación. Si se
        omite o llega vacío, el grupo se crea sin permisos y luego se agregan
        de a uno con `POST /api/permission-groups/{id}/permissions/{permission_id}`.

        Permiso requerido: `db_users.permission_group.write`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePermissionGroupRequest' }
            example:
              code: "marketing_permissions"
              name: "Equipo de Marketing UCSP"
              description: "Lectura de leads y dashboards de campaign performance"
              permission_ids: [12, 18, 25]
      responses:
        '200':
          description: Grupo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: '#/components/schemas/PermissionGroup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Sin permiso `db_users.permission_group.write`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: El `code` ya está tomado por otro grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_CODE_TAKEN"
                message: "permission group code already exists"
                category: "CONFLICT"
    get:
      tags: [Permissions]
      summary: Listar todos los grupos
      description: |
        Devuelve todos los `permission_group` con sus permisos hidratados
        (cada item trae el array `permissions[]` ya resuelto).

        Permiso requerido: `db_users.permission_group.read`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de grupos con permisos hidratados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionGroup' }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Sin permiso `db_users.permission_group.read`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/permission-groups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int32 }
        description: ID del permission_group (INT identity, no UUID)
    get:
      tags: [Permissions]
      summary: Detalle de un grupo (incluye sus permisos)
      description: |
        Devuelve el grupo con su array `permissions[]` hidratado.

        Permiso requerido: `db_users.permission_group.read`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grupo encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: '#/components/schemas/PermissionGroup' }
        '404':
          description: El grupo no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_NOT_FOUND"
                message: "permission group not found"
                category: "NOT_FOUND"
    patch:
      tags: [Permissions]
      summary: Editar nombre o descripción del grupo
      description: |
        Permite editar el `name` y/o el `description` del grupo. El `code`
        **no se puede editar** porque es la clave estable que referencian
        otros sistemas y eventualmente el frontend.

        Si se quiere cambiar el code, el flujo correcto es: crear un grupo
        nuevo con el code deseado, reasignar los users y borrar el viejo.

        Permiso requerido: `db_users.permission_group.write`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePermissionGroupRequest' }
            example:
              name: "Equipo de Marketing UCSP — 2026"
              description: "Lectura de leads, dashboards y export Excel"
      responses:
        '200':
          description: Grupo actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { $ref: '#/components/schemas/PermissionGroup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: El grupo no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_NOT_FOUND"
                message: "permission group not found"
                category: "NOT_FOUND"
    delete:
      tags: [Permissions]
      summary: Eliminar grupo
      description: |
        Borra el `permission_group`. **Falla con 409 `PERMISSION_GROUP_HAS_USERS`
        si el grupo tiene users asignados** — primero hay que reasignar a
        esos usuarios a otro grupo (via `POST /api/users/{id}/permissions/groups`)
        y recién entonces se puede borrar este.

        Permiso requerido: `db_users.permission_group.write`.
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404':
          description: El grupo no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_NOT_FOUND"
                message: "permission group not found"
                category: "NOT_FOUND"
        '409':
          description: El grupo tiene users asignados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_GROUP_HAS_USERS"
                message: "permission group still has users assigned"
                category: "CONFLICT"

  /api/students:
    get:
      tags: [Users]
      summary: Listar/buscar estudiantes
      description: |
        Atajo semántico para listar todos los users que pertenecen al grupo
        `student_permissions`. Equivale a `GET /api/permission-groups/1/users`
        pero con un path más obvio para el frontend.

        Soporta `search` (matchea email, first_name, last_name y
        document_number con `LIKE %s%`), paginación (`limit`/`offset`) y
        filtro `active_only`.

        Permiso requerido: `db_users.users.read`.
      parameters:
        - in: query
          name: search
          schema: { type: string }
          example: "alvarado"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Listado paginado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
              example:
                items:
                  - { id: "ce5d01bd-2620-431a-920c-885bfc023dbe", email: "estudiante.alvarado@ucsp.edu.pe", first_name: "Pedro", last_name: "Alvarado", document_number: "70100001", phone: "", school_id: "", active: true, last_access_at: null, created_at: "2026-05-04T22:30:09Z", updated_at: null, is_superadmin: false, must_change_password: false }
                total: 28

  /api/asesores:
    get:
      tags: [Users]
      summary: Listar/buscar asesores
      description: |
        Atajo semántico. Equivale a `GET /api/permission-groups/3/users`.
        Mismos query params que `GET /api/students`.

        Permiso requerido: `db_users.users.read`.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Listado paginado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }

  /api/asesores/students:
    post:
      tags: [Users]
      summary: Asesor crea estudiante en uno de sus colegios
      description: |
        Crea un usuario con `permission_group_id=1` (estudiante) dentro de
        uno de los colegios asignados al asesor que hace la request.
        Pensado para que el asesor de un colegio pueda dar de alta
        estudiantes manualmente, sin esperar al flujo público de
        auto-registro con key.

        **Autorización:**
        - JWT obligatorio.
        - Si el caller NO es `superadmin`, el `school_id` debe estar entre
          los colegios asignados al asesor (assignment SCD-2 vigente). Si
          no, responde `403 FORBIDDEN_SCHOOL`.
        - Superadmin puede crear estudiantes en cualquier colegio.

        **Password:** la cuenta se crea con una password aleatoria de 48
        chars hex que se descarta. El estudiante hace login solo vía OTP
        (`/api/auth/student/request-otp` + `/api/auth/student/verify-otp`),
        nunca con password. Idéntico al comportamiento del flujo
        `register-with-key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, email, first_name, last_name]
              properties:
                school_id:
                  type: string
                  format: uuid
                  description: "Colegio donde se da de alta. Debe pertenecer al asesor (o ser superadmin)."
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                last_name:
                  type: string
                document_number:
                  type: string
                  description: "DNI / documento; opcional."
                phone:
                  type: string
                  description: "Opcional."
            example:
              school_id: "8f9c5a40-1f12-46d3-9ad6-0b3d6e7a9e51"
              email: "estudiante.nuevo@ucsp.edu.pe"
              first_name: "Lucia"
              last_name: "Quispe"
              document_number: "72100012"
              phone: "+51987654321"
      responses:
        '201':
          description: Estudiante creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Body invalido (faltan campos obligatorios).
        '401':
          description: Sin JWT.
        '403':
          description: |
            `FORBIDDEN_SCHOOL` — el `school_id` no es uno de los colegios
            asignados al asesor que hace la request.
        '409':
          description: Email ya existe.

  /api/coordinadores:
    get:
      tags: [Users]
      summary: Listar/buscar coordinadores
      description: |
        Atajo semántico. Equivale a `GET /api/permission-groups/4/users`.
        Mismos query params que `GET /api/students`.

        Permiso requerido: `db_users.users.read`.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Listado paginado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }

  /api/permission-groups/{id}/users:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int32 }
        description: "ID numérico del grupo (1=student_permissions, 2=asesor_permissions, 3=coordinador_permissions, 4=admin_permissions, etc.)."
    get:
      tags: [Permissions]
      summary: Listar users que pertenecen a un grupo
      description: |
        Devuelve la lista paginada de users asignados al grupo, ideal para
        que el admin vea "todos los asesores", "todos los coordinadores",
        etc. Soporta búsqueda libre (`search` matchea con LIKE `%s%` sobre
        `email`, `first_name`, `last_name` y `document_number`) y filtro
        `active_only=true` para esconder users desactivados.

        El `total` de la respuesta es el total SIN paginar (útil para la UI
        de paginación). Cada item del array `items` es un objeto User con
        el mismo shape de `GET /api/users/{id}`.

        Permiso requerido: `db_users.users.read`.
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: "Substring case-insensitive contra email, first_name, last_name y document_number."
          example: "carlos"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
          description: "Si true, omite users con active=false."
      responses:
        '200':
          description: Listado paginado de users del grupo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer, description: "Total sin paginar." }
              example:
                items:
                  - id: "85d61d55-4452-433b-87c1-e33d48a8664e"
                    email: "carlos.mendoza@ucsp.edu.pe"
                    first_name: "Carlos"
                    last_name: "Mendoza"
                    document_number: "70111001"
                    phone: "+51 999 111 001"
                    school_id: ""
                    active: true
                    last_access_at: "2026-05-11T18:30:00Z"
                    created_at: "2026-05-11T19:15:55Z"
                    updated_at: null
                    is_superadmin: false
                    must_change_password: false
                  - id: "e8dddacf-1cdc-49d7-b7e8-809edceafeb4"
                    email: "lucia.vega@ucsp.edu.pe"
                    first_name: "Lucia"
                    last_name: "Vega"
                    document_number: "70111002"
                    phone: "+51 999 111 002"
                    school_id: ""
                    active: true
                    last_access_at: null
                    created_at: "2026-05-11T19:15:56Z"
                    updated_at: null
                    is_superadmin: false
                    must_change_password: false
                total: 2
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/permission-groups/{id}/permissions/{permission_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int32 }
        description: ID del permission_group
      - in: path
        name: permission_id
        required: true
        schema: { type: integer, format: int32 }
        description: ID del permission individual del catálogo
    post:
      tags: [Permissions]
      summary: Agregar un permiso al grupo
      description: |
        **Idempotente**: si el `permission_id` ya estaba asociado al grupo,
        la llamada devuelve 200 sin modificar nada. Si el `permission_id`
        no existe en el catálogo, devuelve 404 `PERMISSION_NOT_FOUND`.

        Permiso requerido: `db_users.permission_group.write`.
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404':
          description: El grupo o el permission no existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "PERMISSION_NOT_FOUND"
                message: "permission not found in catalog"
                category: "NOT_FOUND"
    delete:
      tags: [Permissions]
      summary: Quitar un permiso del grupo
      description: |
        **Idempotente**: si el `permission_id` no estaba asociado al grupo,
        la llamada devuelve 200 igual.

        Permiso requerido: `db_users.permission_group.write`.
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/Empty' }

  /api/permissions:
    get:
      tags: [Permissions]
      summary: Listar el catálogo completo de permisos individuales disponibles
      description: |
        Devuelve el catálogo entero de permisos individuales que el cliente
        puede combinar en grupos.

        El catálogo lo define **Blue Nose vía migraciones SQL** — cada `code`
        está atado al middleware de validación del backend Go, así que un
        permiso solo es útil si existe el chequeo correspondiente del lado
        servidor. El cliente solo puede leerlo y combinar los códigos en
        grupos vía los endpoints de `permission-groups`.

        **No hay endpoint para crear permisos individuales** — agregar uno
        nuevo requiere una versión nueva del producto (migración + deploy).

        Permiso requerido: `db_users.permission.read`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo completo de permisos individuales
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
              example:
                items:
                  - { id: 12, code: "db_users.users.read", scope: "db_users", name: "Leer users", description: "Listar y ver detalle de users" }
                  - { id: 18, code: "db_users.school.read", scope: "db_users", name: "Leer colegios", description: "Listar y ver detalle de colegios" }
                  - { id: 25, code: "analytics.dashboard.read", scope: "analytics", name: "Leer dashboards", description: "Acceso de lectura a dashboards agregados" }

  # ──────────────────────────────────────────────────────────────────
  # SCHOOLS (parte de users-service)
  # ──────────────────────────────────────────────────────────────────
  /api/schools:
    post:
      tags: [Schools]
      summary: Crear colegio
      description: |
        Inserta un colegio nuevo en `db_users.school`. Requiere `name` y
        `user_id` (el coordinador owner). El `hubspot_record_id` es opcional;
        si no se carga ahora, se setea más tarde tras el sync con HubSpot.

        Tip: el flow normal es crear primero al coordinador con
        `POST /api/users` (sin `school_id`) y después crear el colegio
        pasando el `user_id` del coordinador. Luego, opcionalmente, editar
        el user con `PATCH /api/users/{id}` para setearle el `school_id` del
        colegio recién creado.

        Permiso requerido: `db_users.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, user_id]
              properties:
                name:              { type: string, example: "Colegio San Pablo" }
                user_id:           { type: string, format: uuid, description: "ID del coordinador dueño del colegio." }
                hubspot_record_id: { type: string, description: "Opcional; '' si todavía no se sincronizó al CRM." }
                city:              { type: string, description: "Opcional. Ciudad/distrito." }
                category:
                  type: string
                  enum: ["", "A+", "A", "B", "C", "D"]
                  description: "Opcional. Tag interno UCSP."
            example:
              name: "Colegio San Pablo"
              user_id: "d4326844-7b4a-4daf-b36e-9395dd92bcbc"
              city: "Arequipa"
              category: "A"
      responses:
        '200':
          description: Colegio creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  school: { $ref: '#/components/schemas/School' }
              example:
                school:
                  id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  user_id: "d4326844-7b4a-4daf-b36e-9395dd92bcbc"
                  name: "Colegio San Pablo"
                  active: true
                  hubspot_record_id: ""
                  created_at: "2026-05-13T10:00:00Z"
                  updated_at: null
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Schools]
      summary: Listar colegios (paginado, con búsqueda)
      description: |
        Devuelve el listado de colegios para llenar dropdowns y tablas en el
        admin. Soporta búsqueda por nombre (substring case-insensitive) y
        paginación clásica `limit`/`offset`. El campo `total` de la respuesta
        es el total sin paginar, útil para la UI de paginación.

        **De dónde salen los colegios**: la tabla `db_users.school` se llena
        por dos vías:
        1. Sync manual desde HubSpot via `POST /api/hubspot/schools`
           (el admin empuja el custom object `colegios` del CRM).
        2. Eventos del webhook de HubSpot (creación/edición en el CRM se
           propaga al backend automáticamente).

        Si el listado vuelve vacío significa que todavía no se sincronizó
        ningún colegio desde HubSpot.

        Permiso requerido: `db_users.school.read`.
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: "Filtra por nombre con LIKE %search%."
          example: "San Pablo"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: active_only
          schema: { type: boolean, default: false }
          description: "Si true, omite colegios desactivados."
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/School' }
                  total: { type: integer, description: "Total sin paginar (para UI de paginación)" }
              example:
                items:
                  - { id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c", user_id: "fa11d4e8-22bb-4a8f-9e12-aa3b1c2d3e4f", name: "Colegio San Pablo", active: true, hubspot_record_id: "12345678901", created_at: "2026-04-12T10:30:00Z", updated_at: null }
                  - { id: "5e21b9a3-4c8d-4a1b-bc55-8e9f0a1b2c3d", user_id: "fa11d4e8-22bb-4a8f-9e12-aa3b1c2d3e4f", name: "Colegio Santa María", active: true, hubspot_record_id: "12345678902", created_at: "2026-04-15T09:12:00Z", updated_at: "2026-05-02T08:00:00Z" }
                total: 47

  /api/schools/{id}:
    parameters:
      - $ref: '#/components/parameters/SchoolID'
    get:
      tags: [Schools]
      summary: Obtener un colegio por ID
      description: |
        Devuelve los datos del colegio incluyendo el `hubspot_record_id`
        sincronizado (vacío si todavía no se sincronizó al Custom Object
        de HubSpot).

        Permiso: `db_users.school.read`.
      responses:
        '200':
          description: School encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  school: { $ref: '#/components/schemas/School' }
              example:
                school:
                  id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  user_id: "fa11d4e8-22bb-4a8f-9e12-aa3b1c2d3e4f"
                  name: "Colegio San Pablo"
                  active: true
                  hubspot_record_id: "12345678901"
                  created_at: "2026-03-12T09:14:22Z"
                  updated_at: "2026-04-29T15:02:11Z"
        '400':
          description: ID vacío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "MISSING_ID"
                message: "id is required"
                category: "VALIDATION_ERROR"
        '404':
          description: Colegio no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "SCHOOL_NOT_FOUND"
                message: "school not found"
                category: "NOT_FOUND"
    patch:
      tags: [Schools]
      summary: Actualizar colegio (parcial)
      description: |
        Actualiza solo los campos provistos no vacíos. String vacío en
        cualquier campo significa "no tocar".

        Permiso: `db_users.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:              { type: string }
                user_id:           { type: string, format: uuid, description: "Cambiar el coordinador dueño. '' = no tocar." }
                hubspot_record_id: { type: string }
                city:
                  type: string
                  description: |
                    '' = no tocar; "-" = limpiar (NULL); cualquier otro valor =
                    setear esa ciudad.
                category:
                  type: string
                  enum: ["", "-", "A+", "A", "B", "C", "D"]
                  description: |
                    '' = no tocar; "-" = limpiar (NULL); cualquier valor del
                    enum = setear esa categoría.
            example:
              name: "Colegio San Pablo - sede norte"
              city: "Cayma"
              category: "A+"
      responses:
        '200':
          description: Colegio actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  school: { $ref: '#/components/schemas/School' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────────────────
  # EXAMS
  # ──────────────────────────────────────────────────────────────────
  /api/exams:
    post:
      tags: [Exams]
      summary: Crear un nuevo exam
      description: |
        El exam nace **NO publicado** (`published=false`). Hay que agregarle
        preguntas (ver `/api/exams/{id}/questions`) y luego publicarlo.

        Una vez publicado, el exam queda inmutable: para "editar" preguntas
        hay que `Clone` (genera nueva versión con `parent_exam_id`).

        ### Campo `code`

        - **Opcional**. Si no lo mandás, el servidor autogenera uno único en
          base al `exam_type_code` y al año actual. Ejemplos:
            * `vocacional` → `VOCC-2026-V1`
            * `simulacro`  → `SIME-2026-V1`
            * `habitos`    → `ESTI-2026-V1`
        - Si lo mandás vos, debe ser único. Si ya existe, devuelve
          `409 EXAM_CODE_TAKEN`.
        - Al clonar un exam para versión 2 (ver `POST /api/exams/{id}/clone`),
          el clon hereda el código base del padre con la nueva versión:
          `VOCC-2026-V1` → `VOCC-2026-V2`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExamRequest' }
            examples:
              codigoAutogenerado:
                summary: Sin code (el servidor lo arma)
                value:
                  exam_type_code: "vocacional"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  name: "Vocacional 2026 — Colegio San Pablo"
                  start_at: "2026-06-01T08:00:00Z"
                  end_at: "2026-06-30T23:59:59Z"
                  max_participants: 0
              codigoExplicito:
                summary: Con code propio
                value:
                  exam_type_code: "simulacro"
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  code: "SIME-2026-INGRESO-ABRIL"
                  name: "Simulacro de Admisión — Abril 2026"
                  start_at: "2026-04-01T08:00:00Z"
                  end_at: "2026-04-30T23:59:59Z"
                  max_participants: 200
      responses:
        '200':
          description: Exam creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  exam: { $ref: '#/components/schemas/Exam' }

  /api/exams/{id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      tags: [Exams]
      summary: Obtener un exam por ID
      description: |
        Devuelve el detalle del exam (cabecera, ventana temporal, aforo,
        flags). Para listar las preguntas que lo componen, usar
        `GET /api/exams/{id}/questions`.

        Permiso requerido: `db_exams.exam.read`.
      responses:
        '200':
          description: Exam encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  exam: { $ref: '#/components/schemas/Exam' }
              example:
                exam:
                  id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  parent_exam_id: ""
                  version: 1
                  code: "VOCC-2026-V1"
                  name: "Vocacional 2026 — Colegio San Pablo"
                  start_at: "2026-06-01T08:00:00Z"
                  end_at: "2026-06-30T23:59:59Z"
                  max_participants: 0
                  published: true
                  active: true
                  created_at: "2026-04-15T10:00:00Z"
                  updated_at: "2026-04-20T14:32:11Z"
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Exams]
      summary: Actualizar exam NO publicado
      description: |
        Solo aplicable a exams en draft (`published=false`). Para editar un
        exam publicado, usar `POST /api/exams/{id}/clone`.

        Solo se actualizan los campos no vacíos del body. Permiso requerido:
        `db_exams.exam.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: |
                    Cambiar el código legible. Si llega vacío, el actual no se
                    modifica. Si el nuevo código ya está en uso, devuelve
                    `409 EXAM_CODE_TAKEN`.
                name: { type: string }
                start_at: { type: string, format: date-time }
                end_at:   { type: string, format: date-time }
                max_participants: { type: integer, format: int32 }
            example:
              name: "Vocacional 2026 — Colegio San Pablo (revisado)"
              start_at: "2026-06-05T08:00:00Z"
              end_at: "2026-07-05T23:59:59Z"
              max_participants: 120
      responses:
        '200':
          description: Exam actualizado
          content:
            application/json:
              schema: { type: object, properties: { exam: { $ref: '#/components/schemas/Exam' } } }
              example:
                exam:
                  id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  parent_exam_id: ""
                  version: 1
                  code: "VOCC-2026-V1"
                  name: "Vocacional 2026 — Colegio San Pablo (revisado)"
                  start_at: "2026-06-05T08:00:00Z"
                  end_at: "2026-07-05T23:59:59Z"
                  max_participants: 120
                  published: false
                  active: true
                  created_at: "2026-04-15T10:00:00Z"
                  updated_at: "2026-05-09T09:11:00Z"
        '403':
          description: Exam ya publicado — usar Clone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EXAM_PUBLISHED_LOCKED"
                message: "published exams cannot be edited; clone for a new version instead"
                category: "PERMISSION_DENIED"

  /api/exams/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    post:
      tags: [Exams]
      summary: Publicar el exam
      description: |
        Marca el exam como `published=true` y lo deja inmutable: a partir de
        este momento solo se podrá `Clone` para crear una nueva versión.
        Requiere que el exam tenga al menos UNA pregunta asociada.

        Permiso requerido: `db_exams.exam.write`.
      responses:
        '200':
          description: Exam publicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: El exam no tiene preguntas asociadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EXAM_HAS_NO_QUESTIONS"
                message: "cannot publish an exam without questions"
                category: "VALIDATION_ERROR"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exams/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    post:
      tags: [Exams]
      summary: Desactivar exam (pausar)
      description: |
        Pone `active=false`. Los attempts existentes se preservan; los nuevos
        no podrán iniciar contra este exam. Idempotente.

        En la UI esto corresponde al estado **paused**. Para volver al estado
        anterior, usar `POST /api/exams/{id}/reactivate`.

        Permiso requerido: `db_exams.exam.write`.
      responses:
        '200':
          description: Exam desactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exams/{id}/reactivate:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    post:
      tags: [Exams]
      summary: Reactivar exam (deshacer pausar)
      description: |
        Pone `active=true`. Inverso simétrico de `/deactivate`. No cambia el
        flag `published`: si el exam estaba publicado al pausarse, queda
        publicado al reactivarse; si era draft, queda draft. Idempotente.

        Permiso requerido: `db_exams.exam.write`.
      responses:
        '200':
          description: Exam reactivado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exams/{id}/clone:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    post:
      tags: [Exams]
      summary: Clonar exam para nueva versión
      description: |
        Crea un nuevo exam con `parent_exam_id` = id origen, **en draft**,
        copiando todas sus `exam_question`. Los `exam_attempt` antiguos siguen
        apuntando al exam original → histórico preservado.

        ### Versionado

        La `version` del clon es `max(version)` de toda la familia
        (raíz + descendientes) + 1. O sea: clonar el mismo exam dos veces
        produce v2 y v3, no dos v2.

        ### Código del clon

        El `code` se hereda del padre, reemplazando el sufijo `-V{n}` por el
        nuevo número de versión:
          * Padre `VOCC-2026-V1` → clon `VOCC-2026-V2`
          * Padre `VOCC-2026-V2` → clon `VOCC-2026-V3`

        Permiso requerido: `db_exams.exam.write`.
      responses:
        '200':
          description: Nuevo exam creado
          content:
            application/json:
              schema: { type: object, properties: { exam: { $ref: '#/components/schemas/Exam' } } }
              example:
                exam:
                  id: "9b3f7a12-cd45-4e98-8b31-1a2b3c4d5e6f"
                  exam_type_id: 1
                  school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
                  parent_exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                  version: 2
                  code: "VOCC-2026-V2"
                  name: "Vocacional 2026 — Colegio San Pablo"
                  start_at: "2026-06-01T08:00:00Z"
                  end_at: "2026-06-30T23:59:59Z"
                  max_participants: 0
                  published: false
                  active: true
                  created_at: "2026-05-09T10:11:22Z"
                  updated_at: null
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exams/search:
    post:
      tags: [Exams]
      summary: Búsqueda HubSpot-style de exams
      description: |
        Propiedades whitelist: `exam_type_id`, `school_id`, `parent_exam_id`,
        `version`, `code`, `name`, `start_at`, `end_at`, `max_participants`,
        `published`, `active`, `created_at`, `updated_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              filter_groups:
                - filters:
                    - { property_name: "exam_type_id", operator: "EQ",   values: ["1"] }
                    - { property_name: "published",    operator: "EQ",   values: ["true"] }
                    - { property_name: "end_at",       operator: "GTE",  values: ["2026-05-01T00:00:00Z"] }
              limit: 20
      responses:
        '200':
          description: Resultados
          content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } }

  # ──────────────────────────────────────────────────────────────────
  # QUESTIONS (banco)
  # ──────────────────────────────────────────────────────────────────
  /api/questions:
    post:
      tags: [Questions]
      summary: Crear pregunta en el banco
      description: |
        Crea una pregunta en el banco global de preguntas. La pregunta nace
        **sin opciones** — hay que agregarlas con
        `POST /api/questions/{id}/options` antes de asociarla a un exam.

        El `category` es opcional pero útil para vocacional, donde se agrupan
        preguntas por área.

        Permiso requerido: `db_exams.question.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:     { type: string, description: "Enunciado de la pregunta" }
                category: { type: string, description: "Útil para vocacional (ej: 'matemática','lengua')" }
            example:
              text: "¿Cuánto es 7 × 8?"
              category: "matemática"
      responses:
        '200':
          description: Pregunta creada
          content:
            application/json:
              schema: { type: object, properties: { question: { $ref: '#/components/schemas/Question' } } }
              example:
                question:
                  id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                  text: "¿Cuánto es 7 × 8?"
                  category: "matemática"
                  active: true
                  created_at: "2026-05-09T10:00:00Z"
                  updated_at: null
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/questions/{id}:
    parameters: [{ $ref: '#/components/parameters/QuestionID' }]
    get:
      tags: [Questions]
      summary: Obtener pregunta por ID
      description: |
        Devuelve la pregunta sin sus opciones. Para traer las opciones, usar
        `GET /api/questions/{id}/options`.

        Permiso requerido: `db_exams.question.read`.
      responses:
        '200':
          description: Pregunta encontrada
          content:
            application/json:
              schema: { type: object, properties: { question: { $ref: '#/components/schemas/Question' } } }
              example:
                question:
                  id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                  text: "¿Cuánto es 7 × 8?"
                  category: "matemática"
                  active: true
                  created_at: "2026-05-09T10:00:00Z"
                  updated_at: null
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Questions]
      summary: Actualizar pregunta
      description: |
        Actualiza el enunciado y/o la categoría. Solo se modifican los campos
        no vacíos del body.

        **Atención**: editar una pregunta afecta también a los exams
        publicados que la incluyen, porque el banco es compartido. Si el
        cambio es semántico, conviene crear una pregunta nueva en lugar de
        editar una existente.

        Permiso requerido: `db_exams.question.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:     { type: string }
                category: { type: string }
            example:
              text: "¿Cuánto es 7 × 8? (responder en cifras)"
              category: "matemática"
      responses:
        '200':
          description: Pregunta actualizada
          content:
            application/json:
              schema: { type: object, properties: { question: { $ref: '#/components/schemas/Question' } } }
              example:
                question:
                  id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                  text: "¿Cuánto es 7 × 8? (responder en cifras)"
                  category: "matemática"
                  active: true
                  created_at: "2026-05-09T10:00:00Z"
                  updated_at: "2026-05-09T11:30:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/questions/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/QuestionID' }]
    post:
      tags: [Questions]
      summary: Desactivar pregunta
      description: |
        Pone `active=false`. La pregunta desaparece del banco para nuevas
        asignaciones, pero los exams ya publicados que la usan siguen
        funcionando normal. Idempotente.

        Permiso requerido: `db_exams.question.write`.
      responses:
        '200':
          description: Pregunta desactivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/questions/{id}/options:
    parameters: [{ $ref: '#/components/parameters/QuestionID' }]
    get:
      tags: [Questions]
      summary: Listar opciones de una pregunta (multiple choice)
      description: |
        Devuelve todas las opciones ordenadas por `sort_order`. El front las
        muestra en ese orden al estudiante.

        Permiso requerido: `db_exams.question.read`.
      responses:
        '200':
          description: Opciones ordenadas por sort_order
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionOption' }
              example:
                options:
                  - id: "af2c1d33-1111-4abc-8def-aaaaaaaaaaaa"
                    question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                    text: "54"
                    is_correct: false
                    sort_order: 0
                  - id: "af2c1d33-2222-4abc-8def-bbbbbbbbbbbb"
                    question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                    text: "56"
                    is_correct: true
                    sort_order: 1
                  - id: "af2c1d33-3333-4abc-8def-cccccccccccc"
                    question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                    text: "63"
                    is_correct: false
                    sort_order: 2
    post:
      tags: [Questions]
      summary: Agregar opción a una pregunta
      description: |
        Agrega una opción nueva al final del listado (o en el `sort_order`
        provisto). Una pregunta puede tener varias opciones marcadas como
        correctas (multi-choice), aunque el flujo típico de simulacro UCSP
        usa una sola correcta.

        Permiso requerido: `db_exams.question.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:       { type: string }
                is_correct: { type: boolean }
                sort_order: { type: integer, format: int32 }
            example:
              text: "56"
              is_correct: true
              sort_order: 1
      responses:
        '200':
          description: Opción creada
          content:
            application/json:
              schema: { type: object, properties: { option: { $ref: '#/components/schemas/QuestionOption' } } }
              example:
                option:
                  id: "af2c1d33-2222-4abc-8def-bbbbbbbbbbbb"
                  question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                  text: "56"
                  is_correct: true
                  sort_order: 1
        '404': { $ref: '#/components/responses/NotFound' }

  /api/options/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
        description: UUID de la opción (no de la pregunta)
    patch:
      tags: [Questions]
      summary: Actualizar opción
      description: |
        Edita el texto, el flag `is_correct` y/o el `sort_order` de una
        opción ya existente. Igual que con `PATCH /api/questions/{id}`,
        afecta a exams publicados que usen la pregunta dueña.

        Permiso requerido: `db_exams.question.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:       { type: string }
                is_correct: { type: boolean }
                sort_order: { type: integer, format: int32 }
            example:
              text: "56"
              is_correct: true
              sort_order: 1
      responses:
        '200':
          description: Opción actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Questions]
      summary: Eliminar opción
      description: |
        Borra la opción definitivamente. Si la pregunta dueña ya está siendo
        usada por attempts en curso, esos attempts conservan la answer
        original aunque la opción ya no exista (FK con histórico).

        Permiso requerido: `db_exams.question.write`.
      responses:
        '200':
          description: Opción eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/questions/search:
    post:
      tags: [Questions]
      summary: Búsqueda HubSpot-style de preguntas
      description: |
        Búsqueda paginada del banco de preguntas usando el patrón
        `filterGroups` (AND dentro, OR entre grupos).

        Propiedades whitelist: `text`, `category`, `active`, `created_at`,
        `updated_at`.

        Permiso requerido: `db_exams.question.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              filter_groups:
                - filters:
                    - { property_name: "category", operator: "EQ", values: ["matemática"] }
                    - { property_name: "active",   operator: "EQ", values: ["true"] }
              properties: ["text","category"]
              sorts: [{ property_name: "created_at", direction: "DESC" }]
              limit: 20
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                total: 47
                results:
                  - id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                    created_at: "2026-05-09T10:00:00Z"
                    updated_at: null
                    archived: false
                    properties:
                      text: "¿Cuánto es 7 × 8?"
                      category: "matemática"
                paging:
                  next_after: 20
                  has_more: true

  # ──────────────────────────────────────────────────────────────────
  # EXAM ↔ QUESTION
  # ──────────────────────────────────────────────────────────────────
  /api/exams/{id}/questions:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    get:
      tags: [ExamQuestions]
      summary: Listar preguntas asignadas al exam
      description: |
        Devuelve los pares `(exam_id, question_id, points, sort_order)` que
        forman la estructura del exam, ordenados por `sort_order`. **No trae
        el texto de las preguntas** — el cliente itera y las pide con
        `GET /api/questions/{id}` o usa `searchQuestions` con filtro `id IN`.

        Permiso requerido: `db_exams.exam.read`.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExamQuestion' }
              example:
                items:
                  - exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                    question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                    points: 2
                    sort_order: 0
                  - exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                    question_id: "af2c1d33-5555-4abc-8def-eeeeeeeeeeee"
                    points: 1
                    sort_order: 1
    post:
      tags: [ExamQuestions]
      summary: Asignar pregunta al exam
      description: |
        Asocia una pregunta del banco al exam con un peso (`points`) y
        posición (`sort_order`). Falla con 403 `EXAM_PUBLISHED_LOCKED` si el
        exam ya está publicado.

        Permiso requerido: `db_exams.exam.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id]
              properties:
                question_id: { type: string, format: uuid }
                points:      { type: integer, format: int32, default: 1 }
                sort_order:  { type: integer, format: int32, default: 0 }
            example:
              question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
              points: 2
              sort_order: 1
      responses:
        '200':
          description: Pregunta asignada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '403':
          description: Exam ya publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EXAM_PUBLISHED_LOCKED"
                message: "published exams cannot be edited; clone for a new version instead"
                category: "PERMISSION_DENIED"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/exams/{id}/questions/{question_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - in: path
        name: question_id
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [ExamQuestions]
      summary: Quitar pregunta del exam
      description: |
        Quita el join `(exam_id, question_id)`. La pregunta sigue existiendo
        en el banco. Falla con 403 si el exam está publicado.

        Permiso requerido: `db_exams.exam.write`.
      responses:
        '200':
          description: Pregunta desasignada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '403':
          description: Exam ya publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "EXAM_PUBLISHED_LOCKED"
                message: "published exams cannot be edited; clone for a new version instead"
                category: "PERMISSION_DENIED"

  /api/exams/{id}/questions/reorder:
    parameters: [{ $ref: '#/components/parameters/ExamID' }]
    post:
      tags: [ExamQuestions]
      summary: Reordenar preguntas del exam
      description: |
        Reescribe el `sort_order` de todas las preguntas del exam basado en
        el orden del array `question_ids` (índice = sort_order resultante).
        Operación atómica (transacción). El array debe contener TODAS las
        preguntas asignadas — si falta alguna, falla.

        Falla con 403 si el exam está publicado.

        Permiso requerido: `db_exams.exam.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Orden deseado (índice = sort_order resultante)
            example:
              question_ids:
                - "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
                - "af2c1d33-5555-4abc-8def-eeeeeeeeeeee"
                - "b88a3344-6666-4abc-8def-ffffffffffff"
      responses:
        '200':
          description: Orden actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400':
          description: La lista no contiene exactamente las preguntas del exam
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "INVALID_REORDER"
                message: "reorder list must contain exactly the same question_ids that the exam has, with no duplicates"
                errors:
                  - code: "INVALID_REORDER"
                    message: "reorder list must contain exactly the same question_ids that the exam has, with no duplicates"
                    context: { propertyName: ["question_ids"] }
                category: "VALIDATION_ERROR"
        '403':
          description: Exam ya publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ──────────────────────────────────────────────────────────────────
  # ATTEMPTS
  # ──────────────────────────────────────────────────────────────────
  /api/attempts:
    post:
      tags: [Attempts]
      summary: Iniciar un intento
      description: |
        Crea (o reutiliza idempotentemente) un attempt para el exam dado.

        ### Reglas defensivas v0.15

        - **`user_id` se ignora salvo superadmin**: el back usa el `subject`
          del JWT del caller. Si un caller no-superadmin manda `user_id`
          distinto al suyo → `403 FORBIDDEN`. Esto cierra la
          impersonación del v0.14 (Bug 3).
        - **Cross-type guard**: si la `key_code` apunta a un exam de tipo
          distinto al del `exam_id` (ej: key vocacional + exam simulacro),
          respuesta `422 KEY_EXAM_TYPE_MISMATCH`.
        - **Aforo atómico**: `keys_service.IncrementUsage` se invoca ANTES
          de crear el attempt. Si el aforo está lleno → `422 KEY_NOT_USABLE`
          (la key se rechaza de forma atómica, sin race vs otros alumnos).
        - **Idempotencia**: si el caller ya tenía un attempt sin submit
          para el mismo exam, se devuelve ESE attempt en lugar de crear
          uno nuevo. Un refresh del front no consume un uso adicional
          de la key.
        - **Aforo del exam (`max_participants`)**: solo se evalúa cuando
          NO se manda `key_code` (modo admin). Si hay key, ella manda
          el aforo (es atómica) y el del exam se ignora para evitar
          doble fuente inconsistente. `max_participants = 0` = ilimitado.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exam_id]
              properties:
                exam_id:  { type: string, format: uuid }
                user_id:
                  type: string
                  format: uuid
                  description: |
                    Ignorado para callers no-superadmin (se usa el del JWT).
                    Para superadmin: puede arrancar attempt en nombre de un
                    alumno (caso "admin ayuda en sesión presencial").
                key_code:
                  type: string
                  description: |
                    Opcional. Si vacío y el exam tiene aforo limitado,
                    requiere `db_exams.attempt.write`.
            example:
              exam_id: "928dd23a-17ba-4232-8106-9646edf4e1c7"
              key_code: "VO-XANDNK"
      responses:
        '200':
          description: Attempt creado o reutilizado
          content:
            application/json:
              schema: { type: object, properties: { attempt: { $ref: '#/components/schemas/Attempt' } } }
              example:
                attempt:
                  id: "43d86828-8b1d-45f9-a8ba-d67d1660d405"
                  exam_id: "928dd23a-17ba-4232-8106-9646edf4e1c7"
                  user_id: "cb908c31-e3e6-492a-ace3-e3b11bd3a9a2"
                  key_id: "6ed014bb-65a6-40dc-861a-3f3d1964486e"
                  score: 0
                  max_score: 0
                  started_at: "2026-05-21T22:07:47Z"
                  submitted_at: null
        '403':
          description: |
            Impersonación bloqueada (`FORBIDDEN`), exam no publicado o
            cerrado (`EXAM_CLOSED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                impersonation:
                  summary: Caller no-superadmin manda user_id distinto al JWT
                  value:
                    status: error
                    code: FORBIDDEN
                    message: cannot start attempt on behalf of another user
        '422':
          description: |
            Key inválida para este exam o aforo lleno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                cross_type:
                  summary: Key vocacional usada con exam de simulacro
                  value:
                    status: error
                    code: KEY_EXAM_TYPE_MISMATCH
                    message: key is for a different exam type
                exhausted:
                  summary: Aforo de la key agotado
                  value:
                    status: error
                    code: KEY_NOT_USABLE
                    message: key not usable (exhausted, expired or inactive)

  /api/attempts/{id}:
    parameters: [{ $ref: '#/components/parameters/AttemptID' }]
    get:
      tags: [Attempts]
      summary: Obtener attempt por ID
      description: |
        Devuelve la cabecera del attempt: a qué exam y user pertenece, score
        actual (`max_score` se llena al finalizar), y timestamps. **No trae
        las answers** — para reconstruir las respuestas usar el endpoint de
        análisis del attempt (no expuesto al front en esta versión) o
        recalcular del lado del estudiante con sus selecciones cacheadas.

        `submitted_at` es `null` mientras el attempt esté en curso.

        Permiso requerido: `db_exams.attempt.read` o ser el dueño del attempt.
      responses:
        '200':
          description: Attempt encontrado
          content:
            application/json:
              schema: { type: object, properties: { attempt: { $ref: '#/components/schemas/Attempt' } } }
              example:
                attempt:
                  id: "f3b9e07c-1234-4def-9876-abcdef012345"
                  exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                  user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  key_id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                  score: 0
                  max_score: 0
                  started_at: "2026-05-09T14:22:00Z"
                  submitted_at: null
        '404': { $ref: '#/components/responses/NotFound' }

  /api/attempts/{id}/answer:
    parameters: [{ $ref: '#/components/parameters/AttemptID' }]
    post:
      tags: [Attempts]
      summary: Responder una pregunta
      description: |
        Registra/actualiza la respuesta del attempt para `question_id`.
        **Idempotente**: un attempt elige UNA opción por pregunta — si la
        pregunta ya tenía respuesta, se sobreescribe (último write gana).

        El score NO se recalcula acá — se calcula al llamar
        `POST /api/attempts/{id}/finish`.

        Falla con `409 ATTEMPT_ALREADY_SUBMITTED` si el attempt ya fue
        finalizado.

        Permiso requerido: `db_exams.attempt.write` o ser el dueño del attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, option_id]
              properties:
                question_id: { type: string, format: uuid }
                option_id:   { type: string, format: uuid }
            example:
              question_id: "9d3f7c21-44ab-4b8d-8e91-2a3b4c5d6e7f"
              option_id: "af2c1d33-2222-4abc-8def-bbbbbbbbbbbb"
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Attempt ya submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                status: "error"
                code: "ATTEMPT_ALREADY_SUBMITTED"
                message: "attempt already submitted"
                category: "CONFLICT"

  /api/attempts/{id}/finish:
    parameters: [{ $ref: '#/components/parameters/AttemptID' }]
    post:
      tags: [Attempts]
      summary: Finalizar attempt y calcular score
      description: |
        Cierra el attempt: calcula `score` sumando los `points` de las
        respuestas correctas, calcula `max_score` como la suma total de
        puntos posibles y setea `submitted_at`.

        **Idempotente**: si ya estaba finalizado, devuelve el attempt sin
        recalcular. Después de finalizar, se dispara automáticamente el
        sync a HubSpot (propiedades `score_<modulo>`, `ultima_evaluacion`).

        Permiso requerido: `db_exams.attempt.write` o ser el dueño del attempt.
      responses:
        '200':
          description: Attempt finalizado
          content:
            application/json:
              schema: { type: object, properties: { attempt: { $ref: '#/components/schemas/Attempt' } } }
              example:
                attempt:
                  id: "f3b9e07c-1234-4def-9876-abcdef012345"
                  exam_id: "0ef21a5c-7d8b-4a31-90b2-6a1e2d3f4a5b"
                  user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
                  key_id: "1a2b3c4d-5e6f-7890-abcd-ef0123456789"
                  score: 17
                  max_score: 20
                  started_at: "2026-05-09T14:22:00Z"
                  submitted_at: "2026-05-09T15:18:42Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/UserID' }]
    get:
      tags: [Attempts]
      summary: Listar attempts de un usuario
      description: |
        Devuelve todos los attempts del user ordenados por `started_at DESC`.
        Útil para la pantalla "Mis tests rendidos" del estudiante y para que
        un asesor revise el histórico de un alumno.

        Permiso requerido: `db_exams.attempt.read` o ser el propio user.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
