      tags: [Analytics]
      summary: Exportar dashboard de asesor a Excel
      description: |
        Devuelve `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
        binario. El frontend lo descarga directo (`window.location` o
        `Blob`).
      responses:
        '200':
