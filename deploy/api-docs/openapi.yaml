  /api/attempts/by-key/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
        description: UUID de la `key` (no el `code`).
    get:
      tags: [Attempts]
      summary: Listar attempts iniciados con una key
      description: |
        Lista los intentos creados contra una key específica. Lo usa el
        front del asesor (`/app/simulacrum/view` y similares) para
        mostrar quién rindió un examen disparado desde un código de
        acceso concreto.

        Excluye attempts en modo admin (los que se crean sin `key_id`
        porque el admin no necesita validar aforo).

        Ordenado por `started_at DESC`. La ruta vive bajo
        `/api/attempts/by-key/...` y NO `/api/keys/{id}/attempts` para
        evitar conflicto con `/api/keys/by-code/{code}` en el matching
        del ServeMux 1.22+.

        Permiso requerido: `db_exams.attempt.read`.
      responses:
