  /api/analytics/colegio/{id}/export.xlsx:
    parameters: [{ $ref: '#/components/parameters/SchoolID' }]
    get:
      tags: [Analytics]
      summary: Exportar dashboard de colegio a Excel
      responses:
        '200':
          description: Archivo XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/analytics/comparativo/export.xlsx:
    get:
      tags: [Analytics]
      summary: Exportar comparativo a Excel
      parameters:
        - in: query
          name: exam_type_code
          required: true
          schema: { type: string, enum: [vocacional, simulacro, habitos] }
      responses:
        '200':
          description: Archivo XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ──────────────────────────────────────────────────────────────────
  # HUBSPOT (mostly admin)
  # ──────────────────────────────────────────────────────────────────
  /api/hubspot/contacts:
    post:
      tags: [HubSpot]
      summary: Upsert contact en HubSpot por DNI
      description: |
        **Síncrono** — el caller necesita el `record_id` devuelto. Si se
        provee `user_id`, además persistimos el record_id en la columna
        `users.hubspot_record_id` para evitar tener que buscar el contacto
        por DNI en sincronizaciones posteriores.

        El campo `extra` permite mandar properties extra de HubSpot que no
        formen parte del contrato base (ej: campos custom del cliente).

        Permiso requerido: `hubspot.contact.write` (típicamente solo admins).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni]
              properties:
                dni:         { type: string }
                email:       { type: string, format: email }
                first_name:  { type: string }
                last_name:   { type: string }
                phone:       { type: string }
                school_name: { type: string }
                grade:       { type: string }
                user_id:     { type: string, format: uuid }
                extra:
                  type: object
                  additionalProperties: { type: string }
                  description: "Propiedades extra (escapan el contrato base)"
            example:
              dni: "70123456"
              email: "estudiante@gmail.com"
              first_name: "Juan"
              last_name: "Pérez"
              phone: "+51987654321"
              school_name: "Colegio San Pablo"
              grade: "5to"
              user_id: "7c11..."
      responses:
        '200':
          description: Record ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  record_id: { type: string, description: "ID del Contact en HubSpot (no UUID)" }
              example:
                record_id: "12345678901"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/contacts/by-dni/{dni}:
    parameters:
      - in: path
        name: dni
        required: true
        schema: { type: string }
        example: "70123456"
    get:
      tags: [HubSpot]
      summary: Buscar contact por DNI
      description: |
        Busca el `record_id` del Contact en HubSpot por DNI. Si el contact
        no existe, devuelve `record_id: ""` (string vacío) y NO 404 — para
        que el caller pueda decidir si crearlo via
        `POST /api/hubspot/contacts`.

        Permiso requerido: `hubspot.contact.read`.
      responses:
        '200':
          description: Record ID (vacío si no existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  record_id: { type: string }
              example:
                record_id: "12345678901"

  /api/hubspot/otp:
    post:
      tags: [HubSpot]
      summary: Disparar webhook OTP
      description: |
        Escribe la propiedad `otp_estudiante` en el contact (si existe) y
        dispara el Automation Webhook de HubSpot que envía el email al
        alumno con el código.

        **No hay flow inverso desde acá** — la verificación del OTP la hace
        el endpoint `POST /api/auth/student/verify-otp` contra el cache
        local. Este endpoint solo sirve para entregar el código al user.

        Permiso requerido: `hubspot.otp.write` (uso interno del backend).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp:   { type: string, description: "6 dígitos, generado server-side" }
            example: { email: "alumno@gmail.com", otp: "489201" }
      responses:
        '200':
          description: Webhook disparado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/results:
    post:
      tags: [HubSpot]
      summary: Sync de resultado de examen al Contact
      description: |
        **Asíncrono** — encolado en BullMQ con backoff exponencial. La cola
        deduplica por `attempt_id` (idempotente). El caller recibe 200 OK
        en cuanto se encola, sin esperar al resultado real del sync.

        Si el sync falla repetidamente, el job aparece en
        `GET /api/hubspot/failed` y se puede reintentar manualmente.

        Permiso requerido: `hubspot.result.write` (típicamente lo dispara el
        propio backend al finalizar un attempt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, exam_type_code, score, max_score, attempt_id, submitted_at]
              properties:
                dni:                { type: string }
                exam_type_code:     { type: string, enum: [vocacional, simulacro, habitos] }
                score:              { type: integer, format: int32 }
                max_score:          { type: integer, format: int32 }
                attempt_id:         { type: string, format: uuid }
                submitted_at:       { type: string, format: date-time }
                contact_record_id:  { type: string, description: "Opcional. Si se provee, evita un search por DNI" }
            example:
              dni: "70123456"
              exam_type_code: "simulacro"
              score: 73
              max_score: 100
              attempt_id: "f3b9e07c-1234-4def-9876-abcdef012345"
              submitted_at: "2026-05-09T15:18:42Z"
              contact_record_id: "12345678901"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/schools:
    post:
      tags: [HubSpot]
      summary: Sync school como Custom Object
      description: |
        Asíncrono — encolado en BullMQ. Idempotente por `school_id`. Crea
        o actualiza el Custom Object "Colegio" en HubSpot.

        Permiso requerido: `hubspot.school.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, email, nombre]
              properties:
                school_id:        { type: string, format: uuid }
                email:            { type: string }
                nombre:           { type: string }
                personal_a_cargo: { type: string }
            example:
              school_id: "3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c"
              email: "contacto@colsanpablo.edu.pe"
              nombre: "Colegio San Pablo"
              personal_a_cargo: "Lic. Carlos Romero"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/asesores:
    post:
      tags: [HubSpot]
      summary: Sync asesor como Custom Object
      description: |
        Asíncrono. Idempotente por `asesor_user_id`. Crea o actualiza el
        Custom Object "Asesor" en HubSpot con los datos del user.

        Permiso requerido: `hubspot.asesor.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asesor_user_id, email, nombre]
              properties:
                asesor_user_id: { type: string, format: uuid }
                email:          { type: string }
                nombre:         { type: string }
                bio:            { type: string }
            example:
              asesor_user_id: "7c114f61-8a1d-4e2a-9b3c-1f2a3b4c5d6e"
              email: "asesor@ucsp.edu.pe"
              nombre: "María Quispe"
              bio: "Asesora académica con 8 años de experiencia"
      responses:
        '200':
          description: Job encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
              example:
                status: "ok"
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/hubspot/failed:
    get:
      tags: [HubSpot]
      summary: Listar jobs fallidos (admin)
      description: |
        Devuelve los jobs que agotaron sus reintentos automáticos en BullMQ
        y quedaron en dead-letter. Para cada uno se ve la cola, el id, el
        motivo de la falla y el payload original para poder reintentar.

        Para reintentar uno, llamar a `POST /api/hubspot/retry` con `queue`
        y `job_id` del item.

        Permiso requerido: `hubspot.admin`.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, format: int32, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, format: int32, default: 0 }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        queue:         { type: string, example: "hubspot:sync-result" }
                        job_id:        { type: string }
                        failed_reason: { type: string }
                        payload:       { type: string, description: "JSON serializado del payload original" }
                        failed_at:     { type: string, format: date-time }
              example:
                items:
                  - queue: "hubspot:sync-result"
                    job_id: "1738"
                    failed_reason: "HubSpot API 429: rate limit exceeded"
                    payload: "{\"dni\":\"70123456\",\"attempt_id\":\"f3b9e07c-1234-4def-9876-abcdef012345\",\"score\":73}"
                    failed_at: "2026-05-09T14:21:00Z"
                  - queue: "hubspot:sync-school"
                    job_id: "1739"
                    failed_reason: "HubSpot API 400: invalid email format"
                    payload: "{\"school_id\":\"3a8f2b54-1d9c-4ef7-9c22-7e9a8f0a1b2c\",\"email\":\"\"}"
                    failed_at: "2026-05-09T14:25:11Z"

  /api/hubspot/retry:
    post:
      tags: [HubSpot]
      summary: Reintentar un job fallido
      description: |
        Reencola un job que estaba en dead-letter. El `queue` y `job_id`
        salen del listado de `GET /api/hubspot/failed`. Si el job ya no
        existe (fue removido) responde con `ok: false`.

        Permiso requerido: `hubspot.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queue, job_id]
              properties:
                queue:  { type: string }
                job_id: { type: string }
            example:
              queue: "hubspot:sync-result"
              job_id: "1738"
      responses:
        '200':
          description: Resultado del retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
              example:
                ok: true
        '400': { $ref: '#/components/responses/ValidationError' }

# ====================================================================
# Components
# ====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT obtenido via `POST /api/auth/login`.
        Vence a las 12 horas — renovar con `POST /api/auth/refresh`.

  parameters:
    UserID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del user
    SchoolID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del colegio
    ExamID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del exam
    QuestionID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la pregunta
    AttemptID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID del attempt
    KeyID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la key
    SurveyID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID de la encuesta

  responses:
    Empty:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: "ok" }
    NotFound:
      description: Recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "NOT_FOUND"
            message: "resource not found"
            category: "NOT_FOUND"
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "INVALID_EMAIL"
            message: "email format is invalid"
            errors:
              - { code: "INVALID_EMAIL", message: "email format is invalid", context: { propertyName: ["email"] } }
            category: "VALIDATION_ERROR"
    RateLimit:
      description: Demasiadas requests
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos a esperar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: "error"
            code: "RATE_LIMIT"
            message: "too many requests"

  schemas:
    # ----- Error envelope -----
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:         { type: string, enum: [error] }
        code:           { type: string, description: "Código simbólico (ej: EMAIL_TAKEN)" }
        message:        { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        category:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL_ERROR, RATE_LIMIT]
        correlation_id: { type: string, description: "Reflejado también en el header X-Correlation-Id" }

    ErrorDetail:
      type: object
      properties:
        code:    { type: string }
        message: { type: string }
        context:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Contexto del error. Convención: `propertyName: ["email"]` para
            indicar qué campo causó el problema.

    # ----- Auth -----
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    LoginResponse:
      type: object
      properties:
        user:         { $ref: '#/components/schemas/User' }
        permissions:  { type: array, items: { type: string }, description: "Codes de permisos efectivos" }
        access_token: { type: string }
        refresh_token: { type: string }

    # ----- Common search -----
    SearchRequest:
      type: object
      properties:
        filter_groups:
          type: array
          items:
            type: object
            properties:
              filters:
                type: array
                items:
                  type: object
                  required: [property_name, operator]
                  properties:
                    property_name: { type: string }
                    operator:
                      type: string
                      enum: [EQ, NEQ, LT, LTE, GT, GTE, IN, NOT_IN, CONTAINS, STARTS_WITH, HAS_PROPERTY, NOT_HAS_PROPERTY, BETWEEN]
                    values:
                      type: array
                      items: { type: string }
        properties:
          type: array
          items: { type: string }
          description: "Whitelist de propiedades a devolver. Vacío = default del schema."
        sorts:
          type: array
          items:
            type: object
            properties:
              property_name: { type: string }
              direction:     { type: string, enum: [ASC, DESC], default: ASC }
        limit: { type: integer, format: int32, default: 50, maximum: 200 }
        after: { type: integer, format: int32, default: 0, description: "Offset para paginación" }

    SearchResponse:
      type: object
      properties:
        total: { type: integer, format: int64 }
        results:
          type: array
          items:
            type: object
            properties:
              id:         { type: string }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time, nullable: true }
              archived:   { type: boolean }
              properties:
                type: object
                additionalProperties: true
        paging:
          type: object
          properties:
            next_after: { type: integer, format: int32 }
            has_more:   { type: boolean }

    # ----- Domain entities -----
    User:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        email:                { type: string, format: email }
        first_name:           { type: string }
        last_name:            { type: string }
        document_number:      { type: string }
        phone:                { type: string, description: "Telefono del usuario. '' si no se cargo. Espejo del campo phone en HubSpot." }
        school_id:            { type: string, format: uuid, description: "'' si no pertenece a un colegio" }
        active:               { type: boolean }
        last_access_at:       { type: string, format: date-time, nullable: true }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time, nullable: true }
        is_superadmin:
          type: boolean
          description: "Si true, el user bypassa el chequeo de permisos. Solo otro superadmin puede setear este flag."
        must_change_password:
          type: boolean
          description: "Si true, todas las rutas excepto Me y ChangeMyPassword devuelven 403 PASSWORD_CHANGE_REQUIRED."

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:           { type: string, format: email }
        password:        { type: string, format: password, minLength: 8 }
        first_name:      { type: string }
        last_name:       { type: string }
        document_number: { type: string }
        phone:           { type: string, description: "Opcional. Se sincroniza a HubSpot junto con el resto del contacto." }
        school_id:       { type: string, format: uuid, description: "UUID del colegio. Opcional. Usar GET /api/schools para llenar el dropdown." }
        permission_group_id:
          type: integer
          format: int32
          description: "Opcional. Si >0, asigna el grupo al user recién creado en la misma llamada (evita el round-trip extra a /api/users/{id}/permissions/groups)."

    # ----- Permissions -----
    Permission:
      type: object
      description: |
        Permiso individual del catálogo. El catálogo lo gobierna Blue Nose
        vía migraciones SQL — el cliente solo lo lista (no lo edita).
      properties:
        id:          { type: integer, format: int32 }
        code:
          type: string
          description: "Código `<service>.<table>.<action>` (ej: `db_users.users.read`)"
        scope:
          type: string
          description: "Microservicio dueño del permiso (ej: `db_users`, `db_exams`, `analytics`)"
        name:        { type: string }
        description: { type: string }

    PermissionGroup:
      type: object
      description: |
        Grupo de permisos (rol). El cliente lo crea combinando permisos del
        catálogo. Los users se asignan a uno o más grupos vía
        `POST /api/users/{id}/permissions/groups`.
      properties:
        id:          { type: integer, format: int32 }
        code:
          type: string
          description: "Código único y estable del grupo (ej: `marketing_permissions`). No editable."
        name:        { type: string }
        description: { type: string }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time, nullable: true }
        permissions:
          type: array
          description: "Permisos individuales asociados al grupo (hidratados)."
          items: { $ref: '#/components/schemas/Permission' }

    CreatePermissionGroupRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: "Código único del grupo. Una vez creado no se puede editar."
        name:        { type: string }
        description: { type: string }
        permission_ids:
          type: array
          description: |
            Opcional. Si se pasan, los permisos quedan asociados al grupo en
            el momento de la creación. Se pueden agregar/quitar después con
            los endpoints de `/api/permission-groups/{id}/permissions/{permission_id}`.
          items: { type: integer, format: int32 }

    UpdatePermissionGroupRequest:
      type: object
      description: |
        Solo se pueden editar `name` y `description`. El `code` es la clave
        estable y no se modifica.
      properties:
        name:        { type: string }
        description: { type: string }

    School:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        user_id:            { type: string, format: uuid, description: "Usuario que representa al colegio" }
        name:               { type: string }
        active:             { type: boolean }
        hubspot_record_id:  { type: string, description: "ID del Custom Object Colegio en HubSpot. '' si todavía no se sincronizó." }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time, nullable: true }

    Exam:
      type: object
      properties:
        id:               { type: string, format: uuid }
        exam_type_id:     { type: integer, format: int32, description: "FK al catálogo exam_type" }
        school_id:        { type: string, format: uuid, description: "'' si exam abierto" }
        parent_exam_id:   { type: string, format: uuid, description: "'' si primera versión" }
        version:          { type: integer, format: int32 }
        name:             { type: string }
        start_at:         { type: string, format: date-time }
        end_at:           { type: string, format: date-time }
        max_participants: { type: integer, format: int32, description: "0 = ilimitado" }
        published:        { type: boolean }
        active:           { type: boolean }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time, nullable: true }

    CreateExamRequest:
      type: object
      required: [exam_type_code, name, start_at, end_at]
      properties:
        exam_type_code:    { type: string, enum: [vocacional, simulacro, habitos] }
        school_id:         { type: string, format: uuid }
        name:              { type: string }
        start_at:          { type: string, format: date-time }
        end_at:            { type: string, format: date-time }
        max_participants:  { type: integer, format: int32 }

    Question:
      type: object
      properties:
        id:         { type: string, format: uuid }
        text:       { type: string }
        category:   { type: string }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    QuestionOption:
      type: object
      properties:
        id:          { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        text:        { type: string }
        is_correct:  { type: boolean }
        sort_order:  { type: integer, format: int32 }

    ExamQuestion:
      type: object
      properties:
        exam_id:     { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        points:      { type: integer, format: int32 }
        sort_order:  { type: integer, format: int32 }

    Attempt:
      type: object
      properties:
        id:           { type: string, format: uuid }
        exam_id:      { type: string, format: uuid }
        user_id:      { type: string, format: uuid }
        key_id:       { type: string, format: uuid, description: "'' si no se usó key" }
        score:        { type: integer, format: int32 }
        max_score:    { type: integer, format: int32 }
        started_at:   { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }

    Key:
      type: object
      properties:
        id:             { type: string, format: uuid }
        code:           { type: string, description: "Código alfanumérico" }
        exam_type_id:   { type: integer, format: int32 }
        school_id:      { type: string, format: uuid, description: "'' en mode='lan'" }
        asesor_user_id: { type: string, format: uuid }
        mode:           { type: string, enum: [school, lan] }
        grade:          { type: string }
        section:        { type: string }
        valid_from:     { type: string, format: date-time, nullable: true }
        valid_to:       { type: string, format: date-time, nullable: true }
        max_uses:       { type: integer, format: int32, description: "0 = ilimitado" }
        current_uses:   { type: integer, format: int32 }
        active:         { type: boolean }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time, nullable: true }

    GenerateKeyRequest:
      type: object
      required: [exam_type_id, asesor_user_id, mode]
      properties:
        code:           { type: string, description: "Opcional — si vacío, se genera random" }
        exam_type_id:   { type: integer, format: int32 }
        school_id:      { type: string, format: uuid, description: "Requerido si mode=school" }
        asesor_user_id: { type: string, format: uuid }
        mode:           { type: string, enum: [school, lan] }
        grade:          { type: string }
        section:        { type: string }
        valid_from:     { type: string, format: date-time, nullable: true }
        valid_to:       { type: string, format: date-time, nullable: true }
        max_uses:       { type: integer, format: int32, default: 0 }

    Survey:
      type: object
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string }
        title:        { type: string }
        description:  { type: string }
        target_role:  { type: string, enum: [admin, asesor, coordinador, estudiante] }
        trigger_kind: { type: string, enum: [post_test, on_demand, recurring] }
        version:      { type: integer, format: int32 }
        published:    { type: boolean }
        active:       { type: boolean }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time, nullable: true }

    SurveyQuestion:
      type: object
      properties:
        id:           { type: string, format: uuid }
        survey_id:    { type: string, format: uuid }
        text:         { type: string }
        kind:         { type: string, enum: [scale, nps, single, multi, open] }
        sort_order:   { type: integer, format: int32 }
        options_json: { type: string, description: "JSON serializado, formato según kind" }
        required:     { type: boolean }

    SurveyResponse:
      type: object
      properties:
        id:              { type: string, format: uuid }
        survey_id:       { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        exam_attempt_id: { type: string, format: uuid }
        submitted_at:    { type: string, format: date-time }

    SurveyMetrics:
      type: object
      properties:
        survey_id:       { type: string, format: uuid }
        total_responses: { type: integer, format: int32 }
        per_question:
          type: array
          items:
            type: object
            properties:
              question_id:  { type: string, format: uuid }
              kind:         { type: string }
              count:        { type: integer, format: int32 }
              average:      { type: number, format: double, nullable: true, description: "Para scale/nps" }
              has_average:  { type: boolean }
              nps:          { type: integer, format: int32, nullable: true, description: "-100..100, solo para kind=nps" }
              has_nps:      { type: boolean }
              distribution:
                type: object
                additionalProperties: { type: integer, format: int32 }
                description: "Solo para single/multi: option_value → count"

    # ----- Analytics dashboards -----
    ExamTypeStats:
      type: object
      properties:
        attempts:      { type: integer, format: int32 }
        avg_score:     { type: number, format: double }
        avg_max_score: { type: number, format: double }

    AsesorDashboard:
      type: object
      properties:
        asesor_id:      { type: string, format: uuid }
        asesor_name:    { type: string }
        total_colegios: { type: integer, format: int32 }
        total_keys:     { type: integer, format: int32 }
        total_attempts: { type: integer, format: int32 }
        by_exam_type:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ExamTypeStats' }
        generated_at:   { type: string, format: date-time }

    ColegioDashboard:
      type: object
      properties:
        school_id:      { type: string, format: uuid }
        school_name:    { type: string }
        total_students: { type: integer, format: int32 }
        total_attempts: { type: integer, format: int32 }
        by_exam_type:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ExamTypeStats' }
        generated_at:   { type: string, format: date-time }

    EstudianteDashboard:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        student_name: { type: string }
        tests:
          type: array
          items: { $ref: '#/components/schemas/TestResult' }
        generated_at: { type: string, format: date-time }

    TestResult:
      type: object
      properties:
        exam_type_code: { type: string }
        exam_id:        { type: string, format: uuid }
        exam_name:      { type: string }
        score:          { type: integer, format: int32 }
        max_score:      { type: integer, format: int32 }
        submitted_at:   { type: string, format: date-time }

    ColegioComparativo:
      type: object
      properties:
        exam_type_code: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              school_id:   { type: string, format: uuid }
              school_name: { type: string }
              avg_score:   { type: number, format: double }
              attempts:    { type: integer, format: int32 }
        generated_at:   { type: string, format: date-time }

    HistoricoEstudiante:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/TestResult' }
        generated_at: { type: string, format: date-time }
